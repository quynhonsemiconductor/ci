name: Public-repo leak guard
description: >
  Deterministic guard for repositories that are public on purpose: plain regular
  expressions over the current tree — internal hostnames under qnsc.vn, internal
  @qnsc.vn mail, GUIDs outside tests, private IPv4/IPv6 addresses — with one
  allowlist file per repository for names that are intentionally public. No
  model, no network, no history walk (gitleaks owns history, for secrets); see
  leak_guard.py for the pattern list and what each one deliberately skips.

  The org's own Entra tenant GUID, Azure subscription id and AWS account
  number are patterns too, but they are never written down here: the caller
  feeds them at runtime from org variables, and a finding reports the file and
  line with the value redacted (this repo and its Actions logs are public).
  Per the identifier policy (2026-10-29) the AWS account pattern is not armed —
  callers pass nothing for it — and the Azure subscription id is tier 1: a
  finding means the value must be REMOVED, never allowlisted.

  The caller checks out first (fetch-depth: 1 is enough — this scans the tree,
  not the history) and the check FAILS on any unallowlisted finding unless
  report-only is set.

inputs:
  entra-tenant-id:
    description: >
      The org's Entra tenant GUID, from vars.ENTRA_TENANT_ID. Empty (default)
      disarms that single pattern — the summary line names which patterns ran.
    required: false
    default: ''
  azure-subscription-id:
    description: >
      The org's Azure subscription id (TIER 1), from vars.AZURE_SUBSCRIPTION_ID.
      Empty (default) disarms that single pattern. A finding can NEVER be
      allowlisted — the value is removed from the tree, per the identifier
      policy 2026-10-29 — and is reported with the value redacted.
    required: false
    default: ''
  aws-account-id:
    description: >
      The org's AWS account number. NOT armed by policy since 2026-10-29 (the
      account closes after the on-prem cutover); kept as an input for callers
      that have not caught up. Empty (default) disarms.
    required: false
    default: ''
  allowlist:
    description: >
      Path to the repository's allowlist, one entry per line, # comments and
      blanks ignored. Three kinds: `key:<regex>` suppresses an identifier
      finding (guid, entra-tenant) only when the finding is the VALUE of that
      key — the text before it ends with the key and `: ` or `=` and an
      optional quote. An entry containing `/` is a LITERAL single-file path
      (metacharacters and a trailing `/` are refused: directory scopes are
      what the identifier policy 2026-10-29 forbids). Any other entry is a
      regex matched against the finding's TEXT only. The Azure subscription
      id (tier 1) cannot be suppressed by any entry, and identifier findings
      print with their value redacted. A missing file at the default path
      means "no allowlist"; a missing custom path fails.
    required: false
    default: '.github/leak-guard-allowlist.txt'
  report-only:
    description: Log findings without failing the job (exit 0).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Scan the tree for internal names
      shell: bash
      env:
        ENTRA_TENANT_ID: ${{ inputs.entra-tenant-id }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
        ALLOWLIST: ${{ inputs.allowlist }}
        REPORT_ONLY: ${{ inputs.report-only }}
      run: |
        args=(--allowlist "$ALLOWLIST")
        # Runtime identifiers from the caller's variables: never echoed, never
        # defaulted in this file. An empty value disarms that one pattern.
        [ -n "$ENTRA_TENANT_ID" ] && args+=(--entra-tenant-id "$ENTRA_TENANT_ID")
        [ -n "$AZURE_SUBSCRIPTION_ID" ] && args+=(--azure-subscription-id "$AZURE_SUBSCRIPTION_ID")
        [ -n "$AWS_ACCOUNT_ID" ] && args+=(--aws-account-id "$AWS_ACCOUNT_ID")
        if [ "$REPORT_ONLY" = 'true' ]; then
          args+=(--report-only)
        fi
        python3 "${{ github.action_path }}/leak_guard.py" "${args[@]}"

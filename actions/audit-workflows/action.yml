name: Workflow security audit (zizmor)
description: >
  zizmor over the checked-out repository: is every workflow and composite action SAFE (injection, unpinned refs, excessive
  permissions, dangerous `pull_request_target`)? Phased: report-only until `blocking` is true.

  Lifted out of the reusable actions-security.yml so it can run as a job of its own (legacy shape) or beside actionlint in ONE job
  (`combine: true`). No checkout here: the caller checks out. The caller needs `security-events: write` for the SARIF upload.

inputs:
  path:
    description: >
      Single path to audit. zizmor takes exactly one input: a second positional argument is parsed as a remote owner/repo slug.
    required: false
    default: '.'
  min-severity:
    description: Minimum severity that fails the run when blocking (unknown, informational, low, medium, high).
    required: false
    default: medium
  min-confidence:
    description: Minimum confidence that fails the run when blocking (unknown, low, medium, high).
    required: false
    default: unknown
  blocking:
    description: Fail on findings at or above min-severity. Phased rollout, as for the reusable workflow.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # TODO: pin to a full commit SHA (org convention) once this has run once
    # and the resolved SHA is visible in the Actions log — not verified here.
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install zizmor
      shell: bash
      run: pip install --disable-pip-version-check zizmor==1.5.2

    - name: zizmor scan (SARIF)
      shell: bash
      env:
        ZIZMOR_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        zizmor --format sarif --no-progress "$ZIZMOR_PATH" > zizmor.sarif

    - name: Upload SARIF (GHAS UI — advisory on free plan)
      if: always()
      continue-on-error: true # requires GitHub Advanced Security (free plan: no-op)
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      with:
        sarif_file: zizmor.sarif
        category: zizmor-actions

    - name: zizmor scan (console + gate)
      shell: bash
      env:
        ZIZMOR_PATH: ${{ inputs.path }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        BLOCKING: ${{ inputs.blocking }}
      run: |
        set +e
        zizmor --min-severity "$MIN_SEVERITY" --min-confidence "$MIN_CONFIDENCE" --no-progress "$ZIZMOR_PATH"
        code=$?
        set -e
        if [ "$code" -ne 0 ]; then
          if [ "$BLOCKING" = "true" ]; then
            echo "::error::zizmor found findings at or above severity=${MIN_SEVERITY}/confidence=${MIN_CONFIDENCE} (blocking)"
            exit "$code"
          fi
          echo "::warning::zizmor found findings at or above severity=${MIN_SEVERITY}/confidence=${MIN_CONFIDENCE} (report-only; set blocking=true to enforce)"
        fi

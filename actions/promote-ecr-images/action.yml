name: Promote ECR Images
description: >
  Retag existing ECR images from source-tag to release-tag without rebuilding.
  Used to promote the exact sha-xxx image tested in develop to a semver prod tag.
  Caller must have already run setup-aws-oidc with ECR push permissions.

inputs:
  image-names:
    description: >
      Comma-separated ECR repository names to promote,
      e.g. `rally-api,rally-worker,rally-migrator`
    required: true
  source-tag:
    description: >
      Existing image tag to promote from, e.g. `sha-abc1234`.
      Must already exist in ECR — typically the sha tag from the develop deploy.
    required: true
  release-tag:
    description: >
      Target tag to promote to, e.g. `v1.2.3`.
    required: true
  region:
    description: AWS region where ECR repositories live
    required: true

outputs:
  promoted-images:
    description: Newline-separated list of `repo:release-tag` that were promoted
    value: ${{ steps.promote.outputs.promoted }}

runs:
  using: composite
  steps:
    - name: Promote ${{ inputs.source-tag }} → ${{ inputs.release-tag }}
      id: promote
      shell: bash
      env:
        SOURCE_TAG:  ${{ inputs.source-tag }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        REGION:      ${{ inputs.region }}
        IMAGE_NAMES: ${{ inputs.image-names }}
      run: |
        set -euo pipefail
        PROMOTED=""

        IFS=',' read -ra REPOS <<< "$IMAGE_NAMES"
        for repo in "${REPOS[@]}"; do
          repo="${repo// /}"  # trim whitespace
          echo "── Promoting $repo: ${SOURCE_TAG} → ${RELEASE_TAG}"

          MANIFEST=""
          # The release-commit's develop build may still be pushing sha-<sha> when this
          # prod promote runs (same merge triggers both). Poll up to ~10 min.
          for attempt in $(seq 1 40); do
            MANIFEST=$(aws ecr batch-get-image \
              --repository-name "$repo" \
              --image-ids imageTag="${SOURCE_TAG}" \
              --region "${REGION}" \
              --query 'images[0].imageManifest' --output text 2>/dev/null || echo "")
            if [[ -n "$MANIFEST" && "$MANIFEST" != "None" ]]; then
              break
            fi
            echo "  [${attempt}/40] $repo:${SOURCE_TAG} not in ECR yet — waiting for the develop build (15s)…"
            sleep 15
          done

          if [[ -z "$MANIFEST" || "$MANIFEST" == "None" ]]; then
            echo "ERROR: $repo:${SOURCE_TAG} not found in ECR after ~10 min."
            echo "The commit must be merged to main and deployed to develop before tagging a release."
            exit 1
          fi

          # IDEMPOTENT: `put-image` fails with ImageAlreadyExistsException when the
          # release tag already points at this exact digest, which is the state after a
          # successful promote. Re-running a prod deploy is ordinary — to pick up a task
          # definition an infra apply registered afterwards, or to retry a transient
          # failure — and it used to abort here before reaching the (approval-gated)
          # deploy job, leaving the release un-deployable through the pipeline.
          #
          # Tolerated ONLY when the digest matches. A release tag pointing at a
          # DIFFERENT digest is a genuine error: it means the tag was moved, so the
          # artifact behind vX.Y.Z is not the one this run built, and silently
          # continuing would deploy something nobody reviewed.
          EXISTING=$(aws ecr batch-get-image \
            --repository-name "$repo" \
            --image-ids imageTag="${RELEASE_TAG}" \
            --region "${REGION}" \
            --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || echo "")
          SOURCE_DIGEST=$(aws ecr batch-get-image \
            --repository-name "$repo" \
            --image-ids imageTag="${SOURCE_TAG}" \
            --region "${REGION}" \
            --query 'images[0].imageId.imageDigest' --output text 2>/dev/null || echo "")

          if [[ -n "$EXISTING" && "$EXISTING" != "None" ]]; then
            if [[ "$EXISTING" == "$SOURCE_DIGEST" ]]; then
              echo "  $repo:${RELEASE_TAG} already points at ${SOURCE_DIGEST} — nothing to do."
            else
              echo "ERROR: $repo:${RELEASE_TAG} already exists but points at a DIFFERENT image."
              echo "  existing: ${EXISTING}"
              echo "  expected: ${SOURCE_DIGEST} (from ${SOURCE_TAG})"
              echo "A release tag must be immutable. Refusing to move it."
              exit 1
            fi
          else
            aws ecr put-image \
              --repository-name "$repo" \
              --image-tag "${RELEASE_TAG}" \
              --image-manifest "$MANIFEST" \
              --region "${REGION}" \
              --output text > /dev/null
          fi

          echo "✓ $repo: ${SOURCE_TAG} → ${RELEASE_TAG}"
          PROMOTED="${PROMOTED}${repo}:${RELEASE_TAG}"$'\n'
        done

        echo "promoted<<EOF" >> "$GITHUB_OUTPUT"
        echo "$PROMOTED"     >> "$GITHUB_OUTPUT"
        echo "EOF"           >> "$GITHUB_OUTPUT"

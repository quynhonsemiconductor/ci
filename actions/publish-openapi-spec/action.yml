name: Publish OpenAPI Spec
description: >
  Upload the generated OpenAPI spec as a GitHub Actions artifact, for the
  same-run contract check (`validate-openapi-contract`) and the web repo's
  codegen step.

  The former S3 path was AWS-era: no caller ever set `s3-upload`, and the AWS
  account is closed. Artifact only.

inputs:
  spec-path:
    description: Path to the generated OpenAPI spec file (relative to workspace root)
    required: false
    default: openapi.json
  artifact-name:
    description: Name of the GitHub Actions artifact to upload
    required: false
    default: openapi-spec
  retention-days:
    description: Number of days to retain the GitHub artifact
    required: false
    default: '30'

outputs:
  artifact-name:
    description: Name of the uploaded GitHub artifact
    value: ${{ steps.upload.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Verify spec exists
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
      run: |
        if [ ! -f "$SPEC_PATH" ]; then
          echo "::error ::OpenAPI spec not found at '${SPEC_PATH}'"
          echo "  Run the openapi generation step before calling publish-openapi-spec."
          exit 1
        fi
        LINES=$(wc -l < "$SPEC_PATH")
        SIZE=$(wc -c < "$SPEC_PATH")
        echo "✓ Spec found: ${SPEC_PATH} (${SIZE} bytes, ${LINES} lines)"

    - name: Upload as GitHub artifact
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.spec-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}

name: Setup OpenTofu + AWS OIDC
description: >
  Install OpenTofu and authenticate to AWS via GitHub OIDC.
  Use this in any job that runs `tofu init / plan / apply`.

inputs:
  role-arn:
    description: IAM role ARN to assume via OIDC (e.g. arn:aws:iam::123456789012:role/my-role).
    required: true
  aws-region:
    description: AWS region.
    required: false
    default: ap-southeast-1
  tofu-version:
    description: OpenTofu version to install.
    required: false
    default: "1.9.1"
  git-token:
    description: >
      Optional token used to fetch PRIVATE Terraform modules over HTTPS during
      `tofu init` (e.g. git::https://github.com/<org>/qnsc-tf-modules.git//...).
      When set, git is configured to send it as credentials for github.com.
      Leave empty when all module sources are public or local paths.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Authenticate HTTPS git fetches to github.com so `tofu init` can clone
    # PRIVATE module repos (e.g. qnsc-tf-modules). Without this, git prompts for
    # a username on a private source and fails: "could not read Username for
    # 'https://github.com'". Scoped to github.com only; the token is short-lived
    # (a GitHub App installation token, ~1h) and never written to the repo.
    - name: Configure git auth for private module fetch
      if: ${{ inputs.git-token != '' }}
      shell: bash
      env:
        GIT_TOKEN: ${{ inputs.git-token }}
      run: |
        git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
      with:
        tofu_version: ${{ inputs.tofu-version }}
        # Install the REAL tofu binary, not the default wrapper. The wrapper
        # captures stdout/stderr/exit-code as step outputs and makes `tofu`
        # itself exit 0, which silently breaks `-detailed-exitcode`,
        # `$?` and `${PIPESTATUS[0]}` (apply-gating / plan error detection).
        tofu_wrapper: false

    - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region:     ${{ inputs.aws-region }}

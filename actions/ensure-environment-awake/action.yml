name: Ensure environment is awake
description: >
  Start the RDS instance if something stopped it, wait for it to become available, and
  scale the ECS services back to one task if they are at zero.

  IDEMPOTENT AND CHEAP WHEN ALREADY AWAKE — two describe calls and no waiting — which is
  what lets it be called twice in one deploy: once early, in parallel with the image
  build, and once inside the deploy job as the guarantee that migrations have a database.

  Extracted from backend-deploy.yml so those two call sites cannot drift. It was 66 lines
  of shell carrying three hard-won constants; a copy-paste second copy would have been the
  next thing to go stale.

inputs:
  rds-identifier:
    description: RDS instance id. Empty skips the database half entirely.
    required: false
    default: ''
  ecs-cluster:
    description: ECS cluster name. Empty skips the service half.
    required: false
    default: ''
  ecs-services:
    description: >
      Space-separated ECS service names to restore to one task. Empty entries are
      skipped, so a product without a worker can pass just its api.
    required: false
    default: ''
  region:
    description: AWS region.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        AWS_REGION: ${{ inputs.region }}
        RDS_IDENTIFIER: ${{ inputs.rds-identifier }}
        ECS_CLUSTER: ${{ inputs.ecs-cluster }}
        ECS_SERVICES: ${{ inputs.ecs-services }}
      run: |
        # ── RDS: start it if something stopped it, then wait for available ──
        ensure_rds() {
          [ -z "$RDS_IDENTIFIER" ] && { echo "No RDS_INSTANCE_ID var — skipping RDS guard."; return 0; }
          local status
          status=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_IDENTIFIER" --region "$AWS_REGION" \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "not-found")
          echo "RDS status: $status"
          [ "$status" = "available" ] && return 0
          if [ "$status" = "stopped" ]; then
            echo "RDS is stopped — starting it now..."
            aws rds start-db-instance \
              --db-instance-identifier "$RDS_IDENTIFIER" --region "$AWS_REGION" >/dev/null \
              || echo "::warning::start-db-instance failed; will keep polling in case another actor started it"
          fi
          # 15 minutes, from ONE pair of constants. The budget used to be 8 minutes
          # restated in three places (the banner, the loop bound, the failure line), and a
          # cold start of a stopped single-AZ instance regularly exceeds it — rova's
          # 2026-08-05 deploy timed out at 8:00 and the instance came up shortly after, so
          # the retry passed with no change. Note what that failure looks like: this step
          # SUCCEEDS in starting RDS and then fails on the wait, leaving a woken database,
          # no new code, and a red deploy that would have passed a minute later.
          #
          # Deliberately still a hard failure rather than a warning: the migration step
          # cannot run without the database, so continuing only moves the error somewhere
          # less obvious. The budget was wrong, not the strictness.
          local attempts=60 interval=15
          echo "Waiting for RDS to become available (timeout: $(( attempts * interval / 60 )) min)..."
          for i in $(seq 1 "$attempts"); do
            sleep "$interval"
            status=$(aws rds describe-db-instances \
              --db-instance-identifier "$RDS_IDENTIFIER" --region "$AWS_REGION" \
              --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "unknown")
            echo "  [${i}/${attempts}] RDS: $status"
            [ "$status" = "available" ] && { echo "RDS is available."; return 0; }
          done
          echo "Timed out waiting for RDS after $(( attempts * interval / 60 )) minutes."
          return 1
        }
        ensure_rds

        # ── ECS: restore any service left at 0, otherwise the
        #    deploy starts no tasks and the verify step times out. ──
        # Unquoted on purpose: the input is a space-separated list and needs splitting.
        # An empty cluster skips the whole half, as the input documentation promises —
        # without this the loop would call `aws ecs describe-services --cluster ""`.
        if [ -z "$ECS_CLUSTER" ]; then
          echo "No ECS cluster given — skipping the service guard."
          ECS_SERVICES=""
        fi
        for SVC in $ECS_SERVICES; do
          [ -z "$SVC" ] && continue
          desired=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$SVC" --region "$AWS_REGION" \
            --query 'services[0].desiredCount' --output text 2>/dev/null || echo "0")
          if [ "$desired" = "0" ]; then
            echo "ECS $SVC is scaled to 0 — scaling up to 1"
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SVC" \
              --desired-count 1 --region "$AWS_REGION" >/dev/null
          else
            echo "ECS $SVC desiredCount=$desired — no scale-up needed"
          fi
        done

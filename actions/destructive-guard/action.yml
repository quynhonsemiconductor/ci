name: destructive-guard
description: >
  Fail the job when the saved OpenTofu plan DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource
  (Cloudflare records, Pages, R2, tunnels; Route 53; SES; ACM; KMS; the CI OIDC roles), unless the pull request that is
  being planned or merged carries the label `allow-dns-destroy` (or a manual dispatch passed `dispatch-allow: true`).

  Why it exists: on 2026-10-09 a provider lock-file bump was merged with a green check; the plan printed in the PR said
  nine resources 'must be replaced' (zone_id -> null) and the apply workflow applied exactly that plan, unreviewed. The
  destroys succeeded, the re-creates could not, and a landing site, SES DKIM and an ACM validation record were down for
  three days. `plan-guard` covers DATA types; this covers what serves traffic and who we are. See
  infra/docs/incidents/2026-10-09-edge-dns.md.

  It is a LABEL, not plan-guard's committed file, on purpose: the plan can turn destructive with no file in the
  repository edited (a lock bump, an empty variable, a provider upgrade), so the decision has to attach to the PR being
  merged. The label is read LIVE from the API, because re-running a failed job reuses the original event payload and a
  label added after the failure would otherwise be invisible. If the lookup fails the guard refuses; it never opens.
  The allowed addresses are written to the job summary, so the record outlives the label.

  Needs `pull-requests: read` on the calling job. Run it after `tofu plan -out=<file>` and BEFORE `tofu apply`.

  MODE `drift` (nightly drift jobs): classifies a `tofu plan -refresh-only -out=<file>` instead, with the same protected list.
  A resource deleted outside OpenTofu, or a change to a protected resource, is class 2; other drift (provider-computed
  attributes) is class 3, informational; none is 0; input that is not a plan is 1. The step never fails on 2 or 3:
  the caller decides, using the `class` output.

inputs:
  mode:
    description: "'plan' (default): refuse destructive changes in a plan about to be applied. 'drift': classify a refresh-only plan."
    required: false
    default: plan
  working-directory:
    description: The stack directory holding the saved plan.
    required: true
  plan-file:
    description: The binary plan produced by `tofu plan -out=<file>`, relative to the working directory.
    required: false
    default: tfplan
  pr-number:
    description: "Pull request number (plan workflow). Leave empty on a push; the PR is then found from the commit."
    required: false
    default: ""
  dispatch-allow:
    description: "'true' when a manual workflow_dispatch passed an allow input."
    required: false
    default: "false"
  label:
    description: The label that allows a destroy.
    required: false
    default: allow-dns-destroy

outputs:
  class:
    description: "mode drift only: 0 none, 3 informational, 2 matters, 1 could not classify."
    value: ${{ steps.drift.outputs.class }}

runs:
  using: composite
  steps:
    # `mode` is validated, case-sensitively, before anything else: a typo ('Drift', 'plan ') would otherwise select neither
    # branch's step guard cleanly and could skip the guard while the job stays green. Fail closed.
    - name: Validate mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          plan|drift) ;;
          *) echo "::error title=destructive-guard::unknown mode '$MODE' (expected exactly 'plan' or 'drift')"; exit 1;;
        esac

    - name: Classify external drift
      id: drift
      if: ${{ inputs.mode == 'drift' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN_FILE: ${{ inputs.plan-file }}
        REPORT: ${{ github.action_path }}/drift_report.py
      run: |
        set +e
        if [ ! -f "$PLAN_FILE" ]; then echo "::error title=destructive-guard::No plan file at '$PLAN_FILE'"; echo "class=1" >> "$GITHUB_OUTPUT"; exit 0; fi
        tofu show -json "$PLAN_FILE" | python3 "$REPORT"
        echo "class=${PIPESTATUS[1]}" >> "$GITHUB_OUTPUT"

    - name: Resolve the allow label
      id: label
      if: ${{ inputs.mode != 'drift' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        PR: ${{ inputs.pr-number }}
        DISPATCH_ALLOW: ${{ inputs.dispatch-allow }}
        EVENT: ${{ github.event_name }}
        WANT: ${{ inputs.label }}
      run: |
        set -uo pipefail
        allow=false
        labels=""
        source=""
        endpoint=""
        err="$(mktemp)"
        if [ "$EVENT" = workflow_dispatch ]; then
          if [ "$DISPATCH_ALLOW" = true ]; then allow=true; source="the allow_destructive dispatch input"; fi
        elif [ -n "$PR" ]; then
          endpoint="repos/$REPO/issues/$PR/labels"
        else
          endpoint="repos/$REPO/commits/$SHA/pulls"
        fi
        if [ -n "$endpoint" ]; then
          # The API's own error goes to the log. It used to be `2>/dev/null || true`, which made "the lookup
          # failed" indistinguishable from "the pull request has no label", and the refusal that followed
          # said nothing about why. The guard still FAILS CLOSED either way; this only says which it was.
          if raw="$(gh api "$endpoint" 2>"$err")"; then
            if [ -n "$PR" ]; then
              labels="$(jq -r '[.[].name] | join(",")' <<<"$raw")"
            else
              prs="$(jq 'length' <<<"$raw")"
              [ "$prs" = 0 ] && echo "::notice title=destructive-guard::no pull request is associated with $SHA (a direct push?), so there is no label to read"
              labels="$(jq -r '[.[].labels[].name] | join(",")' <<<"$raw")"
            fi
          else
            echo "::warning title=destructive-guard::label lookup FAILED ($endpoint), treating as no label: $(tr '\n' ' ' < "$err")"
          fi
          case ",$labels," in
            *",$WANT,"*)
              allow=true
              if [ -n "$PR" ]; then source="the $WANT label on PR #$PR"; else source="the $WANT label on the PR for commit $SHA"; fi;;
          esac
        fi
        echo "labels: [${labels}]  allow=$allow"
        echo "allow=$allow" >> "$GITHUB_OUTPUT"
        echo "source=$source" >> "$GITHUB_OUTPUT"

    - name: Refuse to delete or replace DNS / identity resources
      if: ${{ inputs.mode != 'drift' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN_FILE: ${{ inputs.plan-file }}
        ALLOW: ${{ steps.label.outputs.allow }}
        GUARD_OVERRIDE_SOURCE: ${{ steps.label.outputs.source }}
        GUARD: ${{ github.action_path }}/destructive_guard.py
      run: |
        set -euo pipefail
        if [ ! -f "$PLAN_FILE" ]; then
          echo "::error title=destructive-guard::No plan file at '$PLAN_FILE'. Run this AFTER 'tofu plan -out=$PLAN_FILE' in the same job. A missing plan is not an empty plan."
          exit 1
        fi
        flag=""; [ "$ALLOW" = true ] && flag="--allow"
        # straight into the guard: the JSON carries the prior state and is never written to disk
        tofu show -json "$PLAN_FILE" | python3 "$GUARD" $flag

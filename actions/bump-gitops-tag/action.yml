name: Bump a service image tag in gitops
description: >
  Point one service at a new image by editing gitops/values/<product>/<env>.yaml,
  which is what makes ArgoCD deploy it.

  §11 — this is the whole delivery mechanism. A product repository never touches a
  cluster: it builds an image and edits one line in another repository. ArgoCD
  reconciles from there.

  §10b — the identity that runs this must NOT be able to write prod.yaml. Promotion
  to production is a reviewed pull request, and a token that can bypass it makes
  branch protection on `gitops` decorative. Pass a token scoped to the dev path, or
  set `mode: pull-request` and let a human approve.

inputs:
  product:
    description: 'Short slug — rova · opshub · kb. NOT qnsc-kb (§7c).'
    required: true
  env:
    description: 'dev | prod. Never develop/production (§7c).'
    required: true
  services:
    description: 'Space-separated service names, e.g. "api worker migrator".'
    required: true
  tag:
    description: >
      Image tag. `sha-<commit>` for dev, `v<version>` for prod (§11).
      NEVER `latest` — that is how a develop build reached a production task
      definition (qnsc-kb-backend/infra/live/prod/main.tf:104).
    required: true
  digests:
    description: >
      Optional JSON object mapping service to image digest, e.g.
      {"api":"sha256:..","worker":"sha256:.."}. When set, each listed service also
      gets `image.digest` written next to `image.tag`; the chart pins the digest
      (it wins over the tag) and the tag stays for people to read. Every service in
      `services` must have an entry. Each digest must match ^sha256:[0-9a-f]{64}$.
    default: ''
  mode:
    description: 'commit (dev) | pull-request (prod). Production is always a reviewed diff.'
    default: commit
  auto-merge:
    description: >
      pull-request mode only: enable auto-merge (squash) on the PR it opens. The PR still has to
      satisfy gitops's branch rules; auto-merge only removes the manual click. Dev only — prod with
      auto-merge is refused, because the owner's merge is the production gate (§10b).
    default: 'false'
  render:
    description: >
      'true' (default) | 'false'. After the tags are written, run the target repo's scripts/render.sh when
      it exists and commit its rendered/ output in the SAME commit. gitops CI fails a PR whose rendered/
      is stale, and this action only edits a tags file, so without it no bot PR could ever pass.
    default: 'true'
  helm-version:
    description: 'helm version for scripts/render.sh. Keep equal to HELM_VERSION in the target repo chart-ci workflow (the render must match what its CI renders).'
    default: '4.3.0'
  gitops-repo:
    default: quynhonsemiconductor/gitops
  gitops-token:
    description: 'Token with write access to gitops. Scope it to what this env may change.'
    required: true

outputs:
  changed:
    description: 'true when the tag actually moved. A no-op re-run is not a deploy.'
    value: ${{ steps.bump.outputs.changed }}
  pr-url:
    description: 'Set when mode = pull-request.'
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    # ── WHY EVERY `run:` BELOW READS `env:` AND NEVER `${{ inputs.x }}` ────────
    # A `${{ }}` expression inside a `run:` body is substituted into the script
    # TEXT before bash starts, so an input containing `$(...)` or a newline stops
    # being a value and becomes a command. zizmor calls this template-injection
    # and flagged this file, correctly.
    #
    # It matters more here than in most actions: this composite holds a token
    # with write access to `gitops`, and §10b makes that token the thing standing
    # between a build and production. Through `env:` the value is a variable bash
    # reads, never text bash parses.
    #
    # `if:` conditions are a different thing — they are evaluated by the runner,
    # never by a shell, so `inputs.mode` there is not a sink.
    - name: Reject a mutable tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        ENV: ${{ inputs.env }}
      run: |
        # §11 — the chart's schema rejects `latest` too, but failing here means the
        # image is never even referenced, and the error names the cause rather than
        # surfacing as a schema violation three steps later.
        if [[ "$TAG" == "latest" || "$TAG" == *":latest" ]]; then
          echo "::error::refusing to write a mutable tag. Use sha-<commit> for dev or v<version> for prod (§11)."
          exit 1
        fi
        if [[ "$ENV" != "dev" && "$ENV" != "prod" ]]; then
          echo "::error::env must be dev or prod, never develop/production (§7c)."
          exit 1
        fi

    # persist-credentials stays false (zizmor artipacked): the token would
    # otherwise be written into .gitops/.git/config and travel with any artifact.
    # The two push paths below supply it env-only for their git commands.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.gitops-repo }}
        token: ${{ inputs.gitops-token }}
        path: .gitops
        persist-credentials: false

    - name: Bump
      id: bump
      shell: bash
      working-directory: .gitops
      env:
        PRODUCT: ${{ inputs.product }}
        ENV: ${{ inputs.env }}
        SERVICES: ${{ inputs.services }}
        TAG: ${{ inputs.tag }}
        DIGESTS: ${{ inputs.digests }}
      run: |
        set -euo pipefail
        # ── THE MACHINE-OWNED FILE ────────────────────────────────────────
        # NOT <env>.yaml. `yq -i` rewrites a whole file, and the values files
        # carry reasoning transcribed from the live OpenTofu — why qnsc-kb's api
        # stays off Spot, why clamav needs 2 GB, why the worker is pinned at one
        # replica. A tag bump must not be able to reflow or drop any of it, and it
        # would run on EVERY merge to main.
        #
        # So the machine owns this file and humans own the others. It also makes
        # a promotion pull request a three-line diff rather than a diff against
        # a file full of prose (§11).
        file="values/${PRODUCT}/tags.${ENV}.yaml"
        [ -f "$file" ] || { echo "::error::$file not found. A product with no $file has no ${ENV} Application (§5c)."; exit 1; }

        before=$(sha256sum "$file" | cut -d' ' -f1)
        for svc in $SERVICES; do
          # The tag arrives as a yq STRVAR rather than inside the expression, for
          # the same reason it arrives here as an env var rather than as a workflow
          # expression (braces omitted deliberately — see below):
          # yq has its own expression language, and interpolating into it is the
          # same bug one layer down.
          TAG="$TAG" svc="$svc" yq -i '.services[strenv(svc)].image.tag = strenv(TAG)' "$file"
          if [ -n "$DIGESTS" ]; then
            digest=$(jq -er --arg s "$svc" '.[$s]' <<< "$DIGESTS") \
              || { echo "::error::digests has no entry for $svc"; exit 1; }
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::bad digest for $svc"; exit 1; }
            digest="$digest" svc="$svc" yq -i '.services[strenv(svc)].image.digest = strenv(digest)' "$file"
          else
            # A tag-only bump must not leave an older digest behind: the chart pins
            # the digest and ignores the tag, so a stale one keeps the old image.
            svc="$svc" yq -i 'del(.services[strenv(svc)].image.digest)' "$file"
          fi
        done
        after=$(sha256sum "$file" | cut -d' ' -f1)

        if [ "$before" = "$after" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "tag already $TAG — nothing to deploy"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat
        fi

    # ── RENDER, IN THE SAME COMMIT ────────────────────────────────────────────
    # gitops requires rendered/ to equal `scripts/render.sh` output (golden render). A tags bump changes
    # the manifests, so the commit must carry the re-render or its own CI fails. Pinned helm: a different
    # helm version can reflow the output and fail the same check.
    - name: Install helm (pinned)
      if: inputs.render == 'true' && steps.bump.outputs.changed == 'true' && hashFiles('.gitops/scripts/render.sh') != ''
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: ${{ inputs.helm-version }}

    - name: Render
      id: render
      if: inputs.render == 'true' && steps.bump.outputs.changed == 'true' && hashFiles('.gitops/scripts/render.sh') != ''
      shell: bash
      working-directory: .gitops
      run: |
        set -euo pipefail
        ./scripts/render.sh
        # New files (a product/env rendered for the first time) must travel too; the commit steps use
        # `git add -A`. Show what the render changed.
        git status --short rendered/ || true

    - name: Commit (dev)
      if: inputs.mode == 'commit' && steps.bump.outputs.changed == 'true'
      shell: bash
      working-directory: .gitops
      env:
        PRODUCT: ${{ inputs.product }}
        ENV: ${{ inputs.env }}
        TAG: ${{ inputs.tag }}
        GIT_TOKEN: ${{ inputs.gitops-token }}
      run: |
        set -euo pipefail
        git config user.name  "qnsc-ci"
        git config user.email "ci@qnsc.vn"
        # Auth env-only (same form as release-promote.yml): GIT_CONFIG_* applies
        # to these git commands and writes nothing to .git/config.
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:${GIT_TOKEN}" | base64 | tr -d '\n')"
        # Stage ONLY the machine-owned values file and its render. `git add -A`
        # would put unrelated work in a bot commit — and on dev that breaks the
        # gitops bot-scope rule the auto-merge depends on. -A (with the explicit
        # paths) also stages a render that is new or deleted, which the gitops
        # stale-render gate needs.
        if [ -e "rendered/${PRODUCT}/${ENV}.yaml" ] || git ls-files --error-unmatch "rendered/${PRODUCT}/${ENV}.yaml" >/dev/null 2>&1; then
          git add -A -- "values/${PRODUCT}/tags.${ENV}.yaml" "rendered/${PRODUCT}/${ENV}.yaml"
        else
          git add -A -- "values/${PRODUCT}/tags.${ENV}.yaml"
        fi
        git diff --cached --quiet && { echo "::error::nothing staged for ${PRODUCT} ${ENV}"; exit 1; }
        git commit -m "chore(${PRODUCT}): ${ENV} -> ${TAG}"
        # Rebase rather than merge: two products bumping concurrently is normal,
        # and a merge commit per deploy makes the promotion diff unreadable.
        for i in 1 2 3; do
          git pull --rebase --autostash && git push && exit 0
          sleep $((i * 5))
        done
        echo "::error::could not push after 3 attempts"; exit 1

    - name: Open a pull request
      id: pr
      if: inputs.mode == 'pull-request' && steps.bump.outputs.changed == 'true'
      shell: bash
      working-directory: .gitops
      env:
        GH_TOKEN: ${{ inputs.gitops-token }}
        GIT_TOKEN: ${{ inputs.gitops-token }}
        PRODUCT: ${{ inputs.product }}
        ENV: ${{ inputs.env }}
        TAG: ${{ inputs.tag }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
      run: |
        set -euo pipefail
        if [ "$ENV" = "prod" ]; then
          branch="promote/${PRODUCT}-${TAG}"
          # Conventional-commit type (gitops checks PR titles); "promote" is not a type.
          title="chore(${PRODUCT}): promote prod to ${TAG}"
        else
          # dev: a plain bump, named per image so a re-run of the same build cannot clash with
          # a different one. A conventional-commit title (chore), not a promotion.
          branch="bump/${PRODUCT}-${ENV}-${TAG}"
          title="chore(${PRODUCT}): ${ENV} -> ${TAG}"
        fi
        # Production's merge IS the gate (§10b). Auto-merge would remove the only
        # review a prod change gets; refuse it rather than let a caller do it by accident.
        if [ "$ENV" = "prod" ] && [ "$AUTO_MERGE" = "true" ]; then
          echo "::error::auto-merge is refused for prod: the owner's merge is the production gate (§10b)."
          exit 1
        fi
        git config user.name  "qnsc-ci"
        git config user.email "ci@qnsc.vn"
        git checkout -b "$branch"
        # Stage ONLY the machine-owned values file and its render (see the commit
        # step): a promotion PR must stay a three-line diff. -A stages a render
        # that is new or deleted too.
        if [ -e "rendered/${PRODUCT}/${ENV}.yaml" ] || git ls-files --error-unmatch "rendered/${PRODUCT}/${ENV}.yaml" >/dev/null 2>&1; then
          git add -A -- "values/${PRODUCT}/tags.${ENV}.yaml" "rendered/${PRODUCT}/${ENV}.yaml"
        else
          git add -A -- "values/${PRODUCT}/tags.${ENV}.yaml"
        fi
        git diff --cached --quiet && { echo "::error::nothing staged for ${PRODUCT} ${ENV}"; exit 1; }
        git commit -m "$title"
        # Auth env-only (same form as release-promote.yml): nothing is written
        # to .git/config, so the token never rests in the checkout.
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s' "x-access-token:${GIT_TOKEN}" | base64 | tr -d '\n')"
        git push -u origin "$branch"
        if [ "$ENV" = "prod" ]; then
          body="$(cat <<'BODY'
        §11 — promotion is a reviewable diff.

        Before this existed, a version tag applied whatever `main` contained, which
        is why rova production ran code from before 7 September while `main` was 44
        commits ahead — and why an alerting fix could not reach production without
        shipping nine features.

        The image below already ran in dev. This changes which tag production
        points at; it builds nothing.

        Rollback: revert this commit.
        BODY
        )"
        else
          body="Automated dev bump of the machine-owned tags file. It builds nothing; the image was published by the product's publish workflow. Rollback: revert this commit."
        fi
        url=$(gh pr create --title "$title" --body "$body")
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "::notice::$url"
        if [ "$AUTO_MERGE" = "true" ]; then
          gh pr merge "$url" --auto --squash
        fi

name: Validate OpenAPI Contract
description: >
  Detect breaking API changes between the current OpenAPI spec and a base spec
  (usually the spec on the target branch for PRs).

  Uses `oasdiff` — "OpenAPI diff" — to compare specs and flag backwards-
  incompatible changes (removed endpoints, renamed fields, type changes, removed
  success statuses, etc.) before they reach production and break clients.

  ERR-level breaking changes FAIL this action. WARNING-level changes are printed
  but do not fail. An intentional breaking change is let through only on purpose:
  `allow-breaking: 'true'`, or the PR label named by `allow-breaking-label`. Either
  way it is logged as a warning and written to the job summary, never silent.

  A failure of oasdiff itself (a spec that does not parse, a missing binary)
  always fails the action, whatever the inputs say.

  In CI: download the base branch spec as an artifact from the previous build,
  then run this action against it before merging.

inputs:
  current-spec-path:
    description: >
      Path to the current OpenAPI spec (relative to workspace root).
      Typically generated by the `openapi` CI job and downloaded as an artifact.
    required: false
    default: openapi.json
  base-spec-path:
    description: >
      Path to the base (reference) OpenAPI spec to compare against.
      Download this from the `openapi` artifact on the base branch before calling
      this action. When the file does not exist the comparison is SKIPPED, with a
      warning (a first run has no base yet).
    required: false
    default: base-openapi.json
  fail-on-breaking:
    description: >
      Fail the action if ERR-level breaking changes are detected. `true` or `false`.
      `false` turns the gate into a warning for every pull request: prefer
      `allow-breaking` for one intentional change.
    required: false
    default: 'true'
  allow-breaking:
    description: >
      Explicit, per-change escape hatch for an INTENTIONAL breaking change: `true` lets
      ERR-level changes pass. They are still printed, raised as a warning annotation and
      written to the job summary. `true` or `false`.
    required: false
    default: 'false'
  allow-breaking-label:
    description: >
      Name of a pull request label that has the same effect as `allow-breaking: 'true'`.
      Read from the event payload of THIS run: add the label and push (or trigger on
      `labeled`); re-running an old run does not see a label added afterwards, and then
      the action fails, which is the safe direction. Empty disables the label.
    required: false
    default: allow-breaking-api-change
  pull-request-labels:
    description: >
      JSON array of label names to check `allow-breaking-label` against. Leave empty to use the labels
      of the pull request that triggered the run (the usual case). When set, it REPLACES them, and the
      job summary says the override came from this input rather than from the pull request.
    required: false
    default: ''
  oasdiff-version:
    description: oasdiff release tag to download (e.g. v1.22.0)
    required: false
    default: v1.22.0
  format:
    description: Output format — text or json
    required: false
    default: text

outputs:
  breaking-found:
    description: >
      "true" if ERR-level breaking changes were detected (even when allowed), "false" if the specs
      were compared and there are none or nothing was compared (no base spec). EMPTY when oasdiff
      failed or the input was invalid: nobody knows.
    value: ${{ steps.diff.outputs.breaking-found }}
  breaking-allowed:
    description: '"true" if breaking changes were detected and let through by allow-breaking or the label'
    value: ${{ steps.diff.outputs.breaking-allowed }}
  message:
    description: 'One line saying how the action ended, or why it failed (for example "Invalid input: ...")'
    value: ${{ steps.diff.outputs.message }}

runs:
  using: composite
  steps:
    - name: Install oasdiff
      shell: bash
      env:
        VERSION: ${{ inputs.oasdiff-version }}
      run: |
        set -euo pipefail
        OS="linux"
        ARCH="amd64"
        BASE="https://github.com/Tufin/oasdiff/releases/download/${VERSION}"
        TARBALL="oasdiff_${VERSION#v}_${OS}_${ARCH}.tar.gz"
        echo "Downloading oasdiff ${VERSION}..."
        # -f: an HTTP error must stop here, not become an empty file that fails later for another reason.
        curl -fsSL "${BASE}/${TARBALL}"          -o /tmp/oasdiff.tar.gz
        curl -fsSL "${BASE}/checksums.txt"       -o /tmp/oasdiff-checksums.txt
        # Verify SHA-256 before extracting
        EXPECTED=$(grep -F "${TARBALL}" /tmp/oasdiff-checksums.txt | awk '{print $1}')
        ACTUAL=$(sha256sum /tmp/oasdiff.tar.gz | awk '{print $1}')
        if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error ::Checksum mismatch for ${TARBALL}: expected=${EXPECTED:-<none listed>} got=${ACTUAL}"
          exit 1
        fi
        tar -xz -C /usr/local/bin -f /tmp/oasdiff.tar.gz oasdiff
        rm /tmp/oasdiff.tar.gz /tmp/oasdiff-checksums.txt
        oasdiff --version

    - name: Compare OpenAPI specs
      id: diff
      shell: bash
      env:
        CURRENT: ${{ inputs.current-spec-path }}
        BASE: ${{ inputs.base-spec-path }}
        FORMAT: ${{ inputs.format }}
        FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
        ALLOW_BREAKING: ${{ inputs.allow-breaking }}
        ALLOW_LABEL: ${{ inputs.allow-breaking-label }}
        LABELS_INPUT: ${{ inputs.pull-request-labels }}
        LABELS_JSON: ${{ inputs.pull-request-labels || toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        # No `-e`: GitHub starts this shell as `bash -e -o pipefail`, so it is switched off explicitly
        # (`set +e` below); every oasdiff exit code is read and acted on instead. The previous version of this step
        # assumed that `oasdiff breaking` exits 1 when it finds ERR-level changes. It does not: without
        # `--fail-on` it exits 0 whatever it prints (opshub#354: "2 changes: 2 error" followed by
        # "No breaking changes detected", job green). Two defences, so one wrong assumption cannot
        # reopen that hole: `--fail-on ERR` for the exit code, and an independent count of ERR-level
        # changes from the JSON report. Either one says "breaking" and it is breaking.
        set +e
        set -uo pipefail

        out="$(mktemp)"; err="$(mktemp)"; json="$(mktemp)"; jerr="$(mktemp)"; cfgdir="$(mktemp -d)"
        trap 'rm -rf "$out" "$err" "$json" "$jerr" "$cfgdir"' EXIT
        # $cfg stays EMPTY. oasdiff 1.22 loads a `.oasdiff.*` / `oasdiff.*` config file from its working
        # directory on its own, and one such file (`unmatch-path: ".*"`) makes BOTH comparisons below
        # report "No changes detected". `--config <empty file>` replaces that lookup (the extension picks
        # the parser: a bare mktemp name is rejected with exit 107); the check further down refuses to run
        # at all while such a file exists, so the situation is visible, not just inert.
        cfg="$cfgdir/empty.yaml"
        : > "$cfg"

        set_out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

        # One line, no workflow-command injection: the text may contain input values.
        oneline() { printf '%s' "$1" | tr -d '\r\n' | cut -c1-400; }

        # An error: the annotation AND the `message` output, so that a caller (or a test) can read why.
        die() { # title message
          local m
          m="$(oneline "$2")"
          echo "::error title=$1::$m"
          set_out message "$1: $m"
        }

        summary() { # markdown on stdin -> job summary (when there is one)
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat >> "$GITHUB_STEP_SUMMARY"; else cat > /dev/null; fi
        }

        # `true`/`false` only. An empty value is the default. Anything else (a typo such as `True` or `1`)
        # used to disable the gate silently; now it is an error. The result is a global, NOT the output of a
        # command substitution: the message must reach the log, not be swallowed with the value.
        FLAG_VALUE=""
        flag() { # name value default
          case "$2" in
            true | false) FLAG_VALUE="$2" ;;
            '') FLAG_VALUE="$3" ;;
            *) die "Invalid input" "$1 must be 'true' or 'false', got '$2'"; return 1 ;;
          esac
        }
        flag fail-on-breaking "$FAIL_ON_BREAKING" true || exit 1
        FAIL_ON="$FLAG_VALUE"
        flag allow-breaking "$ALLOW_BREAKING" false || exit 1
        ALLOW="$FLAG_VALUE"

        # A config file that oasdiff would read (from its working directory) or that a reader would assume
        # applies (the workspace root, the specs' directories). Refuse to run while one exists.
        found_configs=""
        seen=" "
        for d in "$PWD" "${GITHUB_WORKSPACE:-}" "$(dirname -- "$BASE")" "$(dirname -- "$CURRENT")"; do
          if [ -z "$d" ] || [ ! -d "$d" ]; then continue; fi
          real="$(cd "$d" && pwd -P)"
          case "$seen" in *" $real "*) continue ;; esac
          seen="$seen$real "
          for f in "$real"/.oasdiff.* "$real"/oasdiff.*; do
            if [ ! -f "$f" ]; then continue; fi
            case "$f" in
              *.json | *.toml | *.yaml | *.yml | *.properties | *.props | *.prop | *.hcl | *.tfvars | *.dotenv | *.env | *.ini)
                found_configs="${found_configs:+$found_configs, }$f"
                ;;
            esac
          done
        done
        if [ -n "$found_configs" ]; then
          die "oasdiff config found" "$found_configs. oasdiff reads .oasdiff.* / oasdiff.* from its working directory, and a rule such as unmatch-path \".*\" silently disables the contract check. This action ignores such files (--config with an empty file) and refuses to run while one exists: delete it."
          printf '### OpenAPI contract: FAILED, oasdiff config file present\n\n`%s`\n\nIt could silence the comparison, so the check refuses to run.\n' "$found_configs" | summary
          set_out breaking-allowed false
          exit 1
        fi

        if [ ! -f "$BASE" ]; then
          echo "::warning ::Base spec not found at '$BASE' — skipping contract validation."
          printf '### OpenAPI contract: SKIPPED\n\nNo base spec at `%s`, so nothing was compared.\n' "$BASE" | summary
          set_out breaking-found false
          set_out breaking-allowed false
          set_out message "skipped: no base spec at $(oneline "$BASE")"
          exit 0
        fi

        if [ ! -f "$CURRENT" ]; then
          die "Current spec not found" "no file at '$CURRENT'"
          exit 1
        fi

        if ! command -v jq > /dev/null 2>&1; then
          die "jq missing" "jq is required (it is on GitHub-hosted ubuntu runners)"
          exit 1
        fi

        echo "Comparing:"
        echo "  base:    $BASE"
        echo "  current: $CURRENT"
        echo ""

        # 1. The report people read, with the exit code that matters: 1 = ERR-level changes found.
        oasdiff breaking --config "$cfg" --format "$FORMAT" --fail-on ERR "$BASE" "$CURRENT" > "$out" 2> "$err"
        EXIT=$?
        cat "$out"
        if [ -s "$err" ]; then cat "$err"; fi

        # Anything but 0 and 1 is oasdiff failing (102: a spec that does not load), not a verdict about
        # the API. Never let allow-breaking or fail-on-breaking=false turn that into a pass. `breaking-found`
        # stays EMPTY: nobody knows whether the API broke.
        if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 1 ]; then
          die "oasdiff failed" "oasdiff exited $EXIT, so the specs were not compared. This is not a breaking-change verdict and is not affected by allow-breaking or fail-on-breaking."
          printf '### OpenAPI contract: FAILED to compare\n\noasdiff exited `%s`; see the log.\n' "$EXIT" | summary
          set_out breaking-allowed false
          exit 1
        fi

        # 2. The independent count: ERR is level 3 in oasdiff's JSON report.
        oasdiff breaking --config "$cfg" --format json "$BASE" "$CURRENT" > "$json" 2> "$jerr"
        JEXIT=$?
        ERRORS=""
        if [ "$JEXIT" -eq 0 ]; then ERRORS="$(jq '[.[] | select(.level == 3)] | length' "$json" 2> /dev/null)"; fi
        case "$ERRORS" in
          '' | *[!0-9]*)
            die "oasdiff failed" "could not count the ERR-level changes (exit $JEXIT)."
            cat "$jerr"
            set_out breaking-allowed false
            exit 1
            ;;
        esac

        BREAKING=false
        if [ "$EXIT" -eq 1 ]; then BREAKING=true; fi
        if [ "$ERRORS" -gt 0 ]; then
          BREAKING=true
          if [ "$EXIT" -eq 0 ]; then
            echo "::warning title=oasdiff exit code disagrees::oasdiff exited 0 but its report has $ERRORS ERR-level change(s). Treating the change as breaking."
          fi
        elif [ "$EXIT" -eq 1 ]; then
          echo "::warning title=oasdiff exit code disagrees::oasdiff exited 1 (ERR-level changes) but its JSON report lists none, so the number of changes is unavailable. Treating the change as breaking."
        fi

        # How many, for messages. When the exit code says breaking and the report lists none, say so
        # instead of claiming "0 ERR-level changes".
        if [ "$ERRORS" -gt 0 ]; then
          COUNT_TXT="$ERRORS ERR-level breaking change(s)"
        else
          COUNT_TXT="ERR-level breaking change(s) (count unavailable: oasdiff exited 1 but its JSON report lists none)"
        fi

        # The label (or the labels input) that allows a break. Read from this run's event payload unless the
        # `pull-request-labels` input supplies the list.
        LABEL_ALLOWED=false
        if [ -n "$ALLOW_LABEL" ] && [ -n "$LABELS_JSON" ]; then
          if jq -e --arg l "$ALLOW_LABEL" 'type == "array" and (index($l) != null)' <<< "$LABELS_JSON" > /dev/null 2>&1; then
            LABEL_ALLOWED=true
          fi
        fi
        if [ -n "$LABELS_INPUT" ]; then
          LABEL_SRC="the pull-request-labels input (label '$ALLOW_LABEL')"
        else
          LABEL_SRC="the pull request label '$ALLOW_LABEL'"
        fi

        # The ERR-level changes as a table for the job summary (at most 50 rows). Text that comes from the
        # spec is escaped: pipes, backticks (which would open a code span) and line breaks.
        changes_table() {
          if [ "$ERRORS" -eq 0 ]; then
            echo "The JSON report lists no ERR-level change; see the log above for what oasdiff printed."
            return
          fi
          echo "| Change | Operation | What |"
          echo "|---|---|---|"
          jq -r '
            def cell: tostring | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|") | gsub("`"; "\\`");
            def code: tostring | gsub("[\r\n`]+"; "\u0027") | gsub("\\|"; "\\|");
            [.[] | select(.level == 3)][:50][]
            | "| `\(.id | code)` | `\((.operation // "") | code) \((.path // "") | code)` | \(.text | cell) |"' "$json"
          if [ "$ERRORS" -gt 50 ]; then echo ""; echo "…and $((ERRORS - 50)) more; the full list is in the log."; fi
        }

        set_out breaking-found "$BREAKING"

        if [ "$BREAKING" = false ]; then
          echo "✓ No breaking changes detected (oasdiff exit $EXIT, $ERRORS ERR-level changes)"
          if [ "$ALLOW" = true ] || [ "$LABEL_ALLOWED" = true ]; then
            echo "::notice title=allow-breaking not needed::allow-breaking (or the '$ALLOW_LABEL' label) is set but there is no breaking change. Remove it."
          fi
          set_out breaking-allowed false
          set_out message "no breaking changes"
          printf '### OpenAPI contract: no breaking changes\n' | summary
          exit 0
        fi

        # Breaking from here on.
        if [ "$ALLOW" = true ] || [ "$LABEL_ALLOWED" = true ]; then
          if [ "$ALLOW" = true ]; then WHY="the input allow-breaking=true"; else WHY="$LABEL_SRC"; fi
          echo ""
          echo "::warning title=BREAKING API CHANGE ALLOWED::$COUNT_TXT let through by $WHY. Clients of the base API can break. Release notes and a client migration plan are the author's responsibility."
          {
            printf '### ⚠️ OpenAPI contract: BREAKING CHANGE ALLOWED\n\n'
            printf '%s were let through by %s.\n\n' "$COUNT_TXT" "$WHY"
            changes_table
            printf '\nThis is an intentional break: callers of the base API can fail. Remove the override once the change has shipped.\n'
          } | summary
          set_out breaking-allowed true
          set_out message "BREAKING CHANGE ALLOWED by $(oneline "$WHY"): $COUNT_TXT"
          exit 0
        fi

        set_out breaking-allowed false

        if [ "$FAIL_ON" = false ]; then
          echo "::warning ::Breaking API changes detected (fail-on-breaking=false — not blocking)."
          {
            printf '### ⚠️ OpenAPI contract: breaking changes, NOT blocking\n\n'
            printf '`fail-on-breaking` is `false`, so %s do not fail this job.\n\n' "$COUNT_TXT"
            changes_table
          } | summary
          set_out message "breaking changes, not blocking (fail-on-breaking=false): $COUNT_TXT"
          exit 0
        fi

        echo ""
        die "Breaking API changes" "$COUNT_TXT. Fix them, or, if the break is intentional, set allow-breaking: 'true' or add the label '${ALLOW_LABEL:-<none configured>}' and push."
        {
          printf '### ❌ OpenAPI contract: breaking changes\n\n%s.\n\n' "$COUNT_TXT"
          changes_table
          printf '\nIf the break is intentional: add the label `%s` and push (or set `allow-breaking: true`). It will be logged here as allowed.\n' "${ALLOW_LABEL:-<none configured>}"
        } | summary
        exit 1

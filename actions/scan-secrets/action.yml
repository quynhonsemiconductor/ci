name: Scan for Secrets
description: >
  Scan the repository for accidentally committed secrets using the Gitleaks
  CLI (installed directly from the official GitHub release, not the
  gitleaks/gitleaks-action wrapper — that wrapper's terms require a paid
  license for private-org usage; the CLI binary itself is MIT-licensed and
  free to run directly). Matches the exact invocation already proven in
  rally's backend-security.yml.

  Run on every push and PR. Gitleaks scans the full git history for secrets
  in commits — not just the current diff — so it catches rotated-but-not-revoked
  credentials in old commits. Caller's checkout step must use fetch-depth: 0
  for full-history scanning.

inputs:
  gitleaks-version:
    description: Gitleaks CLI version to install (without the "v" prefix).
    required: false
    # 8.30.1, up from 8.21.2. The old pin's `kubernetes-secret-yaml` rule fires on a
    # secretStoreRef — a REFERENCE to a SecretStore by name, not a secret value —
    # which made `gitops` fail its own secret scan on a stock External Secrets
    # manifest:
    #
    #   platform/secrets/external-secrets.yaml:50
    #   secretStoreRef: { name: platform, kind: SecretStore }
    #
    # A false positive in a scanner that blocks merges is not cosmetic: the way out
    # is usually a `.gitleaks.toml` allowlist, and gitleaks 8 treats that file as THE
    # config rather than an addition — which is precisely how rova, opshub and
    # qnsc-landing ended up with no secret scanning at all while their checks passed.
    # The arming step below exists because of that, and fixing a false positive with
    # an allowlist would walk straight back into it.
    #
    # Verified before bumping, on every repository that runs this action:
    #   ci · infra · tf-modules   clean on both versions
    #   gitops                    1 finding on 8.21.2, clean on 8.30.1
    # and the canary is still detected by 8.30.1, so a clean result still means
    # something.
    default: '8.30.1'
  fail-on-leak:
    description: Exit 1 (fail the workflow) if any secrets are detected
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
      run: |
        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks
        gitleaks version

    # ── Prove the scanner is armed, BEFORE trusting a clean result ────────────
    #
    # gitleaks 8 treats a repo's `.gitleaks.toml` as THE config, not as an addition
    # to the built-in ruleset. A config that declares an [allowlist] and no [[rules]]
    # therefore leaves gitleaks with NOTHING to detect: it scans, finds nothing,
    # exits 0, and the required check goes green.
    #
    # That is not hypothetical. rova, opshub and qnsc-landing each shipped exactly
    # that config and had no secret scanning at all — for the life of the file —
    # while their `Secret scan (Gitleaks)` check passed on every push and PR.
    #
    # A scanner that can only report success cannot be trusted to report failure. So
    # plant a credential gitleaks certainly detects, scan it with THIS REPOSITORY'S
    # OWN config, and fail loudly if it comes back clean. Costs milliseconds, and
    # catches the whole class: a missing [extend], an allowlist broad enough to match
    # everything, and any future change to config semantics.
    - name: Verify the scanner is armed
      shell: bash
      run: |
        set -euo pipefail
        canary="$(mktemp -d)"
        # Assembled at runtime so this literal is not itself a detectable secret in
        # the ci repository.
        printf 'const t = "%s_%s"\n' 'ghp' 'A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8' > "$canary/canary.txt"
        if [ -f .gitleaks.toml ]; then cp .gitleaks.toml "$canary/.gitleaks.toml"; fi

        if gitleaks dir "$canary" --no-banner --redact --exit-code 1 >/dev/null 2>&1; then
          echo "::error::Secret scanning is NOT ARMED — gitleaks did not detect a known-detectable credential when run with this repository's .gitleaks.toml, so a clean scan result means nothing. Usual cause: a config with an [allowlist] but no [[rules]] and no \`[extend] useDefault = true\`, which REPLACES the default ruleset instead of extending it. Add that block, or narrow an allowlist that is matching everything."
          exit 1
        fi
        echo "Scanner armed: the canary credential was detected."
        rm -rf "$canary"

    - name: Scan git history for secrets
      shell: bash
      env:
        FAIL_ON_LEAK: ${{ inputs.fail-on-leak }}
      run: |
        if [ "$FAIL_ON_LEAK" = "false" ]; then
          gitleaks detect --source . --log-opts="--all" --no-banner --exit-code 0 \
            || echo "::notice ::Secret scan complete — failures will not block this run (fail-on-leak=false)"
        else
          gitleaks detect --source . --log-opts="--all" --no-banner --exit-code 1
        fi

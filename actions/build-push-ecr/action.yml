name: Build & Push image to Amazon ECR
description: >
  Set up Docker Buildx, log in to ECR via OIDC credentials already configured
  in the calling job, and build+push a single image. With `scan: true` the image is scanned for CRITICAL CVEs BEFORE it is
  pushed, from the local build, so no step ever has to pull a pushed image back to the runner (see `scan` below).
  Caller must have already run `aws-actions/configure-aws-credentials` and
  `aws-actions/amazon-ecr-login`.

inputs:
  ecr-registry:
    description: ECR registry URL — `<account>.dkr.ecr.<region>.amazonaws.com`
    required: true
  image-name:
    description: ECR repository name, e.g. `<product>-api`
    required: true
  image-tag:
    description: Primary image tag, e.g. `sha-abc1234` or `v1.2.3`
    required: true
  extra-tags:
    description: >
      Extra tags to apply (newline-separated, no registry prefix needed).
      Leave empty to only push the primary tag.
    required: false
    default: ''
  dockerfile:
    description: Relative path to the Dockerfile
    required: false
    default: Dockerfile
  build-context:
    description: Docker build context path
    required: false
    default: '.'
  build-target:
    description: Dockerfile target stage (for multi-stage builds)
    required: false
    default: ''
  platforms:
    description: >
      Target platform(s) for the image, e.g. `linux/arm64` for Fargate Graviton
      tasks (~20% cheaper per vCPU-hour and GB-hour than x86). Must match the
      `cpu_architecture` on the ECS task definition, or the container fails to
      start with "image Manifest does not contain descriptor matching platform".

      Build on a runner of the SAME architecture — the reusable backend-deploy
      workflow takes a `runner` input for that. Cross-building under QEMU works but
      costs several times the build minutes on a pnpm + Nest compile, which is worse
      than the Fargate saving. Leave empty to build for the runner's own platform.
    required: false
    default: ''
  cache-scope:
    description: >
      Cache scope key — a unique value per image (e.g. `api`, `worker`, `migrator`).
      Used as the GHA cache scope; the registry backend keys on the image name instead
      and ignores this.
    required: false
    default: default
  cache-backend:
    description: >
      Where the build cache lives: `gha` (default), `none`, or `registry`. `registry` is opt-in only (see below): it is no longer
      the default.

      READ THE COST NOTE BELOW BEFORE CHOOSING `registry` FOR A MULTI-GB IMAGE.

      GHA is the default (it used to be `registry`). The GitHub Actions cache is capped at 10 GB PER REPOSITORY, shared with every
      other workflow in it, so a product whose images carry multi-GB layers can blow through that on its own and evict constantly:
      qnsc-kb re-downloaded a 2.2 GB model on most builds while appearing to be cached, and starved the rest of the repo's caches
      doing it; such a product uses `none`. Registry cache has no cap, but it is paid for in internet egress on every build and
      cannot work against an IMMUTABLE repository, so it is not the default.

      COST, CORRECTED. This input previously described the cost as "a `:buildcache` tag
      per image repository, a few GB at $0.10/GB-month". That counted STORAGE and missed
      EGRESS, which is the larger number by an order of magnitude: a GitHub-hosted runner
      is outside AWS, so every build PULLS the whole cache back out of ECR across the
      internet. Measured on this account 2026-08-01..16 — `APS1-DataTransfer-Out-Bytes`
      on ECR was 147.3 GB in sixteen days, $10.90/mo, against $1.51/mo of cache storage.

      Egress scales with DEPLOY FREQUENCY, not with image count, so it is the one line on
      the bill that grows when the team ships more. Size the decision per product:

        qnsc-kb   `:buildcache` is 4.28 GB   -> pulled in full on every build
        rally     `:buildcache` is 0.33 GB   -> effectively free, keep it

      A self-hosted runner inside the VPC would make this free (same-region traffic), and
      is the real fix if registry cache is ever wanted for a large image.

      `none` disables the cache entirely — no `cache-from`, no `cache-to`, nothing
      written to ECR. Correct for a large image on a PUBLIC repository, where Actions
      minutes are unmetered: the cache is then buying wall-clock, not money, and the
      egress is real money. Builds are slower and fully reproducible from scratch.

      `gha` remains available for a product with small images that would rather not hold
      cache in ECR at all. Nothing else changes between the three.

      Registry mode requires a MUTABLE ECR repository, because each build overwrites the
      `buildcache` tag. As of task 0.8 the image repositories are IMMUTABLE (the ecr
      module's default), so `registry` cache is INCOMPATIBLE with them — a `buildcache`
      overwrite is rejected exactly as a second `:latest` push would be. That is why the
      products moved off it: rally and opshub use `gha`, qnsc-kb uses `none`. Do not set
      `registry` against an IMMUTABLE repository; use `gha` or `none`, or a self-hosted
      in-VPC runner if registry cache is ever genuinely wanted (see the egress note above).

      (Historical: this action used to push a moving `:latest` via `extra-tags`, which
      needed mutability for the same reason. That push was removed in 0.8 — §11 — and the
      repositories flipped to IMMUTABLE, so both the tag and the cache constraint changed
      together.)

      The ECR lifecycle policy leaves `buildcache` alone: its rules key on the `v` and
      `sha-` prefixes and on untagged images, and `buildcache` matches neither. So
      switching a product to `none` does NOT reclaim its existing cache tag — delete it
      once by hand with `aws ecr batch-delete-image --image-ids imageTag=buildcache`.
    required: false
    default: gha
  push-by-digest:
    description: >
      Push the image by DIGEST ONLY, with no tag: `outputs: type=image,push-by-digest=true`. For the per-architecture legs of a multi-arch
      build, each on a runner of its own architecture; a later job creates the tag ONCE with `docker buildx imagetools create`, over
      the digests of every leg. It has to be like this because the repositories are IMMUTABLE (task 0.8): two legs cannot both push
      `sha-<commit>`, and a leg cannot re-tag after the merge. `image-tag` is ignored when this is true. Default false: unchanged behaviour.
    required: false
    default: 'false'
  scan:
    description: >
      `true` scans the image for CRITICAL CVEs BEFORE it is pushed, and fails the step (nothing is pushed) if one is found.
      Default `false`: unchanged behaviour.

      WHY HERE AND NOT AFTER THE PUSH. A scan of the pushed image by its ECR reference makes the runner DOWNLOAD the whole image
      from ECR. A GitHub-hosted runner is outside AWS, so that is internet egress at $0.12/GB: qnsc-kb's api and worker images are
      3-4 GB each, three images per push, 34 pushes in 17 days, which was 206 GB and $24.78 of `DataTransfer-Out` against $2.11 of
      storage. The image is already on the runner when it is built, so the scan reads it there.

      HOW. A first build of the same Dockerfile, target and platform runs with `load: true` and `push: false`, without
      attestations (the Docker exporter cannot carry them), the loaded image is scanned, and only then the real build runs with
      push and with provenance and SBOM. The second build is a hit on the first one's layers in the same builder, so it re-runs
      nothing and the pushed layers are the scanned layers (checked: identical layer digests). Needs a SINGLE platform
      (`platforms` empty or one value): a multi-platform build cannot be loaded into the Docker daemon. The per-architecture legs
      of a multi-arch build each scan their own native image this way, and the merge job needs no scan of its own.
    required: false
    default: 'false'
  scan-severity:
    description: Severity that fails the pre-push scan (Trivy syntax, e.g. `CRITICAL` or `HIGH,CRITICAL`). Unfixed CVEs are ignored.
    required: false
    default: CRITICAL
  node-auth-token:
    description: >
      Token used by the Dockerfile's `pnpm install` to fetch private
      @quynhonsemiconductor/* packages from GitHub Packages (mounted as build secret
      `node_auth_token`). Defaults to the job's GITHUB_TOKEN; the calling job
      must grant `packages: read`.
    required: false
    default: ${{ github.token }}

outputs:
  image-uri:
    description: Full URI of the pushed image (`registry/name:tag`)
    value: ${{ steps.expose.outputs.image-uri }}
  image-digest:
    description: Image digest (`sha256:...`) — use with attest-image for tamper-proof SLSA provenance
    value: ${{ steps.expose.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

    - name: Resolve tags
      id: tags
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        EXTRA_TAGS: ${{ inputs.extra-tags }}
      run: |
        PRIMARY="${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
        TAGS="$PRIMARY"
        if [ -n "$EXTRA_TAGS" ]; then
          while IFS= read -r t; do
            [ -n "$t" ] && TAGS="$TAGS"$'\n'"${ECR_REGISTRY}/${IMAGE_NAME}:$t"
          done <<< "$EXTRA_TAGS"
        fi
        echo "tags<<EOF" >> "$GITHUB_OUTPUT"
        echo "$TAGS"      >> "$GITHUB_OUTPUT"
        echo "EOF"        >> "$GITHUB_OUTPUT"
        echo "image-uri=$PRIMARY" >> "$GITHUB_OUTPUT"

    # Resolved in bash rather than in a `${{ }}` ternary, because the three-way form is a
    # trap in GitHub expressions: `x == 'none' && '' || <registry>` evaluates the empty
    # string as FALSY and falls straight through to the registry branch, so `none` would
    # silently keep caching. Two nested ternaries avoid that and are unreadable. A step
    # with a `case` is neither.
    - name: Resolve cache backend
      id: cache
      shell: bash
      env:
        BACKEND:  ${{ inputs.cache-backend }}
        SCOPE:    ${{ inputs.cache-scope }}
        REGISTRY: ${{ inputs.ecr-registry }}
        IMAGE:    ${{ inputs.image-name }}
        REF:      ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        case "$BACKEND" in
          none)
            FROM=""; TO="" ;;
          gha)
            FROM="type=gha,scope=$SCOPE"
            TO="type=gha,mode=max,scope=$SCOPE" ;;
          registry)
            FROM="type=registry,ref=$REGISTRY/$IMAGE:buildcache"
            TO="type=registry,ref=$REGISTRY/$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" ;;
          *)
            echo "::error::cache-backend must be registry, gha or none (got '$BACKEND')"
            exit 1 ;;
        esac
        # WRITE THE CACHE ONLY FROM THE DEFAULT BRANCH. A GitHub Actions cache entry is readable only by the ref that wrote it
        # (and pull requests based on it), never by main or a sibling: a cache written from a tag or a manual run on another branch
        # is read by nobody and still counts against the 10 GB per-repository cap, evicting the entries main DOES read. For the
        # registry backend the same write is a push of the whole cache to ECR. READ is unchanged everywhere.
        DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
        if [ "$REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
          if [ -n "$TO" ]; then
            echo "cache: read-only on ${REF} (writes only from refs/heads/${DEFAULT_BRANCH})" >> "$GITHUB_STEP_SUMMARY"
          fi
          TO=""
        fi
        echo "from=$FROM" >> "$GITHUB_OUTPUT"
        echo "to=$TO"     >> "$GITHUB_OUTPUT"
        echo "cache backend: ${BACKEND}" >> "$GITHUB_STEP_SUMMARY"

    - name: Check the scan can run
      if: ${{ inputs.scan == 'true' }}
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        # `load: true` puts the image in the local Docker daemon, which holds one platform.
        if [[ "$PLATFORMS" == *,* ]]; then
          echo "::error title=build-push-ecr::scan: true needs a single platform (got '$PLATFORMS'); build each architecture on its own runner and scan in each leg"
          exit 1
        fi

    # Build for the scan: local only, nothing is pushed and nothing is written to the cache. Same context, Dockerfile, target,
    # platform, secrets and cache-from as the real build, so it is the same image. No provenance/SBOM: the Docker exporter cannot
    # export an image index; the real build below adds them.
    - name: Build for scan (local, nothing pushed)
      id: build-local
      if: ${{ inputs.scan == 'true' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.build-target }}
        platforms: ${{ inputs.platforms }}
        load: true
        push: false
        tags: ecr-prepush-scan/${{ inputs.image-name }}:scan
        cache-from: ${{ steps.cache.outputs.from }}
        provenance: false
        sbom: false
        secrets: |
          node_auth_token=${{ inputs.node-auth-token }}

    - name: Scan before push (CRITICAL blocks; nothing has been pushed yet)
      if: ${{ inputs.scan == 'true' }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ecr-prepush-scan/${{ inputs.image-name }}:scan
        format: table
        exit-code: '1'
        severity: ${{ inputs.scan-severity }}
        ignore-unfixed: true

    - name: Build & push
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.build-target }}
        platforms: ${{ inputs.platforms }}
        # Normal path: push: true + tags. By-digest path: `outputs` pushes an untagged image and `push`/`tags` must not also be set.
        push: ${{ inputs.push-by-digest != 'true' }}
        tags: ${{ inputs.push-by-digest != 'true' && steps.tags.outputs.tags || '' }}
        outputs: ${{ inputs.push-by-digest == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', inputs.ecr-registry, inputs.image-name) || '' }}
        # Both computed in the step above — see it for why this is not a `${{ }}` ternary,
        # and see `cache-backend` for the cost of each backend.
        #
        # Empty is a valid value for both: docker/build-push-action treats an empty
        # `cache-from`/`cache-to` as "no cache flags", which is exactly `none`.
        #
        # Cache misses are not failures either. `--cache-from` against a repository with no
        # buildcache tag yet is a no-op, so the first build after enabling registry cache
        # simply populates it, and the first build after DISABLING it just runs cold.
        cache-from: ${{ steps.cache.outputs.from }}
        cache-to: ${{ steps.cache.outputs.to }}
        provenance: mode=max   # SLSA L3: full build graph with materials
        sbom: true             # embed SBOM as OCI attestation (CycloneDX)
        # Authenticates `pnpm install` against GitHub Packages for private
        # @quynhonsemiconductor/* deps so a cold build (evicted cache) doesn't 401.
        secrets: |
          node_auth_token=${{ inputs.node-auth-token }}

    - name: Expose image URI and digest
      id: expose
      shell: bash
      env:
        IMAGE_URI: ${{ steps.tags.outputs.image-uri }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        echo "image-uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
        echo "digest=${DIGEST}"      >> "$GITHUB_OUTPUT"

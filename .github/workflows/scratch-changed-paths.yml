name: Scratch changed-paths
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: p
        uses: ./actions/changed-paths
        with:
          ignore: |
            **/*.md
            docs/**
          skip-heads: |
            renovate/=.github/workflows/**
      - run: echo "RESULT run=${{ steps.p.outputs.run }}"

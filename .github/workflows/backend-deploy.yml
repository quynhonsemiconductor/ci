# =============================================================================
# Reusable: backend deploy — build/attest (main) or promote (tag), migrate, then
# roll ECS services. Tag-gated prod org-wide: main→develop, v*.*.* tag→production.
#
# Product-agnostic: image names derive from `product` (<product>-api/-worker/
# -migrator). Env-scoped GitHub vars/secrets (ECS_CLUSTER, ECS_API_SERVICE, …)
# resolve from the job's `environment:`, so the caller passes `secrets: inherit`.
# See the reference caller in qnsc-infra-template / product repos.
# =============================================================================
name: Reusable · Backend Deploy

on:
  workflow_call:
    inputs:
      product:      { required: true, type: string }
      has_worker:   { type: boolean, default: true }
      has_migrator: { type: boolean, default: true }
      aws_region:   { type: string, default: "ap-southeast-1" }
      # Image architecture. Fargate ARM64 (Graviton) bills ~20% less per vCPU-hour
      # and GB-hour, and must match `cpu_architecture` on the task definitions.
      #
      # Build on a runner of the same architecture rather than cross-building:
      # `build_runner: ubuntu-24.04-arm` with `image_platforms: linux/arm64`. QEMU
      # emulation also works but multiplies build minutes on a pnpm + Nest compile
      # by enough to outweigh the Fargate saving.
      #
      # Defaults keep the historical x86 behaviour, so a product opts in by setting
      # both together — set only one and the container fails at start with "image
      # Manifest does not contain descriptor matching platform".
      build_runner:    { type: string, default: "ubuntu-latest" }
      image_platforms: { type: string, default: "" }
      # Path of the READINESS probe, appended to the environment's APP_URL for the
      # post-deploy gate below. Defaults to rally's/opshub's `/v1/readyz`, so a caller
      # that passes nothing keeps today's behaviour byte for byte.
      #
      # It is an input rather than a fixed string because health endpoints are
      # INFRASTRUCTURE, not API surface, and products place them differently:
      # rally serves `/v1/readyz` (inside the version prefix), qnsc-kb serves
      # `/health/ready` (outside its own `/api/v1`). Renaming either to match the
      # other would cost an app change, an infra change (`health_check_path`, the
      # Route 53 check) and a deploy, for no behaviour change.
      #
      # Whatever is passed MUST be the readiness probe, never liveness — see the
      # "Post-deploy readiness check" step for why that distinction is load-bearing.
      health_path:     { type: string, default: "/v1/readyz" }
      # Build cache backend: `registry` (default), `gha` or `none`. Passed straight to
      # actions/build-push-ecr, whose `cache-backend` input carries the full reasoning.
      #
      # Exposed here because the right answer is PER PRODUCT and depends on image size.
      # A GitHub-hosted runner sits outside AWS, so registry cache is pulled back out of
      # ECR across the internet on every build, and that egress — not the cache storage —
      # is the cost. Measured 2026-08-01..16: 147.3 GB, $10.90/mo, against $1.51/mo of
      # storage. qnsc-kb's cache is 4.28 GB and rally's is 0.33 GB, so the same default
      # was cheap for one product and the largest growing line on the bill for the other.
      #
      # On a PUBLIC repository, Actions minutes are unmetered — so for a large image the
      # cache buys wall-clock and costs real money. `none` is the honest trade there.
      cache_backend:   { type: string, default: "registry" }
    secrets:
      AWS_ACCOUNT_ID:       { required: true }
      SLACK_DEPLOY_WEBHOOK: { required: false }

permissions:
  contents: read

jobs:
  context:
    name: Resolve context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.ctx.outputs.environment }}
      image_tag:   ${{ steps.ctx.outputs.image_tag }}
      source_tag:  ${{ steps.ctx.outputs.source_tag }}
      # JSON array driving the build matrix. Derived here rather than in the matrix
      # itself because `strategy.matrix` cannot evaluate `inputs.*` conditionally —
      # it can only read a value another job produced.
      services:    ${{ steps.ctx.outputs.services }}
    steps:
      - id: ctx
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            {
              echo "environment=production"
              echo "image_tag=${{ github.ref_name }}"
              echo "source_tag=sha-${{ github.sha }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "environment=develop"
              echo "image_tag=sha-${{ github.sha }}"
              echo "source_tag=sha-${{ github.sha }}"
            } >> "$GITHUB_OUTPUT"
          fi

          # Which images this product has. `api` is not optional — a backend without
          # one has nothing to deploy — so it is unconditional and the flags only add.
          SERVICES='["api"'
          [[ "${{ inputs.has_worker }}"   == "true" ]] && SERVICES="$SERVICES,\"worker\""
          [[ "${{ inputs.has_migrator }}" == "true" ]] && SERVICES="$SERVICES,\"migrator\""
          SERVICES="$SERVICES]"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  # ── PROMOTE (tag) — retag the exact dev-tested images, no rebuild ───────────
  # Kept as ONE job, deliberately unlike `build` below: promotion is a few ECR API
  # calls, so splitting it per service would add three runner startups to save
  # nothing.
  promote:
    name: Promote images to ECR
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: context
    timeout-minutes: 20
    outputs:
      api_digest: ${{ steps.promoted-api-digest.outputs.digest }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    env:
      IMAGE_TAG:  ${{ needs.context.outputs.image_tag }}
      SOURCE_TAG: ${{ needs.context.outputs.source_tag }}
      PRODUCT:    ${{ inputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup AWS OIDC + ECR login
        id: aws
        uses: QNSC-VN/qnsc-ci/actions/setup-aws-oidc@v1
        with:
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.product }}-github-ecr-push
          region: ${{ inputs.aws_region }}
          ecr-login: 'true'

      - name: Compute image list
        id: images
        run: |
          LIST="${PRODUCT}-api"
          [[ "${{ inputs.has_worker }}"   == "true" ]] && LIST="${LIST},${PRODUCT}-worker"
          [[ "${{ inputs.has_migrator }}" == "true" ]] && LIST="${LIST},${PRODUCT}-migrator"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Promote images ${{ env.SOURCE_TAG }} → ${{ env.IMAGE_TAG }}
        uses: QNSC-VN/qnsc-ci/actions/promote-ecr-images@v1
        with:
          image-names: ${{ steps.images.outputs.list }}
          source-tag:  ${{ env.SOURCE_TAG }}
          release-tag: ${{ env.IMAGE_TAG }}
          region:      ${{ inputs.aws_region }}

      - name: Resolve promoted API digest
        id: promoted-api-digest
        env:
          REGION: ${{ inputs.aws_region }}
          RELEASE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images --repository-name "${{ inputs.product }}-api" \
            --image-ids imageTag="$RELEASE_TAG" --region "$REGION" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest promoted API image
        uses: QNSC-VN/qnsc-ci/actions/attest-image@v1
        with:
          image-ref: ${{ steps.aws.outputs.ecr-registry }}/${{ inputs.product }}-api@${{ steps.promoted-api-digest.outputs.digest }}

  # ── BUILD (main) — one job PER SERVICE, in parallel ─────────────────────────
  # These used to be sequential steps in a single job, under a comment claiming they
  # were a matrix. On qnsc-kb that cost 20 minutes of wall clock — api 9m, then
  # worker 7m, then migrator 1m — for work that has no ordering between the images.
  # In parallel the job takes as long as the slowest single image.
  #
  # Runner minutes go up and wall clock goes down. Every repo using this workflow is
  # public, so Actions minutes are free and that is a pure win; a private product
  # would be trading minutes for latency, which is still usually the right trade for
  # a deploy someone is waiting on.
  #
  # `fail-fast: false` because a CRITICAL CVE in the worker should not cancel the api
  # build and leave you unable to tell whether the api was fine.
  build:
    name: Build ${{ matrix.service }}
    if: github.ref_type != 'tag'
    runs-on: ${{ inputs.build_runner }}
    needs: context
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.context.outputs.services) }}
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: read # build-push-ecr pulls private @qnsc-vn/* from GitHub Packages
    env:
      IMAGE_TAG: ${{ needs.context.outputs.image_tag }}
      PRODUCT:   ${{ inputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup AWS OIDC + ECR login
        id: aws
        uses: QNSC-VN/qnsc-ci/actions/setup-aws-oidc@v1
        with:
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.product }}-github-ecr-push
          region: ${{ inputs.aws_region }}
          ecr-login: 'true'

      # image name, Dockerfile target and cache scope are all the service name —
      # that convention is what lets this be one matrix instead of three blocks.
      - name: Build & push ${{ matrix.service }}
        id: build
        uses: QNSC-VN/qnsc-ci/actions/build-push-ecr@v1
        with:
          ecr-registry: ${{ steps.aws.outputs.ecr-registry }}
          image-name: ${{ inputs.product }}-${{ matrix.service }}
          image-tag: ${{ env.IMAGE_TAG }}
          extra-tags: latest
          build-target: ${{ matrix.service }}
          cache-scope: ${{ matrix.service }}
          cache-backend: ${{ inputs.cache_backend }}
          platforms: ${{ inputs.image_platforms }}

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: '${{ steps.aws.outputs.ecr-registry }}/${{ inputs.product }}-${{ matrix.service }}:${{ env.IMAGE_TAG }}'
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
        # Trivy resolves a remote image index to linux/amd64 unless told otherwise, so a
        # single-arch arm64 image fails with "no child with platform linux/amd64 in
        # index". Derived from the RUNNER, not from `image_platforms`: the build ran on
        # this same runner, so its architecture IS the one the image was built for.
        env:
          TRIVY_PLATFORM: linux/${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: Attest ${{ matrix.service }} image
        uses: QNSC-VN/qnsc-ci/actions/attest-image@v1
        with:
          image-ref: ${{ steps.aws.outputs.ecr-registry }}/${{ inputs.product }}-${{ matrix.service }}@${{ steps.build.outputs.image-digest }}

      # The deploy job verifies the API image's attestation and needs its digest.
      # An ARTIFACT, not a job output: matrix legs share one output namespace, so the
      # last leg to finish overwrites whatever the others wrote — the api digest would
      # be whichever image happened to build last, or empty. Only the api leg writes.
      - name: Publish API digest for the deploy job
        if: matrix.service == 'api'
        run: echo "${{ steps.build.outputs.image-digest }}" > api-digest.txt

      # ⚠ upload-artifact and download-artifact MUST STAY ON THE SAME MAJOR. v4 changed
      # the artifact backend, so a v4 upload cannot be read by a v3 download or vice
      # versa. This repo pins upload-artifact v7 elsewhere (web-deploy, rally CI) with no
      # matching download — bumping only one side here breaks the deploy at the download
      # step, after the images are already built and pushed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: matrix.service == 'api'
        with:
          name: api-digest
          path: api-digest.txt
          retention-days: 1

  # ── WAKE (develop) — overlap the cold start with the build ─────────────────
  # develop sleeps 00:00-08:00 ICT, and a stopped single-AZ RDS takes 3-5 minutes to
  # reach `available`. That wait used to sit INSIDE the deploy job, after the image was
  # already built — so an out-of-hours merge paid the build and the cold start one after
  # the other. Started here it runs alongside the build and is finished before the
  # deploy job asks for a database.
  #
  # DEVELOP ONLY, and not because production never sleeps — rally's production RDS is
  # idled pre-launch and genuinely needs this. It is that a second job carrying
  # `environment: production` would demand a SECOND reviewer approval per release. The
  # deploy job still calls the same action, so production is covered there.
  #
  # Failure here is deliberately not fatal to the run: the deploy job repeats the call
  # and will fail there if the database really cannot be started, with the migration
  # step as the thing that needed it. Failing twice for one cause reads as two problems.
  wake:
    name: Wake ${{ needs.context.outputs.environment }}
    if: needs.context.outputs.environment == 'develop'
    needs: context
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup AWS OIDC (deploy role)
        uses: QNSC-VN/qnsc-ci/actions/setup-aws-oidc@v1
        with:
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.product }}-github-deploy-${{ needs.context.outputs.environment }}
          region: ${{ inputs.aws_region }}

      - name: Ensure environment is awake (RDS + ECS)
        uses: QNSC-VN/qnsc-ci/actions/ensure-environment-awake@v1
        with:
          rds-identifier: ${{ vars.RDS_INSTANCE_ID }}
          ecs-cluster: ${{ vars.ECS_CLUSTER }}
          ecs-services: ${{ vars.ECS_API_SERVICE }} ${{ vars.ECS_WORKER_SERVICE }}
          region: ${{ inputs.aws_region }}

  deploy:
    name: Deploy (${{ needs.context.outputs.environment }})
    runs-on: ubuntu-latest
    # `build` and `promote` are mutually exclusive — one is always skipped — so the
    # default "all needs succeeded" gate would never pass. Require the one that ran.
    needs: [context, build, promote]
    if: >-
      always() && !cancelled() &&
      (needs.build.result == 'success' || needs.promote.result == 'success')
    environment: ${{ needs.context.outputs.environment }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG:   ${{ needs.context.outputs.image_tag }}
      ENVIRONMENT: ${{ needs.context.outputs.environment }}
    steps:
      - name: Setup AWS OIDC (deploy role)
        uses: QNSC-VN/qnsc-ci/actions/setup-aws-oidc@v1
        with:
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.product }}-github-deploy-${{ env.ENVIRONMENT }}
          region: ${{ inputs.aws_region }}
          # ECR docker login so `gh attestation verify` (below) can pull the
          # image manifest from the private registry; otherwise it 401s.
          ecr-login: 'true'

      # ── Preflight: every injected secret must hold a value ───────────────────
      # Terraform creates secret CONTAINERS; values are populated out of band with
      # `put-secret-value`. An empty container is accepted by
      # RegisterTaskDefinition and only fails when ECS pulls it — as a
      # ResourceInitializationError minutes later, followed by a rollback whose
      # event log never names the offending secret. A few metadata calls here name
      # it before anything is registered or rolled.
      #
      # Only a CONFIRMED empty secret fails the job. Any other error (the role
      # lacks the permission, the secret is absent) warns and continues, so this
      # gate can never block a deploy it merely failed to verify.
      - name: Preflight — injected secrets hold values
        env:
          API_FAMILY: ${{ vars.ECS_CLUSTER }}-${{ vars.ECS_API_SERVICE }}
          WORKER_FAMILY: ${{ inputs.has_worker && format('{0}-{1}', vars.ECS_CLUSTER, vars.ECS_WORKER_SERVICE) || '' }}
          MIGRATOR_FAMILY: ${{ inputs.has_migrator && vars.ECS_MIGRATOR_TASK_DEF || '' }}
        run: |
          set -euo pipefail
          EMPTY=0
          FAMILIES=()
          if [ -n "$API_FAMILY" ];      then FAMILIES+=("$API_FAMILY");      fi
          if [ -n "$WORKER_FAMILY" ];   then FAMILIES+=("$WORKER_FAMILY");   fi
          if [ -n "$MIGRATOR_FAMILY" ]; then FAMILIES+=("$MIGRATOR_FAMILY"); fi

          for FAMILY in "${FAMILIES[@]}"; do
            # `secrets[].valueFrom` may carry a JSON-key suffix
            # (`<arn>:<key>:<stage>:<id>`). A bare Secrets Manager ARN is exactly
            # 7 colon-separated fields, so rejoin the first 7 to get the secret id.
            REFS=$(aws ecs describe-task-definition --task-definition "$FAMILY" \
                     --query 'taskDefinition.containerDefinitions[].secrets[].valueFrom' \
                     --output json | python3 -c '
          import json, sys
          for v in json.load(sys.stdin) or []:
              if ":secretsmanager:" not in v:
                  continue                  # SSM Parameter Store refs are out of scope
              secret_id = ":".join(v.split(":")[:7])
              # RDS-managed master secrets (rds!db-<id>) are created AND populated by
              # RDS itself, so they cannot be the empty container this checks for.
              # They also sit outside the product <product>/* IAM scope by design, so
              # probing them only ever produced an AccessDenied warning on every
              # deploy — noise that would mask a real one. No backticks in here: this
              # block is a single-quoted shell string, so they would read as command
              # substitution (SC2016).
              if not secret_id.split(":secret:")[-1].startswith("rds!"):
                  print(secret_id)
          ' | sort -u)

            # SSM SecureString parameters, checked separately below. Same job in the task
            # definition, different API — and a much cheaper check, because SSM refuses to
            # store an empty value, so "exists" already implies "has a value".
            PARAMS=$(aws ecs describe-task-definition --task-definition "$FAMILY" \
                       --query 'taskDefinition.containerDefinitions[].secrets[].valueFrom' \
                       --output json | python3 -c '
          import json, sys
          for v in json.load(sys.stdin) or []:
              if ":ssm:" in v and ":parameter/" in v:
                  print("/" + v.split(":parameter/", 1)[1])
          ' | sort -u)

            # Herestring, not a pipe: a pipe would run this loop in a subshell and
            # discard EMPTY.
            while IFS= read -r REF; do
              [ -n "$REF" ] || continue
              if ! OUT=$(aws secretsmanager list-secret-version-ids --secret-id "$REF" --output json 2>&1); then
                echo "::warning::$FAMILY: cannot verify ${REF##*:secret:} — $(echo "$OUT" | tail -1)"
                continue
              fi
              INFO=$(SECRET_REF="$REF" python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          print(d.get("Name") or os.environ["SECRET_REF"].split(":secret:")[-1],
                len(d.get("Versions") or []))
          ' <<<"$OUT")
              NAME=${INFO%% *}
              COUNT=${INFO##* }
              if [ "$COUNT" -eq 0 ]; then
                echo "::error::$FAMILY injects secret '$NAME' but it holds no value. Populate it and re-run: aws secretsmanager put-secret-value --secret-id '$NAME' --secret-string '<value>'"
                EMPTY=1
              fi
            done <<<"$REFS"

            # ── SSM SecureString: version 1 means still the Terraform placeholder ──
            # The secrets module creates these holding "UNSET" with ignore_changes on the
            # value, so an operator's first `put-parameter` bumps the version to 2. Version
            # is METADATA: this reads describe-parameters, never GetParameter, so the deploy
            # role needs no permission to read secret material — a real improvement on the
            # Secrets Manager path above, which can only count versions.
            while IFS= read -r PARAM; do
              [ -n "$PARAM" ] || continue
              if ! OUT=$(aws ssm describe-parameters \
                           --parameter-filters "Key=Name,Values=$PARAM" \
                           --output json 2>&1); then
                echo "::warning::$FAMILY: cannot verify $PARAM — $(echo "$OUT" | tail -1)"
                continue
              fi
              VER=$(echo "$OUT" | python3 -c '
          import json, sys
          p = (json.load(sys.stdin).get("Parameters") or [])
          print(p[0].get("Version", 0) if p else 0)
          ')
              if [ "$VER" -eq 0 ]; then
                echo "::error::$FAMILY injects SSM parameter '$PARAM' but it does not exist. Create it via Terraform, then set its value."
                EMPTY=1
              elif [ "$VER" -eq 1 ]; then
                echo "::error::$FAMILY injects SSM parameter '$PARAM' but it still holds the Terraform placeholder. Populate it and re-run: aws ssm put-parameter --name '$PARAM' --type SecureString --overwrite --value '<value>'"
                EMPTY=1
              fi
            done <<<"$PARAMS"
          done

          if [ "$EMPTY" -ne 0 ]; then
            echo "Refusing to deploy: an injected secret is an empty container."
            exit 1
          fi
          echo "Preflight OK — every injected Secrets Manager secret and SSM parameter holds a value."

      - name: Update API task definition to ${{ env.IMAGE_TAG }}
        id: api-taskdef
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          FAMILY="${{ vars.ECS_CLUSTER }}-${{ vars.ECS_API_SERVICE }}"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | python3 -c "
          import sys, json, os
          td = json.load(sys.stdin); tag = os.environ['IMAGE_TAG']
          for c in td.get('containerDefinitions', []):
              if c.get('name') == 'api':
                  c['image'] = c['image'].rsplit(':', 1)[0] + ':' + tag
          for f in ['taskDefinitionArn','revision','status','requiresAttributes','placementConstraints','compatibilities','registeredAt','registeredBy']:
              td.pop(f, None)
          print(json.dumps(td))")
          ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Update Worker task definition to ${{ env.IMAGE_TAG }}
        id: worker-taskdef
        if: inputs.has_worker
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          FAMILY="${{ vars.ECS_CLUSTER }}-${{ vars.ECS_WORKER_SERVICE }}"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | python3 -c "
          import sys, json, os
          td = json.load(sys.stdin); tag = os.environ['IMAGE_TAG']
          for c in td.get('containerDefinitions', []):
              if c.get('name') == 'worker':
                  c['image'] = c['image'].rsplit(':', 1)[0] + ':' + tag
          for f in ['taskDefinitionArn','revision','status','requiresAttributes','placementConstraints','compatibilities','registeredAt','registeredBy']:
              td.pop(f, None)
          print(json.dumps(td))")
          ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # Recovers a develop environment that has been put to sleep: a stopped RDS
      # instance, or services left at desiredCount=0. Without this a deploy landing
      # on a sleeping environment would (a) time out on the DB and (b) start zero
      # tasks, so verify never sees the new image. Start RDS (waiting for it to come up) and
      # scale any service at desiredCount=0 back to 1.
      #
      # THIS STEP IS ONE HALF OF A LOOP. A previous version of this comment said no
      # scheduler did the sleeping; that is no longer true, and consuming products
      # should not be read as if it were. Product stacks create EventBridge schedules
      # that stop RDS and scale services to zero off-hours (rally: `idle_schedule` in
      # infra/live/develop/main.tf, firing 21:00 and 03:00 Asia/Ho_Chi_Minh), and this
      # step is what brings the environment back on the next deploy.
      #
      # Two consequences worth knowing before changing either half:
      #
      #   - A deploy landing after the stop WAKES the environment and nothing puts it
      #     back until the next scheduled pass. Rally ran 24/7 for weeks against a
      #     single nightly stop for exactly this reason (measured 2026-08-02). If a
      #     product reports its idle schedule "not working", suspect the interaction
      #     with this step before suspecting the schedule.
      #   - Removing this step does not save money. It breaks waking, and deploys then
      #     fail against a stopped database.
      #
      # Never runs on prod at all — the step is gated on ENVIRONMENT == 'develop', which
      # is the real guarantee. Do not restate prod's RDS topology here: it is pre-launch
      # single-AZ today and Multi-AZ after go-live, and a comment that tracks it will rot.
      # Idempotent and cheap when already awake, so this stays even though the `wake` job
      # has usually done it in parallel with the build: that job is best-effort
      # (continue-on-error), so this call is what actually guarantees the migration step
      # has a database.
      #
      # STILL develop-only, unchanged. Extending it to production looks right — rally's
      # production RDS is idled pre-launch and its own comment claims `ensure_rds` starts
      # it — but the ECS half of this action scales services from 0 to 1, and production
      # sits at min_count = 0 DELIBERATELY before go-live. Waking it on every release
      # would start tasks nobody asked for and quietly bill for them. That gap between
      # rally's comment and this gate is real and worth closing, separately and on
      # purpose, not as a side effect of moving a step into a job.
      - name: Ensure environment is awake (RDS + ECS)
        if: env.ENVIRONMENT == 'develop'
        uses: QNSC-VN/qnsc-ci/actions/ensure-environment-awake@v1
        with:
          rds-identifier: ${{ vars.RDS_INSTANCE_ID }}
          ecs-cluster: ${{ vars.ECS_CLUSTER }}
          ecs-services: ${{ vars.ECS_API_SERVICE }} ${{ vars.ECS_WORKER_SERVICE }}
          region: ${{ inputs.aws_region }}
      - name: Update Migrator task definition to ${{ env.IMAGE_TAG }}
        id: migrator-taskdef
        if: inputs.has_migrator
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          FAMILY="${{ vars.ECS_MIGRATOR_TASK_DEF }}"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition' --output json)
          NEW_DEF=$(echo "$TASK_DEF" | python3 -c "
          import sys, json, os
          td = json.load(sys.stdin); tag = os.environ['IMAGE_TAG']
          for c in td.get('containerDefinitions', []):
              if c.get('name') == 'migrator':
                  c['image'] = c['image'].rsplit(':', 1)[0] + ':' + tag
          for f in ['taskDefinitionArn','revision','status','requiresAttributes','placementConstraints','compatibilities','registeredAt','registeredBy']:
              td.pop(f, None)
          print(json.dumps(td))")
          ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        if: inputs.has_migrator
        uses: QNSC-VN/qnsc-ci/actions/run-db-migration@v1
        with:
          cluster: ${{ vars.ECS_CLUSTER }}
          task-definition: ${{ steps.migrator-taskdef.outputs.arn }}
          subnet-ids: ${{ vars.ECS_MIGRATOR_SUBNET }}
          security-group-ids: ${{ vars.ECS_MIGRATOR_SG }}
          region: ${{ inputs.aws_region }}
          environment: ${{ env.ENVIRONMENT }}

      # On the BUILD path the digest arrives as an artifact — matrix legs cannot
      # safely share a job output (see the note where it is written). On the PROMOTE
      # path there is a single job, so a normal output is fine.
      - name: Fetch API digest from the build
        if: github.ref_type != 'tag'
        # Same major as the upload above — see the warning there before bumping either.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: api-digest

      - name: Resolve API digest
        id: api-digest
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            DIGEST="${{ needs.promote.outputs.api_digest }}"
          else
            DIGEST="$(cat api-digest.txt)"
          fi
          # Fail loudly rather than let the verification below run against an empty
          # reference, which reports a confusing "no attestation found".
          [[ -n "$DIGEST" ]] || { echo "::error::API image digest is empty"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          # registryId == AWS account id; reuse the same secret used for the
          # deploy role ARN above (single source, no ecr:DescribeRegistry).
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com
          # digest resolved & attested in build/promote (no ecr:DescribeImages).
          DIGEST: ${{ steps.api-digest.outputs.digest }}
        run: |
          set -euo pipefail
          # The attestation is signed by THIS reusable workflow (the trusted
          # builder), not the calling repo, so the signer identity must be
          # pinned with --signer-workflow (required for reusable-workflow
          # attestations) while --repo still scopes the source to the caller.
          gh attestation verify "oci://${REGISTRY}/${{ inputs.product }}-api@${DIGEST}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository_owner }}/qnsc-ci/.github/workflows/backend-deploy.yml"

      - name: Deploy API service
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_API_SERVICE }}" \
            --task-definition "${{ steps.api-taskdef.outputs.arn }}" --force-new-deployment \
            --region "${{ inputs.aws_region }}"

      - name: Deploy Worker service
        if: inputs.has_worker
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_WORKER_SERVICE }}" \
            --task-definition "${{ steps.worker-taskdef.outputs.arn }}" --force-new-deployment \
            --region "${{ inputs.aws_region }}"

      - name: Verify API deployment
        id: verify
        run: |
          AWS_MAX_ATTEMPTS=120 aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_API_SERVICE }}" --region "${{ inputs.aws_region }}"
          ACTIVE_TASKDEF=$(aws ecs describe-services --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_API_SERVICE }}" --region "${{ inputs.aws_region }}" --query 'services[0].taskDefinition' --output text)
          ACTIVE_IMAGE=$(aws ecs describe-task-definition --task-definition "$ACTIVE_TASKDEF" --region "${{ inputs.aws_region }}" --query 'taskDefinition.containerDefinitions[0].image' --output text)
          echo "Active image: $ACTIVE_IMAGE"
          if echo "$ACTIVE_IMAGE" | grep -q "${{ env.IMAGE_TAG }}"; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=rollback" >> "$GITHUB_OUTPUT"
            echo "::error ::Deployment did not converge on ${{ env.IMAGE_TAG }} — circuit breaker rolled back to $ACTIVE_IMAGE"
            exit 1
          fi

      # READYZ, not healthz. `/v1/healthz` is a liveness probe: it returns 200
      # unconditionally, without touching a dependency, because it is what the ALB
      # target group polls every 30s and a dependency-coupled probe there would
      # deregister every task the moment a database blipped.
      #
      # That makes it the wrong thing to verify a DEPLOY with. Nothing between
      # `services-stable` and here inspects a dependency, and the application does not
      # exit when one is missing — it logs and degrades. A deploy could therefore go
      # green against an environment whose cache had gone: sessions dead, and the token
      # denylist and rate limiter failing open, with the pipeline reporting success.
      # That is not hypothetical — it is reachable today by deploying an environment
      # whose cache node has been removed.
      #
      # A readiness probe checks postgres and the cache, so a deploy that produces a
      # running but unusable service fails here instead of being reported as a success.
      # This is the one place a dependency-coupled probe belongs: it runs once, after the
      # roll, and nothing deregisters on its result.
      #
      # The path comes from `health_path` (default `/v1/readyz`). Pass a product's own
      # readiness path here and NEVER its liveness path — liveness answers 200 without
      # touching a dependency, which is exactly what makes it useless as a deploy gate.
      - name: Post-deploy readiness check
        if: vars.APP_URL != ''
        uses: QNSC-VN/qnsc-ci/actions/post-deploy-health-check@v1
        with:
          url: ${{ vars.APP_URL }}${{ inputs.health_path }}
          timeout-seconds: '120'

      - name: Deployment summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          {
            echo "### Deploy $STATUS — $ENVIRONMENT"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image tag** | \`$IMAGE_TAG\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Actor** | ${{ github.actor }} |"
            echo "| **API URL** | \`${{ vars.APP_URL }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify deploy result
        if: always()
        uses: QNSC-VN/qnsc-ci/actions/notify-deploy@v1
        with:
          webhook-url: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          status: ${{ job.status == 'success' && 'success' || (steps.verify.outputs.outcome == 'rollback' && 'rollback' || 'failure') }}
          service: ${{ inputs.product }}-api
          environment: ${{ env.ENVIRONMENT }}
          version: ${{ env.IMAGE_TAG }}

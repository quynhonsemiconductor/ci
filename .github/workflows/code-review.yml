# =============================================================================
# Reusable code review — AI review of a pull request against QNSC's rules.
#
# The reviewing is done by our fork of open-code-review, pinned by commit. The fork exists so the
# action cannot change or disappear under us: a pinned SHA protects against a moved tag, but not
# against a repository being deleted, and Actions resolves `uses:` from GitHub at run time.
#
# The fork is deliberately UNMODIFIED. Everything specific to us lives in `rules/` here and in the
# inputs below, so syncing upstream stays a button rather than a merge.
#
# NOT BLOCKING BY DEFAULT, and the default matters more than usual. Our product repositories set
# `required_review_thread_resolution: true`, which means an unresolved review thread blocks a merge
# outright — a green pull request that refuses to merge, reporting only that the base branch policy
# prohibits it. An agent that finds ten things per pull request would turn that into a merge tax, so
# findings go to a single summary comment unless a caller asks otherwise.
# =============================================================================

name: Code review

on:
  workflow_call:
    inputs:
      product:
        description: 'Repository or product name, for the summary comment and logs.'
        required: true
        type: string
      profiles:
        description: >
          Comma-separated rule profiles from `rules/` to merge on top of `base.json` — for example
          `typescript,sql,workflows`. `base` is always included and does not need naming.
        required: false
        type: string
        default: ''
      model:
        description: 'Model to review with.'
        required: false
        type: string
        default: 'glm-5.3'
      llm_url:
        description: >
          Endpoint for the model. Anthropic wants the messages path; an OpenAI-protocol provider wants
          its base URL. For GLM that is `https://open.bigmodel.cn/api/paas/v4`, or
          `https://open.bigmodel.cn/api/coding/paas/v4` on a coding plan.
        required: false
        type: string
        default: 'https://open.bigmodel.cn/api/coding/paas/v4'
      use_anthropic_protocol:
        description: >
          Whether the endpoint speaks Anthropic's protocol. Set to 'false' for an OpenAI-compatible
          provider, which includes GLM: the tool ships `z-ai` and `z-ai-coding` as OpenAI chat
          completions, so leaving this true against a GLM URL fails on the shape of the request rather
          than on anything that names the cause.
        required: false
        type: string
        default: 'false'
      llm_extra_body:
        description: >
          Extra JSON merged into the request body. The default disables Anthropic's thinking block and
          is Anthropic-shaped, so an OpenAI-protocol provider wants '{}' here.
        required: false
        type: string
        default: '{}'
      inline_from_severity:
        description: >
          Lowest severity that becomes a line-level review thread. Everything below it goes to the
          summary instead.

          `none` (default) sends everything to the summary. `high` makes high and critical findings
          inline. `all` makes every finding inline.

          This is a threshold rather than a switch because of what a thread costs where
          `required_review_thread_resolution` is enabled: each one must be resolved by hand before the
          branch can merge. On the first review this reviewer ever ran it produced one correct finding
          and one that was confidently wrong — a `medium` — and a wrong finding that blocks a merge is
          worse than one that is merely read. Keeping medium and low in the summary means being wrong
          costs attention, not a stalled branch.
        required: false
        type: string
        default: 'high'
      language:
        description: 'Language for the review text.'
        required: false
        type: string
        default: 'English'
      rules_ref:
        description: 'Ref of this repository to read `rules/` from. Keep in step with the workflow ref.'
        required: false
        type: string
        default: 'v1'
      resolve_outdated:
        description: >
          Resolve the bot's own inline threads once their lines no longer exist. `false`, `report`
          (logs what it would do, mutates nothing) or `true`.

          `true` requires the CALLING workflow to grant `contents: write`, because GitHub gates the
          resolve mutation on repository write access rather than the pull-request scope — with
          `pull-requests: write` alone the action warns and continues, which looks like it worked.
          That permission is not granted here by default: write access to the repository is a lot to
          hand a reviewer for the convenience of tidying threads.

          Only meaningful with `inline_comments: true`; with the default routing there are no inline
          threads to resolve.
        required: false
        type: string
        default: 'false'
      llm_timeout:
        description: >
          Per-request timeout in seconds. The action defaults to 300, which is too short for a model that
          reasons before answering: GLM-5.3 has always-on reasoning and one review here spent 5m56s —
          356 seconds — so every file was cut off at 300 and the run reported "all 3 file review(s)
          failed — check your LLM configuration and API key". The configuration was correct and the key
          was valid; 26k tokens and five successful tool calls had already been spent by the time it gave
          up. Nothing in that message points at a timeout, which is why this is an input with the reason
          written down.
        required: false
        type: string
        default: '900'
      max_tokens_budget:
        description: >
          Token budget for one review. NOT a hard ceiling, whatever its name suggests: it is checked
          when a group is DISPATCHED and before each further round, so every group already in flight
          finishes its round. With concurrency 8 a 400,000 budget routinely spent 930,000–985,000
          (rova#653, 2026-10-05). `review_concurrency` bounds the overshoot, not this number.

          Part of the checkpoint fingerprint: changing it makes the next run on every open pull
          request a full review. Change it org-wide, deliberately, not per caller.
        required: false
        type: string
        default: '400000'
      effort:
        description: >
          OCR review effort: `low` = one review round per group, `medium` = two, `high` = three.

          `low` because the binding constraint is the model plan's quota, not review depth: rova#653
          drew 37, 19 and 27 findings in three consecutive runs at `medium`, every one of which the
          author answered by hand. A second round mostly adds more of the same. Part of the
          checkpoint fingerprint, like `max_tokens_budget`.
        required: false
        type: string
        default: 'low'
      review_concurrency:
        description: >
          Groups reviewed in parallel. OCR defaults to 8, which is eight simultaneous requests to a
          coding-plan endpoint — a burst that both trips per-minute rate limits (Z.AI 1302) and
          multiplies how far a run overshoots `max_tokens_budget`.
        required: false
        type: string
        default: '4'
      ocr_version:
        description: >
          OpenCodeReview CLI version. Pinned: the action's default is `latest`, so the reviewer
          changed under every caller whenever upstream published (v1.12.11 → v1.12.12 between two
          runs of the same pull request), and the version is part of the checkpoint fingerprint, so
          each release also forced a full re-review of every open pull request.
        required: false
        type: string
        default: '1.12.12'
      large_pr_lines:
        description: >
          Changed lines in REVIEWABLE files (after excludes, as `ocr review --preview` counts them)
          above which a pull request is "large". A large pull request is reviewed when it is opened,
          reopened or marked ready for review, and not on every push.

          The reason is the checkpoint: it only advances after a COMPLETE review, and a large pull
          request never completes inside the budget — rova#653 (75 files) was reviewed in full six
          times in one day, 12–19 files each time, about 950,000 tokens a run. Without this, every
          push to a large branch pays for a fresh partial review of the same files. `0` disables.
        required: false
        type: string
        default: '2500'
      exclude:
        description: >
          Extra comma-separated gitignore-style patterns this repository never wants reviewed, on top
          of the ones the profiles declare (lockfiles, generated code, migration metadata).
        required: false
        type: string
        default: ''
    secrets:
      llm_token:
        description: 'API key for the model. Set once as an organisation secret.'
        required: true
      app_private_key:
        description: 'Private key for `app_id`. Required when `app_id` is set.'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Code review
    # Skip pull requests a bot opened, which in practice means Renovate. A dependency bump changes a
    # manifest and a lockfile, and nothing in the rules speaks to that: they are about layering, tenant
    # scoping, accessibility, migrations and the shape of a comment. The risk a bump carries is covered by
    # osv-scanner, Semgrep and Renovate's own `minimumReleaseAge`, which is why dependency review was
    # deliberately removed from base.json rather than written there.
    #
    # Here rather than in each caller: it is a policy, not a per-repository choice, and a policy repeated
    # in twenty files is one that will disagree with itself.
    #
    # Drafts are skipped for the same reason a large pull request is not re-reviewed per push: a
    # draft is still moving, and every review of it spends quota on code that will change. It is
    # reviewed when marked ready — on `ready_for_review` where the caller subscribes to it, otherwise
    # on the first push after.
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Assemble the ruleset
        # The rules live in this repository while the workflow runs in the caller's checkout, so they
        # are fetched rather than checked out: `actions/checkout` would have to land inside the
        # caller's workspace, and the review action does its own checkouts of base and head there.
        #
        # Downloaded from the same ref the caller pinned the workflow to, so rules and workflow move
        # together. A missing profile fails the step rather than reviewing with silently fewer rules
        # than the caller asked for.
        env:
          PROFILES: ${{ inputs.profiles }}
          RULES_REF: ${{ inputs.rules_ref }}
          INLINE_FROM: ${{ inputs.inline_from_severity }}
          EXTRA_EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/quynhonsemiconductor/ci'
          work="$RUNNER_TEMP/qnsc-rules"
          mkdir -p "$work"

          fetch() {
            local name="$1"
            if ! curl -fsSL "$base/$RULES_REF/rules/$name.json" -o "$work/$name.json"; then
              echo "::error::rule profile '$name' not found at $RULES_REF — check the name against ci/rules/"
              exit 1
            fi
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$work/$name.json" \
              || { echo "::error::rule profile '$name' is not valid JSON"; exit 1; }
            echo "  loaded $name"
          }

          echo "Assembling rules from ci@$RULES_REF"
          fetch base
          names='base'
          IFS=',' read -ra requested <<< "${PROFILES:-}"
          for p in "${requested[@]:-}"; do
            p="$(echo "$p" | tr -d '[:space:]')"
            [ -z "$p" ] && continue
            [ "$p" = 'base' ] && continue
            fetch "$p"
            names="$names,$p"
          done

          # Compose the ruleset. This is NOT a concatenation, because of how the tool resolves a
          # rule for a file: patterns are checked in order and THE FIRST MATCH WINS, and
          # `merge_system_rule` merges the winner with the tool's built-in rule for that file — not
          # with our other rules.
          #
          # So a naive concatenation with `base` first would have made every language rule
          # unreachable: `**/*` matches everything, wins, and nothing after it is ever consulted.
          # Instead the base text is folded INTO each specific rule, and base is also emitted last as
          # the catch-all for files no profile claims. Profile order is preserved, and within each
          # profile the broad pattern is listed last for the same reason.
          python3 - "$work" "$names" <<'PY'
          import json, os, sys

          work, names = sys.argv[1], sys.argv[2].split(',')

          def rules_of(name):
              with open(os.path.join(work, f'{name}.json'), encoding='utf-8') as fh:
                  return json.load(fh).get('rules', [])

          base_rules = rules_of('base')
          base_text = '\n\n'.join(r['rule'] for r in base_rules)

          composed = []
          for name in names:
              if name == 'base':
                  continue
              for r in rules_of(name):
                  composed.append({
                      'path': r['path'],
                      'merge_system_rule': r.get('merge_system_rule', True),
                      # Specific rule first: it is the reason this file matched. The org-wide rules
                      # follow, present in full because no later pattern will be consulted.
                      'rule': f"{r['rule']}\n\n---\n\n{base_text}",
                  })

          # Test-file rules are hoisted to the front, so the order a caller lists profiles in cannot
          # decide whether a test is reviewed as a test. Without this, `profiles: frontend,typescript`
          # sends `app-popover.test.tsx` to the `**/*.tsx` rule, and the rules written specifically
          # about tests that cannot fail never run on a test.
          composed.sort(key=lambda r: 0 if ('test' in r['path'] or 'spec' in r['path']) else 1)

          # Catch-all last: files no profile claims still get the org-wide rules.
          composed.extend(base_rules)

          # Excludes are a UNION across profiles plus the caller's own: a file one profile says is
          # never worth reviewing (a lockfile, a generated client) is not worth it under any other.
          # Top-level in the rule file, where OCR reads them (`ProjectRule.Exclude`). Note that OCR
          # takes include/exclude from ONE layer only — the highest that sets any — so these replace,
          # not extend, a repository's own `.opencodereview/rule.json` excludes; `exclude:` is the
          # input for those.
          excludes = []
          includes = []
          for name in names:
              with open(os.path.join(work, f'{name}.json'), encoding='utf-8') as fh:
                  doc = json.load(fh)
              excludes += doc.get('exclude', [])
              # `include` is an OVERRIDE, not a whitelist: in OCR a matching file skips the built-in
              # default-path and extension excludes (exclude still wins over it), and files that
              # match nothing are selected exactly as before. That is how a test that holds a
              # security boundary is reviewed while the other test files stay out.
              includes += doc.get('include', [])
          excludes += [p.strip() for p in os.environ.get('EXTRA_EXCLUDE', '').split(',') if p.strip()]
          excludes = list(dict.fromkeys(excludes))
          includes = list(dict.fromkeys(includes))

          out = os.path.join(work, 'merged.json')
          with open(out, 'w', encoding='utf-8') as fh:
              json.dump({'rules': composed, 'exclude': excludes, 'include': includes}, fh,
                        indent=2, ensure_ascii=False)

          print(f'{len(composed)} rules composed from {len(names)} profile(s)')
          for r in composed:
              print(f"  {r['path']}  ({len(r['rule'])} chars)")
          print(f'{len(excludes)} exclude pattern(s): {", ".join(excludes)}')
          print(f'{len(includes)} include pattern(s): {", ".join(includes) or "none"}')
          PY

          # The gate script, from the same ref as the rules, for the same reason.
          curl -fsSL "$base/$RULES_REF/scripts/code_review_gate.py" -o "$work/gate.py" \
            || { echo "::error::scripts/code_review_gate.py not found at $RULES_REF"; exit 1; }
          echo "QNSC_GATE=$work/gate.py" >> "$GITHUB_ENV"

          echo "QNSC_RULE_FILE=$work/merged.json" >> "$GITHUB_ENV"

          # Severity routing threshold, computed here rather than in an `if`-expression on the step
          # below. Routing is at-or-below the value, and the value must be EMPTY to route nothing —
          # but an Actions expression cannot yield an empty string inside a `||` chain, because
          # `X && ''` evaluates to '' which is falsy and falls through to the next branch. That is not
          # a hypothetical: the `all` case silently became `critical`, so every finding went to the
          # summary and no inline thread was ever created. A shell variable can simply be empty.
          case "${INLINE_FROM:-none}" in
            all)      below='' ;;
            critical) below='high' ;;
            high)     below='medium' ;;
            medium)   below='low' ;;
            *)        below='critical' ;;
          esac
          echo "QNSC_ROUTE_BELOW=$below" >> "$GITHUB_ENV"
          echo "severity routing: inline_from_severity='${INLINE_FROM:-none}' -> route_severity_below='$below'"

      - name: Mint a token for our own App
        # Only when the organisation variable is set. Read from the CALLER's context — a reusable
        # workflow sees the caller's `vars`, which is how infra-plan.yml already resolves
        # QNSC_AUTOMATION_APP_ID — so no repository needs to pass an id that is the same everywhere.
        # The App is used purely as an identity: comments carry its name and avatar, and there is no
        # webhook, no endpoint and nothing running anywhere.
        if: vars.CODE_REVIEW_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.CODE_REVIEW_APP_ID }}
          private-key: ${{ secrets.app_private_key }}
          # Exactly what the `qnsc-code-review` installation grants, named so the token cannot widen
          # if the App is ever given more. Comments on a pull request are `pull_requests: write`.
          permission-contents: read
          permission-pull-requests: write

      # ── Decide whether to spend a review ─────────────────────────────────────
      #
      # Everything up to `Review` is free: GitHub's API, git, and OCR's `--preview`, none of which
      # call the model. The quota is spent only after each of these has said yes, and each one fails
      # OPEN — a question it cannot answer leaves the review running as it did before.

      - name: Is this a dependency-only change?
        # A bump PR a person opens is not skipped by the Bot check above. Its lockfile is never
        # selected for review, but the agent READS it for context: rova#652 (package.json,
        # pnpm-workspace.yaml, pnpm-lock.yaml) spent 509,506 tokens paging through a 13,000-line
        # lockfile and stopped on the budget with nothing reviewed.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/pr-files.jsonl"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | {filename, patch}' > "$files" || : > "$files"
          python3 "$QNSC_GATE" scope --files "$files"

      - name: Check out for the size check
        if: steps.scope.outputs.dependency_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: How large is it?
        # `ocr review --preview` selects files exactly as the review will — built-in excludes,
        # ours, the extension allowlist — and makes no model call. Installed at the pinned version
        # the review uses, so the preview and the review cannot disagree about what is selected.
        if: steps.scope.outputs.dependency_only != 'true'
        id: size
        env:
          OCR_VERSION: ${{ inputs.ocr_version }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LARGE_PR_LINES: ${{ inputs.large_pr_lines }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -uo pipefail
          preview="$RUNNER_TEMP/ocr-preview.json"
          # No fetch: the checkout above (full history, the PR's merge ref) already holds the base
          # branch and the head commit, and has no credentials left to fetch more with.
          # An exact version, the same one the action installs a minute later — there is no lockfile
          # for a global CLI to install from (zizmor reports this as low-severity adhoc-packages).
          npm install -g --silent "@alibaba-group/open-code-review@${OCR_VERSION}"
          installed=$?
          if [ "$installed" -eq 0 ] \
             && mb="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" \
             && ocr review --from "$mb" --to "$HEAD_SHA" --rule "$QNSC_RULE_FILE" \
                  --preview --format json > "$preview" 2> "$RUNNER_TEMP/ocr-preview.err"; then
            :
          else
            echo "::warning::review preview failed; reviewing without a size check"
            cat "$RUNNER_TEMP/ocr-preview.err" 2>/dev/null || true
            : > "$preview"
          fi
          python3 "$QNSC_GATE" size --preview "$preview"

      - name: Can the model be reached?
        # One request of a few tokens, read for the provider's own error code. Without it, a spent
        # quota surfaced as 630 failed attempts and "check your LLM configuration and API key".
        # A rate limit is retried twice (15s, 45s) before it is called unavailable.
        if: >-
          steps.scope.outputs.dependency_only != 'true'
          && steps.size.outputs.defer != 'true'
          && steps.size.outputs.reviewable != '0'
        id: probe
        env:
          LLM_URL: ${{ inputs.llm_url }}
          LLM_TOKEN: ${{ secrets.llm_token }}
          LLM_MODEL: ${{ inputs.model }}
          USE_ANTHROPIC: ${{ inputs.use_anthropic_protocol }}
          EXTRA_BODY: ${{ inputs.llm_extra_body }}
        run: python3 "$QNSC_GATE" probe

      - name: Review
        id: review
        if: >-
          steps.scope.outputs.dependency_only != 'true'
          && steps.size.outputs.defer != 'true'
          && steps.size.outputs.reviewable != '0'
          && steps.probe.outputs.probe != 'unavailable'
          && steps.probe.outputs.probe != 'config'
        # The action fails its own job whenever `ocr` exits non-zero — including when the provider
        # refused every request. The verdict below reads the result file and decides what that
        # failure means, so the job's colour is decided in one place, not two.
        continue-on-error: true
        # Pinned by commit, and not exposed as an input: `uses:` is resolved before expressions are
        # evaluated, so a caller-supplied ref is impossible here. Bumping is an edit to this line,
        # which is the right place for it — a review bot that changed per caller would give different
        # answers on the same code.
        uses: quynhonsemiconductor/code-review@85cecfe5f935da2b2aae8f91ce4fee8ed343a681 # v1.12.7
        with:
          # The App's token when one was minted, so the comment carries our identity; otherwise the
          # default Actions token. The checkpoint is read back only from a summary THIS token wrote.
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          ocr_version: ${{ inputs.ocr_version }}
          llm_url: ${{ inputs.llm_url }}
          llm_auth_token: ${{ secrets.llm_token }}
          llm_model: ${{ inputs.model }}
          llm_use_anthropic: ${{ inputs.use_anthropic_protocol }}
          llm_extra_body: ${{ inputs.llm_extra_body }}
          language: ${{ inputs.language }}
          rule: ${{ env.QNSC_RULE_FILE }}
          # One summary comment, updated in place on each push, rather than a growing pile.
          sticky_summary: 'true'
          # Review only what changed since the last COMPLETE review, instead of everything from the
          # merge base on every push. Fail-closed by design: a moved base, a changed config (model,
          # rules, budget, effort, OCR version) or a force-push reviews the full range again. This is
          # the largest single saving: rova#653 had six full reviews in one day.
          checkpoint_range: 'true'
          effort: ${{ inputs.effort }}
          review_concurrency: ${{ inputs.review_concurrency }}
          llm_timeout: ${{ inputs.llm_timeout }}
          max_tokens_budget: ${{ inputs.max_tokens_budget }}
          # Routing is at-or-below the threshold, so the value here is one step BELOW what should stay
          # inline: to keep high and critical inline, medium and everything under it is routed.
          #
          # One gap worth knowing: a finding whose severity the model leaves empty is never routed by
          # this policy, so it can still arrive inline. Routing fails open by design — it would rather
          # post a finding in the wrong place than drop it.
          # `all` maps to a deliberately unknown value rather than an empty string. An empty string is
          # what disables routing, but `X && ''` in an Actions expression evaluates to '' — which is
          # FALSY — so that branch fell through the `||` chain and landed on `critical`, routing every
          # finding to the summary. `all` could never fire. The action documents that an empty OR
          # unknown value disables routing, so a word it does not recognise does the job and cannot be
          # mistaken for a missing value.
          route_severity_below: ${{ env.QNSC_ROUTE_BELOW }}
          resolve_outdated: ${{ inputs.resolve_outdated }}

      - name: Say what the review covered
        # The action publishes what it FOUND. It does not say whether the review was complete — every
        # review of rova#653 covered 12–19 of 75 files and still read "found nothing blocking" — and
        # it says nothing when it did not run. Silence, "not run" and "partial" looked identical.
        #
        # One comment, updated in place, so a pull request does not collect a verdict per push.
        id: verdict
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR: ${{ github.event.pull_request.number }}
          DEPENDENCY_ONLY: ${{ steps.scope.outputs.dependency_only }}
          DEFER: ${{ steps.size.outputs.defer }}
          REVIEWABLE: ${{ steps.size.outputs.reviewable }}
          REVIEW_LINES: ${{ steps.size.outputs.review_lines }}
          PROBE: ${{ steps.probe.outputs.probe }}
          PROBE_CODE: ${{ steps.probe.outputs.probe_code }}
          PROBE_MESSAGE: ${{ steps.probe.outputs.probe_message }}
          REVIEW_RAN: ${{ steps.review.outcome == 'success' || steps.review.outcome == 'failure' }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          TOTAL: ${{ steps.review.outputs.comments_total }}
          INLINE: ${{ steps.review.outputs.comments_inline }}
          FAILED: ${{ steps.review.outputs.comments_failed }}
          ROUTED: ${{ steps.review.outputs.comments_routed }}
          RANGE: ${{ steps.review.outputs.range_summary }}
          RANGE_REASON: ${{ steps.review.outputs.range_reason }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/verdict.md"
          python3 "$QNSC_GATE" verdict --result /tmp/ocr-result.json --body-out "$body"
          [ -s "$body" ] || { echo "same head as the last complete review; verdict unchanged"; exit 0; }

          marker='<!-- qnsc-review-verdict -->'
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | first // empty" 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$body" >/dev/null
            echo "updated verdict comment $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" >/dev/null
            echo "posted verdict comment"
          fi

      - name: Fail only for what someone must fix
        # A rejected key or plan, or a reviewer that crashed. Not a spent quota, not a partial
        # review: red for a reason the author cannot act on teaches everyone to ignore red.
        if: always() && steps.verdict.outputs.fail == 'true'
        env:
          STATE: ${{ steps.verdict.outputs.state }}
        run: |
          echo "::error::code review ${STATE}; see the verdict comment on the pull request"
          exit 1

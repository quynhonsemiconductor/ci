# =============================================================================
# Reusable: web (SPA) deploy — build the Vite/Astro bundle, publish to
# Cloudflare Pages. One workflow for every QNSC frontend.
#
# Two deploy shapes, selected by `single_environment`:
#   • DUAL  (default, single_environment='') — 2-env products (rally, opshub):
#       main push → develop (auto),  v*.*.* tag → production (env-gated).
#   • SINGLE (single_environment='production') — 1-env apps (landing, ceo-suite):
#       main push → that one environment. No tag/promotion — deploy on merge.
#       Add a required reviewer on the GitHub Environment to gate the deploy.
#
# Package manager, build command, dist path and optional D1 migrations are all
# inputs, so the same reusable serves pnpm monorepos and standalone npm apps.
# VITE_*/PAGES_PROJECT/APP_URL stay env-scoped GitHub vars (caller: secrets: inherit).
#
# Data-app safety knobs (all opt-in, default off — no effect on static sites):
#   • backup_before_migrate — export D1 to a restore point BEFORE migrating
#       (90-day artifact always; + R2 archive when d1_backup_bucket is set).
#       Blocking: no backup ⇒ no migrate.
#   • require_health_check   — refuse to deploy if APP_URL is unset (a data app
#       must be verifiable post-deploy, not shipped blind).
#   • wrangler_version       — pinned wrangler for reproducible D1 export/migrate
#       (never floating `npx wrangler` latest).
# Migrations are forward-only and NOT atomic with the publish — keep them
# backward-compatible (expand/contract).
#
# `working_directory` is the CWD for the wrangler deploy. It defaults to the repo
# root, which suits standalone apps. Monorepos whose web app lives in a subdir
# (e.g. rally: apps/web) must set it so wrangler discovers that package's
# file-based Pages Functions (the `functions/` dir is resolved relative to the
# wrangler CWD). `web_dist_path` is then relative to `working_directory`.
# =============================================================================
name: Reusable · Web Deploy

on:
  workflow_call:
    inputs:
      product:            { required: true, type: string }
      package_manager:    { type: string, default: "pnpm" }        # pnpm | npm
      web_package:        { type: string, default: "" }            # pnpm filter; defaults to <product>-web
      build_command:      { type: string, default: "" }            # overrides derived build; e.g. "npm run build"
      web_dist_path:      { type: string, default: "apps/web/dist" }  # relative to working_directory
      working_directory:  { type: string, default: "." }            # wrangler CWD; set to the web pkg dir (e.g. apps/web) so file-based Pages Functions resolve
      single_environment: { type: string, default: "" }            # set (e.g. production) for 1-env apps
      run_d1_migrations:  { type: boolean, default: false }        # apply D1 migrations before deploy
      d1_database:        { type: string, default: "" }            # D1 database name (with run_d1_migrations)
      backup_before_migrate: { type: boolean, default: false }     # export D1 to a restore point BEFORE migrating (data apps)
      d1_backup_bucket:   { type: string, default: "" }            # R2 bucket for durable backup archive; empty = GitHub artifact only
      require_health_check:  { type: boolean, default: false }     # fail the deploy if APP_URL is unset (no post-deploy verification possible)
      wrangler_version:   { type: string, default: "4.107.0" }     # pin wrangler for reproducible D1 export/migrate (never floating latest)
      node_version:       { type: string, default: "22" }
      pnpm_version:       { type: string, default: "10.33.2" }
    secrets:
      CLOUDFLARE_API_TOKEN:  { required: true }
      CLOUDFLARE_ACCOUNT_ID: { required: true }
      SLACK_DEPLOY_WEBHOOK:  { required: false }

# Safe-by-default at the shared layer (callers also set their own group). Never
# cancel a running web deploy — a half-applied Pages publish / D1 migration is
# worse than a queued one.
concurrency:
  group: web-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Resolve context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.ctx.outputs.environment }}
      asset_tag:   ${{ steps.ctx.outputs.asset_tag }}
    steps:
      - id: ctx
        env:
          SINGLE_ENV: ${{ inputs.single_environment }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            ASSET_TAG="$REF_NAME"
          else
            ASSET_TAG="sha-$SHA"
          fi
          echo "asset_tag=$ASSET_TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$SINGLE_ENV" ]]; then
            # 1-env app — always the one environment, regardless of trigger.
            echo "environment=$SINGLE_ENV" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=develop" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to ${{ needs.context.outputs.environment }}
    runs-on: ubuntu-latest
    needs: context
    environment: ${{ needs.context.outputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read   # pull private @scope/* deps from GitHub Packages during pnpm install
    env:
      ASSET_TAG:   ${{ needs.context.outputs.asset_tag }}
      ENVIRONMENT: ${{ needs.context.outputs.environment }}
      WEB_PACKAGE: ${{ inputs.web_package != '' && inputs.web_package || format('{0}-web', inputs.product) }}
      # pnpm installs the whole workspace at the repo root; monorepos whose
      # backend depends on private @scope/* packages need this to authenticate
      # the GitHub Packages registry (.npmrc reads ${NODE_AUTH_TOKEN}).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ── Pre-flight — fail fast BEFORE build/migrate/publish ────────────────
      # A data app that requires post-deploy verification must have somewhere to
      # verify. Catch a missing APP_URL up front rather than silently shipping
      # unverified (the health-check step below is skipped when APP_URL is empty).
      - name: Pre-flight — required config
        if: inputs.require_health_check && vars.APP_URL == ''
        env:
          ENVIRONMENT: ${{ needs.context.outputs.environment }}
        run: |
          echo "::error ::require_health_check=true but the APP_URL env var is unset for '${ENVIRONMENT}'. Set it so the post-deploy health check can run; refusing to deploy unverified." >&2
          exit 1

      # ── Install (pnpm — org default) ────────────────────────────────────────
      - name: Install dependencies (pnpm)
        if: inputs.package_manager == 'pnpm'
        uses: quynhonsemiconductor/qnsc-ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ inputs.node_version }}
          pnpm-version: ${{ inputs.pnpm_version }}

      # ── Install (npm — standalone apps like ceo-suite) ─────────────────────
      - name: Setup Node (npm)
        if: inputs.package_manager == 'npm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      # ── Build — VITE_* baked in at build time (env-scoped) ─────────────────
      #
      # VITE_API_URL and VITE_API_BASE_URL are BOTH here because the two SPA shapes we
      # run are genuinely different, and collapsing them onto one name would be a trap:
      #
      #   same-origin BFF (rally)  — builds with VITE_API_URL deliberately EMPTY, so the
      #     app calls relative /v1/* paths that a Pages Function proxies to the API. That
      #     is required for its __Host- session cookie.
      #   direct bearer-token API (qnsc-kb) — needs the ABSOLUTE api origin baked in,
      #     because the SPA and the API are on different hostnames.
      #
      # One shared name would mean "empty is correct" for one product and "empty is
      # broken" for the other, and being wrong is SILENT: the app falls back to a
      # relative path, Cloudflare Pages answers it with index.html, and every API call
      # returns HTML with a 200 instead of failing. The assertion below is what makes it
      # loud.
      - name: Build
        env:
          VITE_API_URL:         ${{ vars.VITE_API_URL }}
          VITE_API_BASE_URL:    ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_ENV:         ${{ vars.VITE_APP_ENV }}
          BUILD_COMMAND:  ${{ inputs.build_command }}
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          set -euo pipefail
          # build_command wins (standalone/single-package apps pass e.g. "pnpm build"
          # or "npm run build"); otherwise derive: npm → npm run build; pnpm monorepo
          # → filter the <product>-web workspace package.
          if [ -n "$BUILD_COMMAND" ]; then
            eval "$BUILD_COMMAND"
          elif [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm run build
          else
            pnpm --filter "$WEB_PACKAGE" build
          fi

      # ── Assert the API origin actually reached the bundle ──────────────────
      # A VITE_* variable that never arrives does not fail the build — Vite substitutes
      # undefined, the app takes its relative-path fallback, and Cloudflare Pages serves
      # index.html for every API call. The result is a deployed site that looks healthy
      # and cannot log in, which is exactly how qnsc-kb shipped: the caller published
      # VITE_API_BASE_URL while this workflow only exported VITE_API_URL, and nothing
      # anywhere said so.
      #
      # Only checked when the variable is set AND absolute. A product that builds with it
      # empty on purpose (a same-origin BFF) is skipped, not failed.
      - name: Verify the API origin is baked into the bundle
        working-directory: ${{ inputs.working_directory }}
        env:
          VITE_API_URL:      ${{ vars.VITE_API_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          DIST: ${{ inputs.web_dist_path }}
        run: |
          set -euo pipefail
          for name in VITE_API_URL VITE_API_BASE_URL; do
            value="${!name:-}"
            case "$value" in
              https://*) ;;
              *) continue ;;   # unset, or deliberately relative — nothing to assert
            esac
            if grep -rqF "$value" "$DIST"; then
              echo "✓ $name ($value) is present in $DIST"
            else
              echo "::error::$name is set to '$value' but does not appear anywhere in $DIST."
              echo "::error::The build did not pick it up — the app will fall back to a relative path and every API call will return index.html."
              echo "::error::Check that the SPA reads import.meta.env.$name and that the variable is scoped to this deploy environment."
              exit 1
            fi
          done

      # ── D1 backup — capture a restore point BEFORE any schema change ───────
      # Migrations against --remote are irreversible; a data app must have a
      # pre-migration export to roll back to. The export always lands as a
      # 90-day GitHub artifact (works with zero extra infra); when a durable R2
      # bucket is provided it is also archived there. Blocking on purpose: no
      # backup ⇒ no migrate. wrangler is version-pinned for reproducibility.
      - name: Export D1 (pre-migration backup)
        if: inputs.run_d1_migrations && inputs.backup_before_migrate
        working-directory: ${{ inputs.working_directory }}
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: ${{ inputs.d1_database }}
          WRANGLER_VERSION: ${{ inputs.wrangler_version }}
        run: |
          set -euo pipefail
          FILE="d1-backup-${D1_DATABASE}-${ASSET_TAG//\//-}.sql"
          echo "D1_BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 export "${D1_DATABASE}" --remote --output "$FILE"
          test -s "$FILE" || { echo "::error ::D1 export produced an empty file — aborting before migrate." >&2; exit 1; }
          echo "Exported ${D1_DATABASE} → $FILE ($(wc -c <"$FILE") bytes)"

      - name: Upload D1 backup (artifact)
        if: inputs.run_d1_migrations && inputs.backup_before_migrate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: d1-backup-${{ inputs.product }}-${{ needs.context.outputs.asset_tag }}
          path: ${{ format('{0}/{1}', inputs.working_directory, env.D1_BACKUP_FILE) }}
          retention-days: 90
          if-no-files-found: error

      - name: Archive D1 backup to R2
        if: inputs.run_d1_migrations && inputs.backup_before_migrate && inputs.d1_backup_bucket != ''
        working-directory: ${{ inputs.working_directory }}
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCT: ${{ inputs.product }}
          WRANGLER_VERSION: ${{ inputs.wrangler_version }}
          D1_BACKUP_BUCKET: ${{ inputs.d1_backup_bucket }}
        run: |
          set -euo pipefail
          KEY="${PRODUCT}/${ENVIRONMENT}/${D1_BACKUP_FILE}"
          npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put "${D1_BACKUP_BUCKET}/${KEY}" --file "${D1_BACKUP_FILE}" --remote
          echo "Archived backup → r2://${D1_BACKUP_BUCKET}/${KEY}"

      # ── D1 migrations (data apps) — applied before the new code is live ────
      # Forward-only + not atomic with the publish below: migrations MUST be
      # backward-compatible (expand/contract) so old code keeps working if the
      # publish step fails after this succeeds.
      - name: Apply D1 migrations
        if: inputs.run_d1_migrations
        working-directory: ${{ inputs.working_directory }}
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: ${{ inputs.d1_database }}
          WRANGLER_VERSION: ${{ inputs.wrangler_version }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" d1 migrations apply "${D1_DATABASE}" --remote

      # ── Publish to Cloudflare Pages ────────────────────────────────────────
      # wrangler-action auto-detects the package manager by looking for a
      # lockfile INSIDE workingDirectory. Monorepo callers (rally, opshub) set
      # working_directory to the web package's own subdir (e.g. apps/web),
      # which has no lockfile of its own — the pnpm lockfile lives at the repo
      # root. Detection then falls through to npm, whose `npm install`/`npx`
      # bootstrap of wrangler walks the pnpm-managed node_modules tree it
      # doesn't understand and fails trying to run a transitive dependency's
      # postinstall script (e.g. "sh: run-s: not found"). packageManager is
      # only read for THIS install-wrangler bootstrap, not the app's own build
      # (already done above, in the "Build" step) — inputs.package_manager is
      # always exactly "pnpm" or "npm" (see the input schema above), both
      # values this action accepts directly, so this is correct for standalone
      # npm callers (ceo-suite) too, not just pnpm monorepos.
      # Accepted risk (Low confidence): setup-node's `cache: npm` upstream, then this
      # deploy step, is zizmor's generic "cache-poisoning" shape — a poisoned npm cache
      # entry could theoretically ride through to what gets published. Mitigated by this
      # workflow only ever running on push to main/tags (every caller), never on an
      # untrusted PR — there's no attacker-controlled run in a position to poison the
      # cache before this step reads it. Inherent to any Node build+deploy pipeline using
      # actions/setup-node's built-in caching; disabling it costs real build time for a
      # finding with no realistic trigger here.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0  # zizmor: ignore[cache-poisoning]
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working_directory }}
          packageManager: ${{ inputs.package_manager }}
          command: >-
            pages deploy ${{ inputs.web_dist_path }}
            --project-name=${{ vars.PAGES_PROJECT }}
            --branch=main

      - name: Post-deploy health check
        if: vars.APP_URL != ''
        uses: quynhonsemiconductor/qnsc-ci/actions/post-deploy-health-check@v1
        with:
          url: ${{ vars.APP_URL }}
          expected-status: '200'
          timeout-seconds: '60'

      - name: Deployment summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          {
            echo "### Deploy $STATUS — $ENVIRONMENT"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Asset tag** | \`$ASSET_TAG\` |"
            echo "| **Pages project** | \`$PAGES_PROJECT\` |"
            echo "| **Actor** | $ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify deploy result
        if: always()
        uses: quynhonsemiconductor/qnsc-ci/actions/notify-deploy@v1
        with:
          webhook-url: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          service: ${{ inputs.product }}-web
          environment: ${{ env.ENVIRONMENT }}
          version: ${{ env.ASSET_TAG }}

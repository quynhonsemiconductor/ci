# =============================================================================
# Reusable: web (SPA) deploy — build the bundle and publish it to Cloudflare
# Pages. One environment per app: every merge to main deploys that environment.
#
# History, so it is not re-added by accident: this reusable used to carry three
# more shapes that NO caller ever selected — `target: workers` with a prod
# version-roll gate, the D1 backup/migrate steps, and the dual-environment mode
# that named environments `develop`/`production`. The org's product SPAs moved
# to images served from the cluster (DELIVERY-DESIGN §3.1), and rova/opshub keep
# their own Worker workflow for the legacy path; the only callers left are the
# two landing sites, both single-environment Pages. The unused branches were
# deleted with the AWS exit, not because Pages is preferred for products.
#
# Package manager, build command and dist path stay inputs, so the reusable
# serves pnpm monorepos and standalone npm apps. VITE_*/PAGES_PROJECT/APP_URL
# stay env-scoped GitHub vars (caller passes only the Cloudflare token).
# =============================================================================
name: Reusable · Web Deploy

on:
  workflow_call:
    inputs:
      product:            { required: true, type: string }
      package_manager:    { type: string, default: "pnpm" }        # pnpm | npm
      web_package:        { type: string, default: "" }            # pnpm filter; defaults to <product>-web
      build_command:      { type: string, default: "" }            # overrides derived build; e.g. "npm run build"
      web_dist_path:      { type: string, default: "apps/web/dist" }
      working_directory:  { type: string, default: "." }            # wrangler CWD
      single_environment: { type: string, default: "production" }   # the one GitHub environment this app deploys to
      wrangler_version:   { type: string, default: "4.107.0" }     # pinned: the deploy must not float
      node_version:       { type: string, default: "22" }
      pnpm_version:       { type: string, default: "" }             # empty = the caller's packageManager decides
    secrets:
      CLOUDFLARE_API_TOKEN:  { required: true }

# Never cancel a running web deploy — a half-applied Pages publish is worse
# than a queued one.
concurrency:
  group: web-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Resolve context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.ctx.outputs.environment }}
      asset_tag:   ${{ steps.ctx.outputs.asset_tag }}
    steps:
      - id: ctx
        env:
          ENVIRONMENT: ${{ inputs.single_environment }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "asset_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "asset_tag=sha-$SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ needs.context.outputs.environment }}
    runs-on: ubuntu-latest
    needs: context
    environment: ${{ needs.context.outputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read   # pull private @scope/* deps from GitHub Packages during pnpm install
    env:
      ASSET_TAG:   ${{ needs.context.outputs.asset_tag }}
      ENVIRONMENT: ${{ needs.context.outputs.environment }}
      WEB_PACKAGE: ${{ inputs.web_package != '' && inputs.web_package || format('{0}-web', inputs.product) }}
      # pnpm installs the whole workspace at the repo root; monorepos whose
      # backend depends on private @scope/* packages need this to authenticate
      # the GitHub Packages registry (.npmrc reads ${NODE_AUTH_TOKEN}).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-flight — Cloudflare account id
        if: vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error ::vars.CLOUDFLARE_ACCOUNT_ID is empty. The account id is an identifier, not a secret: the reusable reads the ORG VARIABLE directly, so no caller passes anything. Set the CLOUDFLARE_ACCOUNT_ID org variable (Actions > Variables) if it is missing." >&2
          exit 1

      # ── Install (pnpm — org default) ────────────────────────────────────────
      - name: Install dependencies (pnpm)
        if: inputs.package_manager == 'pnpm'
        uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@208f7081f59fdbe5a454d7e836d1b04ac4b04d97 # v1.24.1
        with:
          node-version: ${{ inputs.node_version }}
          pnpm-version: ${{ inputs.pnpm_version }}

      # ── Install (npm — standalone apps like ceo-suite) ─────────────────────
      - name: Setup Node (npm)
        if: inputs.package_manager == 'npm'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
      - name: Install dependencies (npm)
        if: inputs.package_manager == 'npm'
        run: npm ci

      # ── Build — VITE_* baked in at build time (env-scoped) ─────────────────
      #
      # VITE_API_URL and VITE_API_BASE_URL are BOTH here because the two SPA shapes we
      # run are genuinely different, and collapsing them onto one name would be a trap:
      #
      #   same-origin BFF  — builds with VITE_API_URL deliberately EMPTY, so the app
      #     calls relative /v1/* paths that the edge proxies to the API.
      #   direct bearer-token API — needs the ABSOLUTE api origin baked in.
      #
      # One shared name would mean "empty is correct" for one product and "empty is
      # broken" for the other, and being wrong is SILENT: the app falls back to a
      # relative path, Cloudflare Pages answers it with index.html, and every API call
      # returns HTML with a 200 instead of failing. The assertion below makes it loud.
      - name: Build
        env:
          VITE_API_URL:         ${{ vars.VITE_API_URL }}
          VITE_API_BASE_URL:    ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_ENV:         ${{ vars.VITE_APP_ENV }}
          BUILD_COMMAND:  ${{ inputs.build_command }}
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          set -euo pipefail
          # build_command wins (standalone/single-package apps pass e.g. "pnpm build"
          # or "npm run build"); otherwise derive: npm → npm run build; pnpm monorepo
          # → filter the <product>-web workspace package.
          if [ -n "$BUILD_COMMAND" ]; then
            eval "$BUILD_COMMAND"
          elif [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm run build
          else
            pnpm --filter "$WEB_PACKAGE" build
          fi

      # ── Assert the API origin actually reached the bundle ──────────────────
      # A VITE_* variable that never arrives does not fail the build — Vite substitutes
      # undefined, the app takes its relative-path fallback, and Cloudflare Pages serves
      # index.html for every API call. The result is a deployed site that looks healthy
      # and cannot log in. Only checked when the variable is set AND absolute: a product
      # that builds with it empty on purpose (same-origin) is skipped, not failed.
      - name: Verify the API origin is baked into the bundle
        working-directory: ${{ inputs.working_directory }}
        env:
          VITE_API_URL:      ${{ vars.VITE_API_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          DIST: ${{ inputs.web_dist_path }}
        run: |
          set -euo pipefail
          for name in VITE_API_URL VITE_API_BASE_URL; do
            value="${!name:-}"
            case "$value" in
              https://*) ;;
              *) continue ;;   # unset, or deliberately relative — nothing to assert
            esac
            if grep -rqF "$value" "$DIST"; then
              echo "✓ $name ($value) is present in $DIST"
            else
              echo "::error::$name is set to '$value' but does not appear anywhere in $DIST."
              echo "::error::The build did not pick it up — the app will fall back to a relative path and every API call will return index.html."
              echo "::error::Check that the SPA reads import.meta.env.$name and that the variable is scoped to this deploy environment."
              exit 1
            fi
          done

      # ── Publish to Cloudflare Pages ────────────────────────────────────────
      # wrangler-action auto-detects the package manager by looking for a
      # lockfile INSIDE workingDirectory. Monorepo callers set working_directory
      # to the web package's own subdir, which has no lockfile of its own — the
      # pnpm lockfile lives at the repo root. Detection then falls through to
      # npm, whose bootstrap walks a pnpm-managed node_modules tree and fails.
      # packageManager is only read for THIS install-wrangler bootstrap, not the
      # app's own build above, and inputs.package_manager is always exactly
      # "pnpm" or "npm".
      # Accepted risk (Low confidence): setup-node's `cache: npm` upstream, then this
      # deploy step, is zizmor's generic "cache-poisoning" shape — a poisoned npm cache
      # entry could theoretically ride through to what gets published. Mitigated by this
      # workflow only ever running on push to main (every caller), never on an untrusted
      # PR, so there is no attacker-controlled run in a position to poison the cache.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3  # zizmor: ignore[cache-poisoning]
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working_directory }}
          packageManager: ${{ inputs.package_manager }}
          wranglerVersion: ${{ inputs.wrangler_version }}
          command: >-
            pages deploy ${{ inputs.web_dist_path }}
            --project-name=${{ vars.PAGES_PROJECT }}
            --branch=main

      - name: Post-deploy health check
        if: vars.APP_URL != ''
        uses: quynhonsemiconductor/ci/actions/post-deploy-health-check@208f7081f59fdbe5a454d7e836d1b04ac4b04d97 # v1.24.1
        with:
          url: ${{ vars.APP_URL }}
          expected-status: '200'
          timeout-seconds: '60'

      - name: Deployment summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          {
            echo "### Deploy $STATUS — $ENVIRONMENT"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Asset tag** | \`$ASSET_TAG\` |"
            echo "| **Pages project** | \`$PAGES_PROJECT\` |"
            echo "| **Actor** | $ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

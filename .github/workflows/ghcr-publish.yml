# =============================================================================
# Reusable · GHCR publish — build once per merge to main, scan BEFORE push,
# push to GHCR.
#
# The on-prem delivery path (ONPREM-PLAN §11.1, "Build" row): every product
# image is published to ghcr.io/quynhonsemiconductor/<product>-<service> with
# the immutable identity tag sha-<commit>, which the gitops manifests pin. This
# is the only image build since the AWS exit (2026-11-02); the old ECR deploy
# pipelines are gone.
#
# Choices, and why:
#   - linux/amd64 only. The k3s host is amd64. The GHA cache scope is suffixed
#     -amd64 so another platform's build cannot fight this workflow for one scope.
#   - Scan BEFORE push, and the scan covers vulns AND secrets: the packages
#     are PUBLIC, so a failed scan must leave nothing in the registry. The
#     composite's pre-push scan (`scan: true`) builds once, scans the local image
#     and pushes THAT image (`docker push`, no rebuild), then checks the
#     registry's manifest carries the scanned layers. Gate policy: CRITICAL
#     fixable vulns block, HIGH vulns are reported only, and ANY secret blocks.
#   - `ignore-unfixed: true` means only vulnerabilities WITH an available fix
#     gate the push — unfixed ones are reported, not fatal; the secret scan has
#     no such concept and always gates.
#   - GITHUB_TOKEN with packages: write. No AWS OIDC, no IAM role — GHCR auth
#     comes from the calling repo's token, so the caller must grant
#     `packages: write` (a job-level grant: workflow-level permissions REPLACE
#     the inherited set, they do not add to it — see k8s-deploy.yml).
#   - org.opencontainers.image.source labels the image with the CALLING repo, so
#     GHCR links each package to that repo's page.
#   - Provenance + SBOM are GitHub attestations on the PUSHED DIGEST (the scan
#     path's composite attests it), which is why this workflow, and every caller,
#     grants `id-token: write` and `attestations: write`. No Cosign/Sigstore yet
#     (§11.1 defers it); verify with `gh attestation verify`.
#
# Concurrency: one run per product at a time, no cancellation. A run started by
# push A that is still building when push B arrives finishes and pushes
# sha-A<12>; B then pushes sha-B<12> — an intermediate sha- tag can be skipped
# only by a FAILED run, never overwritten by a later one (tags are unique per
# commit and GHCR accepts re-push, but nothing here re-pushes a tag).
#
# Digests: a matrix leg cannot publish a job output (the legs share one output
# namespace — see backend-deploy.yml), so each leg uploads an artifact and the
# `digests` job reduces them to ONE `digests` output, a JSON object mapping
# service → sha256 digest. That output is what a later `k8s-deploy` change
# writes into gitops' tags.dev.yaml.
#
# Consuming repos call this thin (SHA-pinned — ci's v1 tag moves on every merge):
#
#   jobs:
#     publish:
#       permissions: { contents: read, packages: write }
#       uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@<full-sha>
#       with:
#         product: rova
#         services-json: '["api","worker","migrator"]'
# =============================================================================
name: Reusable · GHCR Publish

on:
  workflow_call:
    inputs:
      product:
        description: 'Short slug — the GHCR image namespace is <product>-<service>.'
        type: string
        required: true
      services-json:
        description: 'The services to build, as JSON: ["api","worker","migrator"].'
        type: string
        required: true
      platforms:
        description: 'The k3s host is amd64; keep the default unless the host changes.'
        type: string
        default: linux/amd64
      build_runner:
        description: >
          BUILD ON THE TARGET ARCHITECTURE. The default pairs with `platforms`
          (amd64 on ubuntu-24.04); setting one without the other yields either a
          QEMU-emulated build that times out on a pnpm + Nest compile or an image
          that cannot start on the host. See k8s-deploy.yml for the full lesson.
        type: string
        default: ubuntu-24.04
      dockerfile:
        type: string
        default: Dockerfile
      bump-dev:
        description: >
          'true' opens (or refreshes) the gitops dev PR for this build, so the product
          caller needs no copied bump job. Dev only: the action refuses prod, and
          auto-merge is passed only for dev. Needs the QNSC_AUTOMATION_PRIVATE_KEY
          secret (pass `secrets: inherit`). One caller per product owns the bump when a
          product makes several publish calls (the second would re-bump the same file).
        type: string
        default: 'false'
      gitops-product:
        description: >
          The gitops values key (rova, opshub, kb). Defaults to `product`; set it when
          the GHCR slug and the gitops directory differ (kb vs qnsc-kb).
        type: string
        default: ''
      gitops-services:
        description: 'Services to write in the tags file. Defaults to every service published by this call.'
        type: string
        default: ''
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY:
        description: 'GitHub App key for the gitops dev PR. Required when bump-dev is true.'
        required: false
    outputs:
      tag:
        description: 'The identity tag pushed to every image (sha-<commit>).'
        value: ${{ jobs.build.outputs.tag }}
      digests:
        description: 'JSON object mapping service → image digest (sha256:...).'
        value: ${{ jobs.digests.outputs.digests }}

permissions:
  contents: read
  packages: write
  # The scan path attests the pushed digest (actions/attest-build-provenance + attest-sbom): both need an OIDC token and
  # permission to write to the repo's attestation store. A CALLER MUST GRANT THESE TOO — a reusable workflow's job
  # permissions are capped by its caller's.
  id-token: write
  attestations: write

concurrency:
  # ONE group per product PER COMMIT. A product-wide group would let a newer
  # main push REPLACE the queued run for the previous commit: GitHub keeps only
  # one pending run per group even with cancel-in-progress false, so that commit
  # would never be published. A tag or dispatch for the same sha still serialises
  # with the main push (same group).
  group: ghcr-publish-${{ inputs.product }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: ghcr.io/quynhonsemiconductor

jobs:
  build:
    name: Build ${{ matrix.service }}
    # Builds happen ONLY for a merge to main (or a dispatch against it). The
    # first step below would otherwise publish whatever ref triggered the call.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.build_runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      # The Dockerfile's `pnpm install` pulls private @quynhonsemiconductor/*
      # from GitHub Packages with this same token, and the push below needs
      # packages: write — one grant covers both.
      packages: write
      # Attesting the pushed digest (see the `scan` input of build-push-image).
      id-token: write
      attestations: write
    strategy:
      # One image per service: <product>-<service>, one Dockerfile stage per
      # service, `build-target: <service>` (k8s-deploy.yml records the
      # byte-identical-images incident this convention prevents).
      matrix:
        service: ${{ fromJSON(inputs.services-json) }}
      fail-fast: false
    outputs:
      # Shared across the matrix; it is the same commit for every leg, so any
      # leg's value is the right one.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Builds and pushes an image; never pushes a git ref.
        with: { persist-credentials: false }

      - name: Compute the tag
        id: tag
        run: |
          # Same convention as k8s-deploy.yml: sha-<commit> is the IDENTITY tag,
          # immutable by construction. Promotion to prod later adds a v tag to
          # the SAME digest; nothing is rebuilt.
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # FULL SHA of the released composite this workflow needs. A same-repo SHA
      # cannot name a composite edited in the same PR — hence the split; @v1/@main
      # move on every merge and would not do (zizmor, unpinned-uses).
      #
      # v1.31.1 renamed build-push-ecr to build-push-image and made the scan path
      # attest the pushed digest; those attestations are what release-retag checks
      # before it tags a release. The old alias would still run the old code.
      - name: Build, scan (pre-push), push ${{ matrix.service }}
        id: build
        uses: quynhonsemiconductor/ci/actions/build-push-image@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
        with:
          registry: ${{ env.GHCR_NAMESPACE }}
          image-name: ${{ inputs.product }}-${{ matrix.service }}
          image-tag: ${{ steps.tag.outputs.tag }}
          build-target: ${{ matrix.service }}
          dockerfile: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          # PRE-PUSH scan: nothing reaches the (public) package unless the scan
          # passed; the composite pushes the image it scanned. Two gates:
          #   vulns   — CRITICAL only, ignore-unfixed (HIGH is reported, not
          #             gating: unfixable-upstream findings must not block)
          #   secrets — ANY finding blocks (the composite's separate no-filter
          #             secret pass; a leaked credential in a public package is
          #             a disclosure the moment the push lands)
          scan: 'true'
          scan-scanners: vuln,secret
          scan-severity: 'CRITICAL'
          cache-backend: gha
          # -amd64 SUFFIX: k8s-deploy.yml builds the same product-service for
          # arm64 under the plain scope; sharing one scope across platforms
          # would have the two pipelines evict each other's entries.
          cache-scope: ${{ inputs.product }}-${{ matrix.service }}-amd64
          # Links the GHCR package to the CALLING repo's page (github.repository
          # is the caller: reusable workflows run in the caller's context).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # A matrix leg cannot set a workflow output (the legs share one output
      # namespace), so each leg uploads its digest and `digests` reduces them.
      - name: Record this leg's digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.image-digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest from the $SERVICE build"; exit 1; }
          mkdir -p digests && echo "$IMAGE_DIGEST" > "digests/$SERVICE.txt"

      # upload-artifact and download-artifact MUST STAY ON THE SAME MAJOR (see
      # backend-deploy.yml — a v4 upload cannot be read by a v3 download).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ghcr-digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.txt
          retention-days: 1

  digests:
    name: Reduce digests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.reduce.outputs.digests }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ghcr-digest-*
          path: digests
          merge-multiple: true

      - name: Reduce to one JSON output
        id: reduce
        env:
          PRODUCT: ${{ inputs.product }}
          NAMESPACE: ${{ env.GHCR_NAMESPACE }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### GHCR images ($NAMESPACE/$PRODUCT)"
            echo "tag: \`$TAG\`"
            echo "| service | image ref |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          json='{}'
          for f in digests/*.txt; do
            svc=$(basename "$f" .txt)
            d=$(cat "$f")
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest for $svc: $d"; exit 1; }
            json=$(jq -c --arg s "$svc" --arg d "$d" '. + {($s): $d}' <<< "$json")
            echo "| $svc | \`$NAMESPACE/$PRODUCT-$svc@$d\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "digests=$json" >> "$GITHUB_OUTPUT"

  # The dev deploy, shared instead of copied per product (DELIVERY-DESIGN §2/§3):
  # after a successful build+scan, the bot opens a PR that sets tag + digest in
  # values/<gitops-product>/tags.dev.yaml and enables auto-merge. gitops's
  # bot-scope allows that auto-merge only when the PR touches nothing but
  # values/*/tags.dev.yaml. Prod never goes through here — release-promote.yml
  # opens a reviewed PR and the owner's merge is the gate.
  bump-dev:
    name: Bump dev (gitops PR)
    needs: [build, digests]
    if: ${{ inputs.bump-dev == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      # One bump per product/env: two publish calls touching the same tags file
      # serialise instead of racing (the action rebases on push).
      group: gitops-bump-${{ inputs.gitops-product || inputs.product }}-dev
      cancel-in-progress: false
    steps:
      # App token scoped to gitops only: branch push, PR open, auto-merge enable.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
          owner: quynhonsemiconductor
          repositories: gitops
          permission-contents: write
          permission-pull-requests: write

      # v1.32.0 is the first release whose bump-gitops-tag keeps no credentials
      # at rest and stages exactly the tags file + render. A job cannot pin a SHA
      # that does not exist, so this arrives only after that release.
      - uses: quynhonsemiconductor/ci/actions/bump-gitops-tag@956804ad4aa2dcf930909553d306d72b3708fd5d  # v1.34.1+ci#308
        with:
          product: ${{ inputs.gitops-product || inputs.product }}
          env: dev
          services: ${{ inputs.gitops-services || join(fromJSON(inputs.services-json), ' ') }}
          tag: ${{ needs.build.outputs.tag }}
          digests: ${{ needs.digests.outputs.digests }}
          mode: pull-request
          auto-merge: 'true'
          gitops-token: ${{ steps.app.outputs.token }}

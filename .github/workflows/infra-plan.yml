# =============================================================================
# Reusable: Infrastructure plan for changed workspaces, posted back to the PR.
# (OpenTofu under the hood — named by capability, not tool.)
#
# Read-only (assumes <product>-github-infra-plan). Detects which infra/live/*
# dirs the PR changes the plan for — the ones with edited files, or ALL of them
# when a local path module under infra/modules/ changed — and plans each in a
# matrix, commenting the diff. A
# `tofu fmt` check gates the PR so formatting drift is caught here. Mirrors the
# apply TF_VARs so plan ≈ apply (avoids the "plan passed fewer vars" drift).
# =============================================================================
name: Reusable · Infrastructure Plan

on:
  workflow_call:
    inputs:
      product:      { required: true, type: string }
      live_prefix:  { type: string, default: "infra/live/" }
      # Path prefix of LOCAL path modules the live workspaces call. A change under it
      # plans every workspace, because a local module has no version pin to isolate
      # environments from each other. Set to "" to opt out.
      module_prefix: { type: string, default: "infra/modules/" }
      aws_region:   { type: string, default: "ap-southeast-1" }
      tofu_version: { type: string, default: "1.9.1" }
      tf_vars_json: { type: string, default: "{}" }
    secrets:
      AWS_ACCOUNT_ID:      { required: true }
      tf_secret_vars_json: { required: false }

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.set.outputs.workspaces }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # Which live workspaces does this PR change the plan for?
      #
      # Not just the ones with edited files. Both products now compose their
      # environments from a LOCAL path module (`module "stack"`, source
      # ../../modules/stack), so editing that module changes the plan for EVERY
      # environment while touching nothing under infra/live/.
      #
      # Matching only the live prefix made those PRs the dangerous kind of green: the
      # callers added `infra/modules/**` to their `paths:` filter, so this workflow
      # STARTED, `detect-changes` produced `[]`, the plan job skipped, and the PR
      # showed a passing "Infrastructure · Plan" with no plan in it. Meanwhile
      # infra-apply on main applies every environment unconditionally — so the first
      # time anyone saw the diff was after it had been applied.
      #
      # So: a change under `module_prefix` plans all of them.
      - id: set
        env:
          PREFIX: ${{ inputs.live_prefix }}
          MODULE_PREFIX: ${{ inputs.module_prefix }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")

          if [ -n "$MODULE_PREFIX" ] && echo "$FILES" | grep -q "^${MODULE_PREFIX}"; then
            echo "Shared module changed under ${MODULE_PREFIX} — planning every live workspace."
            # Enumerate from the CHECKOUT, not from the diff: the point is to plan
            # workspaces this PR did not touch. `-maxdepth 2` matches the `cut -d/ -f1-3`
            # depth below, so both branches yield the same shape of path.
            DIRS=$(find "${PREFIX%/}" -mindepth 1 -maxdepth 1 -type d | sort)
          else
            DIRS=$(echo "$FILES" | grep "^${PREFIX}" | cut -d/ -f1-3 | sort -u || true)
          fi

          CHANGED=$(printf '%s\n' "$DIRS" | jq -Rc 'select(length>0)' | jq -sc '.')
          echo "Planning: $CHANGED"
          echo "workspaces=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"

  fmt:
    name: tofu fmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          # fmt needs no cloud access; assume the read-only plan role for parity.
          role-arn:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.product }}-github-infra-plan
          aws-region:   ${{ inputs.aws_region }}
          tofu-version: ${{ inputs.tofu_version }}

      - name: tofu fmt -check
        run: tofu fmt -check -recursive -diff

  plan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.workspaces != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.detect-changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.product }}-github-infra-plan
          aws-region:   ${{ inputs.aws_region }}
          tofu-version: ${{ inputs.tofu_version }}

      - name: Export non-secret TF_VARs
        env:
          VARS_JSON: ${{ inputs.tf_vars_json }}
        run: echo "$VARS_JSON" | jq -r 'to_entries[] | "TF_VAR_\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Export secret TF_VARs (masked)
        env:
          SECRETS_JSON: ${{ secrets.tf_secret_vars_json }}
        run: |
          # NOTE: the `secrets` context is NOT permitted in a step `if:`
          # (see the Actions context-availability table). Referencing it there
          # is an invalid-context compile error that rejects the ENTIRE reusable
          # as a 0-job "startup_failure" for every caller. Gate on the mapped
          # env var inside the script instead.
          if [ -z "${SECRETS_JSON}" ]; then
            echo "No secret TF_VARs to export."
            exit 0
          fi
          echo "$SECRETS_JSON" | jq -r '.[]' | while IFS= read -r v; do echo "::add-mask::$v"; done
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | "TF_VAR_\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: tofu init
        working-directory: ${{ matrix.workspace }}
        run: tofu init -input=false

      - name: tofu validate
        working-directory: ${{ matrix.workspace }}
        run: tofu validate

      - name: tofu plan
        id: plan
        working-directory: ${{ matrix.workspace }}
        run: |
          # The infra-plan OIDC role is read-only and has no DynamoDB write
          # permission, so it cannot acquire the state lock. Plan never mutates
          # state, so run lock-free (apply still locks via the admin apply role).
          #
          # -refresh=false because that role carries AWS ReadOnlyAccess, which
          # deliberately EXCLUDES secretsmanager:GetSecretValue — and refreshing an
          # aws_secretsmanager_secret_version needs exactly that. Without this the plan
          # died on the qnsc-kb tunnel token:
          #
          #   Error: reading Secrets Manager Secret Version ... AccessDeniedException:
          #   not authorized to perform: secretsmanager:GetSecretValue
          #
          # so infra PRs got no plan review at all, which is worse than planning against
          # state.
          #
          # Granting the permission instead was the obvious move and is the wrong one: a
          # pull request can edit the Terraform that this role then runs, so read access
          # to secret VALUES from a PR-triggered role is an exfiltration path — `sensitive`
          # marking is not a boundary, `nonsensitive()` unwraps it. iam-oidc withholds
          # GetSecretValue from CI roles on purpose; this keeps that intact.
          #
          # What it costs: the plan is computed against recorded state, so drift made
          # outside Terraform is not shown. Apply still refreshes, with the apply role, so
          # drift is caught there rather than never.
          set +e
          tofu plan -input=false -lock=false -refresh=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: always()
        env:
          WORKSPACE: ${{ matrix.workspace }}
        with:
          script: |
            const fs = require('fs');
            const ws = process.env.WORKSPACE;
            const plan = fs.readFileSync(`${ws}/plan.txt`, 'utf8');
            const MAX = 65000;
            const body = `### Infrastructure Plan — \`${ws}\`\n\`\`\`hcl\n${plan.length > MAX ? plan.slice(0, MAX) + '\n... (truncated)' : plan}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: exit 1

name: k8s-deploy

# The delivery path for a product on Kubernetes (§11).
#
#   PR              tests · build · push to ECR with an IMMUTABLE tag
#   merge to main   CI bumps the dev tag in `gitops` → ArgoCD syncs dev
#   promote         PR in `gitops` changing the prod tag → approval → ArgoCD syncs prod
#   rollback        revert that commit
#
# A product repository NEVER touches a cluster. It builds an image and edits one
# line in another repository; ArgoCD reconciles from there. That is the whole
# mechanism, and it is why branch protection on `gitops` is a production access
# control rather than a code-quality convention (§10b).
#
# ── WHAT THIS REPLACES, AND WHAT IT MUST NOT LOSE ──────────────────────────────
# §11 names three properties of the current ECS pipeline and says losing any of
# them is a silent regression. All three are preserved by REUSING the existing
# composite actions rather than writing new ones:
#
#   multi-arch    arm64 for rova and opshub. qnsc-kb stays amd64 until §4c splits
#                 clamav out — `clamav/clamav` publishes no arm64 tag
#   build cache   GitHub Actions cache. Moved off the ECR `registry` backend on
#                 2026-09-13 after August's ECR bill was ~94% data transfer
#   attestation   rova's deploy verifies image attestation before rolling. Kept —
#                 and Kubernetes makes it STRONGER: Sigstore policy-controller
#                 rejects an unsigned image cluster-wide, so a bypassed pipeline
#                 cannot deploy one (§10)

on:
  workflow_call:
    inputs:
      product:
        description: 'Short slug — rova · opshub · kb. NOT qnsc-kb (§7c).'
        type: string
        required: true
      services:
        description: 'Space-separated, for the gitops bump: "api worker migrator".'
        type: string
        required: true
      services-json:
        description: 'The same list as JSON, for the build matrix: ["api","worker","migrator"].'
        type: string
        required: true
      platforms:
        description: >
          linux/arm64 by default. qnsc-kb passes linux/amd64 until the clamav
          split lands (§4c) — that one line is worth ~$35/month.
        type: string
        default: linux/arm64
      build_runner:
        description: >
          BUILD ON THE TARGET ARCHITECTURE, NOT UNDER EMULATION.

          `platforms` defaults to linux/arm64 while this workflow hardcoded
          `runs-on: ubuntu-latest` (amd64), so every build cross-compiled under QEMU —
          and for a pnpm + Nest compile that does not merely get slow, it FAILS:
          `process "/dev/.buildkit_qemu_emulator /bin/sh -c ... pnpm install" did not
          complete successfully`. Consistently rather than flakily: three retries,
          three failures, for api, worker and migrator alike. The error names buildkit
          and the emulator, so it reads like a Dockerfile fault rather than a runner
          mismatch.

          `backend-deploy.yml` already learnt this and says so in its own inputs:
          "Build on a runner of the same architecture rather than cross-building… QEMU
          emulation also works but multiplies build minutes on a pnpm + Nest compile by
          enough to outweigh the Fargate saving." It passes
          `build_runner: ubuntu-24.04-arm` and succeeds; this workflow was written
          later and did not carry the lesson across.

          THE DEFAULT PAIRS WITH `platforms`: both arm64, because setting one without
          the other yields either an emulated build or an image that cannot start
          ("Manifest does not contain descriptor matching platform"). Targeting amd64
          means setting both.
        type: string
        default: ubuntu-24.04-arm
      dockerfile:
        type: string
        default: Dockerfile
      aws-region:
        type: string
        default: ap-southeast-1
    secrets:
      aws-role-arn:
        required: true
      gitops-token:
        description: >
          §10b — scope this to the DEV path only. A token that can write prod.yaml
          makes the promotion review decorative, and the CI identity has no reason
          to hold one.
        required: true

permissions:
  contents: read
  id-token: write        # OIDC to AWS — no long-lived access keys
  attestations: write    # build provenance

concurrency:
  # One deploy per product at a time. Two concurrent bumps race on the same file
  # in `gitops`, and the loser silently reverts the winner.
  group: k8s-deploy-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.build_runner }}
    # ── `packages: read` IS NOT OPTIONAL, AND NOT INHERITED ────────────────────
    #
    # The Dockerfile's `pnpm install` pulls private @quynhonsemiconductor/* packages
    # from GitHub Packages with the job's GITHUB_TOKEN. Without this the build died at
    #
    #     ERR_PNPM_FETCH_403  GET https://npm.pkg.github.com/download/
    #                              @quynhonsemiconductor/identity/7.1.0
    #
    # WHY THE CALLER'S GRANT DID NOT REACH HERE, which is the part worth recording:
    # rova's calling job DOES grant `packages: read`. But this workflow declares
    # WORKFLOW-LEVEL permissions, and those replace the inherited set rather than
    # adding to it — so the token arrived with Contents, Metadata and Attestations
    # only. The caller's grant is a ceiling, not a floor.
    #
    # A job-level block replaces the workflow-level one outright, so all four are
    # restated here. `backend-deploy.yml` does exactly this on its build job, with the
    # same one-line reason; this workflow was written later and did not carry it over.
    permissions:
      contents: read
      id-token: write      # OIDC to AWS — no long-lived access keys
      attestations: write  # build provenance
      packages: read       # private @quynhonsemiconductor/* from GitHub Packages
    strategy:
      # One image per service. A product is N services sharing a repository, and
      # each gets its own ECR repository named <product>-<service> (§7c).
      matrix:
        service: ${{ fromJSON(inputs.services-json) }}
      fail-fast: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        # This job builds an image; it never pushes a git ref. The tag bump
        # happens in bump-gitops-tag, against a DIFFERENT repository with its
        # own token, so there is nothing here for a persisted credential to do.
        with: { persist-credentials: false }

      - name: Compute the tag
        id: tag
        run: |
          # §11 — `sha-<commit>` is the IDENTITY tag. Every build gets one, it is
          # immutable by construction (a commit hash cannot mean two things), and
          # it is what DEV deploys. Production gets a second `v<version>` tag on
          # the same image at promotion; nothing is rebuilt.
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: quynhonsemiconductor/ci/actions/setup-aws-oidc@main
        id: aws
        with:
          role-arn: ${{ secrets.aws-role-arn }}
          region: ${{ inputs.aws-region }}
          ecr-login: true

      - name: Build and push
        id: build
        uses: quynhonsemiconductor/ci/actions/build-push-ecr@main
        with:
          ecr-registry: ${{ steps.aws.outputs.ecr-registry }}
          # §7c — the ECR repository carries NO environment. Promotion is "the
          # same image gets a second tag", so a per-environment repository would
          # mean copying bytes between them and the attestation below would stop
          # covering what runs in production.
          image-name: ${{ inputs.product }}-${{ matrix.service }}
          image-tag: ${{ steps.tag.outputs.tag }}
          platforms: ${{ inputs.platforms }}
          dockerfile: ${{ inputs.dockerfile }}
          # ── WITHOUT THIS, ALL THREE IMAGES ARE THE SAME IMAGE ────────────────
          # rova's Dockerfile has one stage per service — `api`, `worker`, `migrator` —
          # and with no target Docker builds the LAST one. So `rova-api` and
          # `rova-worker` were byte-identical copies of the MIGRATOR, and every api pod
          # ran `node dist/db/migrate.js`:
          #
          #     Running migrations...
          #     ❌ Migration failed: permission denied for database rova
          #
          # which reads as a database permission problem, and the permission is
          # correct — the app role must not create schemas. Nothing pointed at the
          # image being the wrong one. The migrator Job worked throughout, because the
          # migrator image is what every repository actually held.
          #
          # `backend-deploy.yml` passes this and always has. Fourth thing this workflow
          # was missing that its ECS predecessor had, after the native arm64 runner,
          # `packages: read` and digest-based attestation.
          build-target: ${{ matrix.service }}
          # NOT the `registry` backend. August's ECR bill was ~94% data transfer.
          cache-backend: gha
          cache-scope: ${{ inputs.product }}-${{ matrix.service }}

      - name: Attest
        uses: quynhonsemiconductor/ci/actions/attest-image@main
        with:
          # ── A DIGEST REFERENCE, NOT A TAG ────────────────────────────────────
          # This passed `image-uri`, which is `<registry>/<name>:<tag>`, and the
          # attestation refused it:
          #
          #   Error: subject-digest has unsupported algorithm
          #          "<registry>/rova-migrator"
          #
          # — it splits on `:` expecting `sha256:<hex>` and found a registry host.
          # The image had already BUILT AND PUSHED; only the attestation failed, so
          # every image existed while the job went red and `deploy-dev` was skipped.
          #
          # An attestation must also bind to a digest rather than a tag on principle:
          # a tag can be moved (not here — ECR is immutable — but the guarantee should
          # not depend on that), while a digest names exactly the bytes that were
          # built.
          #
          # `backend-deploy.yml` has always done it this way. That is the THIRD thing
          # this newer workflow was missing that its ECS predecessor already had, after
          # the native arm64 runner and `packages: read`.
          image-ref: ${{ steps.aws.outputs.ecr-registry }}/${{ inputs.product }}-${{ matrix.service }}@${{ steps.build.outputs.image-digest }}


  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The only thing that "deploys". No kubectl, no cluster credentials, no
      # access to the cluster at all — this edits one line in another repository.
      - uses: quynhonsemiconductor/ci/actions/bump-gitops-tag@main
        with:
          product: ${{ inputs.product }}
          env: dev
          services: ${{ inputs.services }}
          tag: ${{ needs.build.outputs.tag }}
          mode: commit
          gitops-token: ${{ secrets.gitops-token }}

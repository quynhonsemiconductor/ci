# =============================================================================
# Static validation — this repo IS the org's CI/CD supply chain: every
# composite action here is consumed by rova, opshub, and every future
# product. A YAML mistake or bad shell in a `run:` block would silently break
# CI/deploys everywhere on the next version bump, with no other gate to catch
# it before a consumer's pipeline fails. actionlint checks workflow/action
# YAML shape (bad `uses:`, undefined inputs/outputs, wrong expression syntax)
# and shells out to shellcheck for embedded `run:` scripts.
#
# actionlint runs through actions-security.yml, which this workflow calls
# below — NOT as a local job here. It used to be one, using an unpinned
# third-party action that its own TODO flagged as against org convention.
# The reusable workflow now carries it with a checksum-pinned binary, and
# that reusable is also what CONSUMERS get: this repo linted its own
# workflows for a long time while shipping consumers nothing.
#
# SEQUENCING, because getting this wrong blocks the repo: the ruleset
# required `actionlint (workflows + actions)` — the job removed here. A
# required check that never reports does not fail, it blocks every merge
# forever (see README). So the ruleset was repointed to
# `actions-security / Workflow lint (actionlint)` FIRST, while both were
# still reporting green, and only then was the job deleted.
# =============================================================================
name: Lint · Actions

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
concurrency:
  group: lint-actions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Replaces Code Scanning Default Setup's `Analyze (actions)` as the required
  # gate on this repo's own ruleset — that managed check doesn't reliably
  # report on bot-authored PRs (Dependabot/Renovate), leaving the required
  # check stuck "Expected" forever. Self-referenced by local path since this
  # IS the repo the reusable workflow lives in.
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/actions-security.yml
    with:
      # The low-confidence backlog (env-var indirection across every run: block
      # in this repo's workflows/actions) is fully cleared — zero findings at
      # any severity/confidence as of the fix that added this comment. Gate on
      # everything now; the two remaining zizmor: ignore[] suppressions
      # (release.yml's tag-push checkout, web-deploy.yml's cache-poisoning) are
      # deliberate, documented, accepted risk, not backlog.
      blocking: true
      combine: true # actionlint + zizmor as ONE job; the required check is `actions-security / Workflow security (actionlint, zizmor)`

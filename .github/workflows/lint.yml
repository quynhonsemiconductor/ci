# =============================================================================
# Static validation — this repo IS the org's CI/CD supply chain: every
# composite action here is consumed by rally, opshub, and every future
# product. A YAML mistake or bad shell in a `run:` block would silently break
# CI/deploys everywhere on the next version bump, with no other gate to catch
# it before a consumer's pipeline fails. actionlint checks workflow/action
# YAML shape (bad `uses:`, undefined inputs/outputs, wrong expression syntax)
# and shells out to shellcheck for embedded `run:` scripts.
# =============================================================================
name: Lint · Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-actions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Replaces Code Scanning Default Setup's `Analyze (actions)` as the required
  # gate on this repo's own ruleset — that managed check doesn't reliably
  # report on bot-authored PRs (Dependabot/Renovate), leaving the required
  # check stuck "Expected" forever. Self-referenced by local path since this
  # IS the repo the reusable workflow lives in.
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/actions-security.yml
    with:
      # This repo's ~100 low-CONFIDENCE findings are `inputs.*`/`vars.*`/
      # `steps.*.outputs.*` interpolated into `run:` blocks — values set by
      # trusted caller repos, not directly attacker-reachable. Severity and
      # confidence are independent: template-injection is high-SEVERITY by
      # rule definition regardless of confidence, so gating on min_severity
      # alone still catches all the unfixed low-confidence ones too. Gate on
      # min_confidence instead — that isolates the findings actually
      # assessed as real and fixed here. The low-confidence hygiene sweep is
      # a separate, reviewable follow-up.
      min_confidence: high
      blocking: true

  actionlint:
    name: actionlint (workflows + actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # TODO: pin to a full commit SHA (org convention) once this has run once
      # and the resolved SHA is visible in the Actions log — not verified here.
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
          shellcheck: true

# =============================================================================
# Stack conformance — weekly report on divergence between the product stack modules.
#
# The reasoning, and the three measured divergences that prompted it (a $15/mo ElastiCache
# node, a guard that exited 0 on violation, and a registry that existed in three states),
# live in scripts/stack_conformance.py. This file only schedules it.
#
# COMPLEMENTS pin_drift.py rather than duplicating it. pin_drift asks "do the repos agree on
# a VERSION of a shared module?"; this asks "do the repos agree on the STRUCTURE of the
# composition they each copied?" A repo can be perfectly pinned and still be missing a
# capability its peers have — which is exactly what happened with cache.shared.
#
# WEEKLY, like pin-drift, because the unit of loss is a divergence that persists rather than
# dollars per day. Contrast unmanaged-resources.yml in qnsc-infra, which is daily.
# =============================================================================
name: Stack conformance

on:
  schedule:
    # Monday 08:30 Asia/Ho_Chi_Minh. Cron is UTC-only, hence 01:30. Half an hour after
    # pin-drift so the two reports land together without competing for runners.
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Compare product stack modules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every product repo read here is public, so this needs no App token and no write
      # scope — the same reasoning as pin-drift.yml. If a product is ever made private this
      # job starts failing on the clone, which is the right moment to notice rather than a
      # silently short report.
      #
      # Exits non-zero when an undecided divergence exists, which turns the scheduled run
      # red and makes GitHub notify. Record deliberate differences in ACCEPTED in the script
      # rather than leaving the report red.
      - name: Compare stack modules
        run: python3 scripts/stack_conformance.py

  # A red scheduled run only emails whoever last touched the cron line, and this report was red on both of its runs
  # (2026-10-05, 2026-10-12) without anyone acting. The failure is the signal, so it must reach a person: one open issue,
  # updated on every red run and closed by the next green one (the pattern of infra's drift-detection.yml). A Teams card is
  # added when the repository has TEAMS_ALERTS_WEBHOOK_URL (it does not today; the issue is the durable alert).
  alert:
    name: Alert on stack-conformance failure
    needs: report
    if: ${{ always() && github.event_name == 'schedule' && needs.report.result != 'success' && needs.report.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the stack-conformance issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create stack-conformance -R "$REPO" --color D93F0B --description "Weekly stack conformance report did not pass" 2>/dev/null || true
          body="The product stack modules diverge, or the report could not run. The divergences are in the run summary: ${RUN_URL}. For each: port the capability to the products missing it, or record it in ACCEPTED in scripts/stack_conformance.py with a reason. This issue closes itself on the next green scheduled run."
          n="$(gh issue list -R "$REPO" --label stack-conformance --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "Stack conformance is failing" --label stack-conformance --body "$body"
          fi

      - name: Post to the platform Teams channel
        env:
          WEBHOOK: ${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::notice::TEAMS_ALERTS_WEBHOOK_URL is not set in this repository; only the GitHub issue was raised"; exit 0; fi
          payload="$(python3 - <<'PY'
          import json, os
          card = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                  {"type": "TextBlock", "size": "Medium", "weight": "Bolder", "wrap": True,
                   "text": "Stack conformance failed: product stack modules diverge"},
                  {"type": "TextBlock", "wrap": True, "isSubtle": True,
                   "text": "Port the capability to the products missing it, or record the difference in ACCEPTED with a reason."},
              ],
              "actions": [{"type": "Action.OpenUrl", "title": "Open the run", "url": os.environ["RUN_URL"]}],
          }
          print(json.dumps({"type": "message",
                            "attachments": [{"contentType": "application/vnd.microsoft.card.adaptive",
                                             "contentUrl": None, "content": card}]}))
          PY
          )"
          curl -fsS --max-time 20 -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" >/dev/null \
            || echo "::warning::Teams post failed; see the GitHub issue"

  resolve:
    name: Close the stack-conformance issue
    needs: report
    if: ${{ always() && github.event_name == 'schedule' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close open stack-conformance issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list -R "$REPO" --label stack-conformance --state open --json number --jq '.[].number'); do
            gh issue close "$n" -R "$REPO" --comment "No undecided divergence in ${RUN_URL}. Closing; it reopens as a new issue if one appears."
          done

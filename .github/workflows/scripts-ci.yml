# =============================================================================
# Tests · shipped scripts — unit tests for the Python this repo ships to others.
#
# actionlint and zizmor check the SHAPE of a workflow. Neither can tell whether the Python this repo ships
# to other repos (code_review_gate, plan_guard, pin_drift, the conformance scripts) behaves, so it is
# unit-tested here.
# =============================================================================
name: Scripts · Tests

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Unit tests (shipped scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # The shipped scripts are standard-library only, by design: they run in repositories that cannot
      # assume a dependency tree.
      #
      # `platform_conformance.py` is the exception: it parses Helm values, so it needs pyyaml. Installing it here is deliberate — without it
      # the module-refs tests SKIP rather than fail, and a contract that silently
      # stops running is the failure this whole file exists to prevent.
      - name: Install pytest and pyyaml
        run: pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3

      # Some tests build real git repositories to diff against, so they need an
      # identity. Set here rather than left to the runner: a bare `git commit` with
      # no identity anywhere aborts with "Author identity unknown", which reads as a
      # test failure rather than a missing configuration.
      - name: Give git an identity
        run: |
          git config --global user.email "ci@qnsc.vn"
          git config --global user.name "QNSC CI"

      - name: pytest
        run: python -m pytest tests/ -q

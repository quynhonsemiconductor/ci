# =============================================================================
# Tests · shipped scripts — unit tests for the Python this repo ships to others.
#
# actionlint and zizmor check the SHAPE of a workflow. Neither can tell whether
# `agent_forge_test_guard.py` correctly identifies a deleted assertion, and that
# script is a REQUIRED check on rally's main branch: a bug in it either blocks
# every merge or waves through the weakening it exists to catch.
#
# It arrived here with its tests rather than without them. The alternative was
# moving a security control out of a repository that tested it into one that did
# not, which trades one drift problem for a worse one.
# =============================================================================
name: Scripts · Tests

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Unit tests (shipped scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # The GUARD is standard-library only, by design — it runs in repositories that
      # have never heard of agent-forge and cannot assume a dependency tree, and one
      # of its own tests asserts that by reading its source.
      #
      # `platform_conformance.py` is the exception and always was: it parses Helm
      # values, so it needs pyyaml. Installing it here is deliberate — without it
      # the module-refs tests SKIP rather than fail, and a contract that silently
      # stops running is the failure this whole file exists to prevent.
      - name: Install pytest and pyyaml
        run: pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3

      # The guard builds real git repositories to diff against, so it needs an
      # identity. Set here rather than left to the runner: a bare `git commit` with
      # no identity anywhere aborts with "Author identity unknown", which reads as a
      # test failure rather than a missing configuration.
      - name: Give git an identity
        run: |
          git config --global user.email "ci@qnsc.vn"
          git config --global user.name "QNSC CI"

      - name: pytest
        run: python -m pytest tests/ -q

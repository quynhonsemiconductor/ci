# =============================================================================
# Reusable Security suite — container CVE · SAST · secrets · dependencies
#
# Single source of truth for application security scanning across all QNSC
# products. Consuming repos call this via `workflow_call` and stay thin:
#
#   jobs:
#     security:
#       uses: quynhonsemiconductor/ci/.github/workflows/security.yml@v1
#       with:
#         product: rova
#       secrets: inherit
#
# All gates run on the FREE GitHub plan (no GitHub Advanced Security needed).
# Phased enforcement so the check can be marked required without day-1 debt
# walling off every PR:
#   • Trivy       — container image CVEs; CRITICAL BLOCKS (ships in the artifact)
#   • Gitleaks    — committed-secret scan; BLOCKS
#   • Semgrep     — SAST (replaces CodeQL); REPORT-ONLY (semgrep_blocking=true to enforce)
#   • osv-scanner — dependency CVEs (replaces dependency-review); REPORT-ONLY
#                   (osv_blocking=true to enforce)
# Triage the first-run Semgrep/osv findings, then flip the two blocking inputs.
#
# SARIF uploads to the GitHub Security tab remain `continue-on-error` — they
# are the only GHAS-gated pieces and no-op on the free plan without failing
# the run. They light up automatically after a plan upgrade, no rework.
# =============================================================================
name: Reusable · Security Scan

on:
  workflow_call:
    inputs:
      product:
        description: Product name, used for the scan image tag (e.g. rova, opshub).
        required: true
        type: string
      image_target:
        description: Dockerfile stage to build and scan for CVEs.
        required: false
        default: api
        type: string
      dockerfile_context:
        description: Docker build context path.
        required: false
        default: .
        type: string
      semgrep_config:
        description: >
          Space-separated Semgrep rulesets. Registry packs (p/*) are fetched
          free and require no login/token. Override per product if needed.
        required: false
        default: 'p/default p/typescript p/nodejs p/owasp-top-ten'
        type: string
      semgrep_version:
        description: Semgrep Docker image tag (semgrep/semgrep).
        required: false
        default: '1.97.0'
        type: string
      semgrep_blocking:
        description: >
          Fail the run on Semgrep findings. Phased rollout: start false
          (report-only), flip true after triaging first-run findings.
        required: false
        default: false
        type: boolean
      osv_blocking:
        description: >
          Fail the run on osv-scanner dependency findings. Phased rollout:
          start false (report-only), flip true after triaging.
        required: false
        default: false
        type: boolean
      osv_scanner_version:
        description: osv-scanner CLI version (without the "v" prefix, v1.x CLI).
        required: false
        default: '1.9.2'
        type: string
      node_version:
        description: Node version (only used if a lockfile refresh is needed).
        required: false
        default: '22'
        type: string
      combine:
        description: >
          Run Gitleaks, osv-scanner and Semgrep as STEPS of ONE job ("Security scans") instead of three jobs of their own. Each is still
          run even if an earlier one failed, and each keeps its own blocking input. Three runners become one per push.

          OFF BY DEFAULT because it changes check names. The three jobs ("Secret scan (Gitleaks)", "SAST (Semgrep)", "Dependency CVE
          scan (osv-scanner)") are skipped, and the ONE required check becomes "Security scans (Gitleaks, osv-scanner, Semgrep)". A
          skipped required check counts as PASSING, so adopt this together with the ruleset change, in this order - ADD the new context
          to the ruleset, merge the caller PR, REMOVE the three old contexts. Doing only the caller PR leaves the scans un-required.
        required: false
        default: false
        type: boolean
      scan_container:
        description: >
          Build and Trivy-scan a container image. Set false for Cloudflare-native
          / static apps that have no Dockerfile — Semgrep + Gitleaks + osv-scanner
          still run (they are source-based). Products leave this true.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # 1. Trivy — container image CVE scan. CRITICAL blocks; HIGH is reported.
  #    Builds the image itself. A product whose own CI already builds it should set
  #    `scan_container: false` and run actions/scan-image right after that build instead:
  #    one runner and one image build fewer per push.
  # ───────────────────────────────────────────────────────────────────────
  trivy:
    name: Container CVE scan (Trivy)
    if: ${{ inputs.scan_container }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read # pull private @quynhonsemiconductor/* from GitHub Packages during the image build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.dockerfile_context }}
          target: ${{ inputs.image_target }}
          push: false
          load: true
          tags: ${{ inputs.product }}-${{ inputs.image_target }}:scan
          cache-from: type=gha,scope=${{ inputs.image_target }}
          # Authenticates the Dockerfile's `pnpm install` against GitHub Packages
          # for private @quynhonsemiconductor/* deps. Without this the cold build 401s and the
          # scan only passes on a warm layer cache (non-deterministic gate).
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - uses: quynhonsemiconductor/ci/actions/scan-image@v1
        with:
          image-ref: ${{ inputs.product }}-${{ inputs.image_target }}:scan

  # ───────────────────────────────────────────────────────────────────────
  # 2. Semgrep — SAST (OSS, free). Replaces CodeQL (which needs GHAS).
  #    Report-only by default (semgrep_blocking).
  # ───────────────────────────────────────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    if: ${{ !inputs.combine }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/scan-semgrep@v1
        with:
          config: ${{ inputs.semgrep_config }}
          version: ${{ inputs.semgrep_version }}
          blocking: ${{ inputs.semgrep_blocking }}

  # ───────────────────────────────────────────────────────────────────────
  # 3. Gitleaks — committed-secret scan over full history (shared action).
  # ───────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scan (Gitleaks)
    if: ${{ !inputs.combine }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/scan-secrets@v1
        with:
          fail-on-leak: 'true'

  # ───────────────────────────────────────────────────────────────────────
  # 4. osv-scanner — dependency CVE scan (OSS, free).
  #    Replaces actions/dependency-review-action (needs GHAS on private repos).
  # ───────────────────────────────────────────────────────────────────────
  dependencies:
    name: Dependency CVE scan (osv-scanner)
    if: ${{ !inputs.combine }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/scan-osv@v1
        with:
          version: ${{ inputs.osv_scanner_version }}
          blocking: ${{ inputs.osv_blocking }}

  # ───────────────────────────────────────────────────────────────────────
  # 5. The three source scans above as STEPS of one job (`combine: true`).
  #    `!cancelled()` on every step after the first: one scanner failing must not hide what
  #    the others found. The job fails if ANY of them failed; the report-only ones never do.
  # ───────────────────────────────────────────────────────────────────────
  scans:
    name: Security scans (Gitleaks, osv-scanner, Semgrep)
    if: ${{ inputs.combine }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Gitleaks scans the full history
          persist-credentials: false

      - name: Secret scan (Gitleaks)
        uses: quynhonsemiconductor/ci/actions/scan-secrets@v1
        with:
          fail-on-leak: 'true'

      - name: Dependency CVE scan (osv-scanner)
        if: ${{ !cancelled() }}
        uses: quynhonsemiconductor/ci/actions/scan-osv@v1
        with:
          version: ${{ inputs.osv_scanner_version }}
          blocking: ${{ inputs.osv_blocking }}

      - name: SAST (Semgrep)
        if: ${{ !cancelled() }}
        uses: quynhonsemiconductor/ci/actions/scan-semgrep@v1
        with:
          config: ${{ inputs.semgrep_config }}
          version: ${{ inputs.semgrep_version }}
          blocking: ${{ inputs.semgrep_blocking }}

# =============================================================================
# Reusable PR Labeler — every label the organisation puts on a pull request, in one job:
#
#   area/*   from the caller's changed files and its `.github/labeler.yml`
#   size/*   from the lines of CODE it changes (actions/pr-size: tests, docs, lockfiles and
#            generated files are reported but not counted; advisory, comments above 1,000)
#
# Caller — identical in every repository:
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   jobs:
#     labeler:
#       uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@v1
#       permissions:
#         contents: read
#         pull-requests: write
#
# The label MAP (.github/labeler.yml) stays product-local — it names each repo's own paths. A
# repository without one gets size labels only.
#
# ONE JOB, area first and size second, on purpose. actions/labeler replaces the pull request's whole
# label set (PUT) from a snapshot it takes when it starts, so anything that labels the pull request
# while it runs is undone: as two workflows, opshub#348's size label was added at 12:00:59 and
# removed at 12:01:00. Sequential steps cannot race.
#
# Advisory, so a reusable workflow is the right shape. If size ever becomes a REQUIRED check, it must
# move to a job the caller defines (README: a required check must be a composite action).
# =============================================================================
name: Reusable · PR Labeler

on:
  workflow_call:
    inputs:
      configuration_path:
        description: Path to the area-label map in the caller repo. Optional — without it, no area labels.
        required: false
        default: .github/labeler.yml
        type: string
      sync_labels:
        description: Remove area labels no longer matching when files change.
        required: false
        default: true
        type: boolean
      size:
        description: >
          Apply size/* labels and the size comment. Thresholds are decided once, in actions/pr-size,
          not per repository — this is an off switch, not a tuning knob.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The steps live in a composite so the PR-title job can run the same ones (one runner instead of two).
      - uses: quynhonsemiconductor/ci/actions/pr-labels@v1
        with:
          configuration-path: ${{ inputs.configuration_path }}
          sync-labels: ${{ inputs.sync_labels }}
          size: ${{ inputs.size }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

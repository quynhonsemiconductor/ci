# =============================================================================
# Reusable Release Commenter — when a GitHub Release is published, back-comments
# on every PR merged since the previous release with the version it shipped in,
# and adds a "released: vX.Y.Z" label. Matches the semantic-release bot UX.
#
# Caller:
#   jobs:
#     comment:
#       uses: quynhonsemiconductor/ci/.github/workflows/release-commenter.yml@v1
# =============================================================================
name: Reusable · Release Commenter

on:
  workflow_call:
    inputs:
      comment_template:
        description: >-
          Comment body template. Uses apexskier/github-release-commenter
          placeholders: {release_link} (markdown link to the release),
          {release_name}, {release_tag}.
        required: false
        default: |
          🎉 This PR is included in {release_link} 🎉

          The release is available on GitHub Releases: {release_link}.
        type: string
      label_template:
        description: Label applied to shipped PRs. Supports {release_tag}, {release_name}.
        required: false
        default: 'released: {release_tag}'
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    name: Comment on merged PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Create the label ONCE, before the action. The action labels every shipped PR in parallel (Promise.all of addLabels), and a label that
      # does not exist yet is created implicitly by each request: with two PRs in one release (a fix and its release PR) the requests race and one
      # fails with "Validation Failed ... Label name invalid" (observability v0.4.2), failing the job after the other label call had succeeded.
      # Creating it first removes the race; "already exists" (422) is the normal case on a re-run and is not an error.
      - name: Ensure the release label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABEL_TEMPLATE: ${{ inputs.label_template }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          set -euo pipefail
          name="${RELEASE_NAME:-$RELEASE_TAG}"
          label="${LABEL_TEMPLATE//\{release_tag\}/$RELEASE_TAG}"
          label="${label//\{release_name\}/$name}"
          if out=$(gh api "repos/${REPO}/labels" -f name="$label" -f color=ededed 2>&1); then
            echo "created label: $label"
          elif grep -q 'already_exists' <<<"$out"; then
            echo "label already exists: $label"
          else
            echo "::error::could not create label '$label': $out"
            exit 1
          fi

      - uses: apexskier/github-release-commenter@e7813a9625eabd79a875b4bc4046cfcae377ab34  # v1.4.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: ${{ inputs.comment_template }}
          label-template: ${{ inputs.label_template }}

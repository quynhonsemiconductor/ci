# =============================================================================
# Reusable · Actions security (zizmor) — static security audit of GitHub
# Actions workflows/composite actions (script injection, unpinned refs,
# excessive permissions, dangerous `pull_request_target` use, etc).
#
# Exists to replace CodeQL's "actions" language via Code Scanning Default
# Setup as the thing repo rulesets require. Default Setup's managed
# `Analyze (actions)` / `CodeQL` checks do not reliably report on PRs opened
# by bots (Dependabot, Renovate) — the run never fires, the required check
# sits "Expected" forever, and the PR can't merge without an admin bypass.
# zizmor is our own workflow, triggered explicitly on `pull_request` for any
# actor, so it always reports. Same rationale as the Security · Scan suite
# replacing CodeQL's app-language scanning with Semgrep (free plan, no GHAS
# dependency for the pass/fail gate).
#
# Consuming repos call this thin:
#
#   jobs:
#     actions-security:
#       uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@v1.22.0
#
# Then point the ruleset's required status check at this job's name —
# "Workflow security (actionlint, zizmor)" — instead of `Analyze (actions)` / `CodeQL`.
# =============================================================================
name: Reusable · Actions Security

on:
  workflow_call:
    inputs:
      path:
        description: >
          Single path to audit. zizmor takes exactly one input — a second
          positional argument is parsed as a remote owner/repo slug, not a
          second local path, so this must stay one value. "." recursively
          finds both workflows and composite actions from the repo root.
        required: false
        default: '.'
        type: string
      min_severity:
        description: Minimum severity that fails the run when blocking (unknown, informational, low, medium, high).
        required: false
        default: medium
        type: string
      min_confidence:
        description: >
          Minimum confidence that fails the run when blocking (unknown, low,
          medium, high). Severity and confidence are independent axes: a rule
          like template-injection is inherently high-severity regardless of
          how sure zizmor is that THIS instance is exploitable, so a
          low-confidence match on an untrusted-but-unproven value still
          counts as "high severity". Raise min_confidence (rather than
          min_severity) to gate on findings actually assessed as real without
          also gating on every low-confidence match of the same rule.
        required: false
        default: unknown
        type: string
      blocking:
        description: >
          Fail the run on findings at or above min_severity. Phased rollout:
          start false (report-only) while triaging first-run findings, then
          flip true so the check actually gates the ruleset.
        required: false
        default: false
        type: boolean
      combine:
        description: >
          DEPRECATED, IGNORED. The combined shape is the only shape: actionlint and zizmor always run as steps of ONE job, "Workflow
          security (actionlint, zizmor)". The input is still accepted so a caller that passes `combine: true` keeps working instead of
          dying at startup; delete it from callers, then delete it here.
        required: false
        default: true
        type: boolean

#
# TWO tools, two questions, and they do not overlap:
#
#   actionlint  — is this workflow VALID? Schema, expression contexts, shell.
#   zizmor      — is this workflow SAFE?  Injection, unpinned actions, permissions.
#
# actionlint is here because a schema fault is INVISIBLE in the worst possible
# way. GitHub creates the run, fails it before any job starts, and the PR shows
# NO checks rather than a red one — so it reads as "this workflow does not apply
# to these paths", not as a failure. solodesk shipped three workflows referencing
# a composite action as `@${{ env.CI_REF }}` (the `env` context is not available
# in `uses:`) and NO run of any of them ever reached a step, from the day they
# were written until 2026-09-08. actionlint names all nine occurrences in one
# second; zizmor does not, because it is not a validity question.
#
# actionlint ALWAYS blocks, deliberately, and takes no `blocking` input. zizmor's
# phased rollout makes sense for findings that need triage; an invalid workflow
# has nothing to triage — it cannot run at all, so "report-only" would mean
# merging something already known to be broken. It runs as the FIRST step of the one job, and
# zizmor runs after it even if it failed (`!cancelled()`), so neither can hide the other's findings.
#

permissions:
  contents: read

jobs:
  # actionlint then zizmor as STEPS of one job. zizmor runs even if actionlint failed (`!cancelled()`), so one
  # failure never hides the other's findings; the job fails if either did.
  workflow-security:
    name: Workflow security (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow lint (actionlint)
        uses: quynhonsemiconductor/ci/actions/lint-workflows@208f7081f59fdbe5a454d7e836d1b04ac4b04d97 # v1.24.1

      - name: Actions security (zizmor)
        if: ${{ !cancelled() }}
        uses: quynhonsemiconductor/ci/actions/audit-workflows@208f7081f59fdbe5a454d7e836d1b04ac4b04d97 # v1.24.1
        with:
          path: ${{ inputs.path }}
          min-severity: ${{ inputs.min_severity }}
          min-confidence: ${{ inputs.min_confidence }}
          blocking: ${{ inputs.blocking }}
